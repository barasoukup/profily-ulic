<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Brněnská tramvaj Škoda 45T ForCity Smart (DPMB), čelní pohled. 1 px = 1 cm, šířka vozu 2,46 m, nízká podlaha.
       Nátěr podle fotografií: červená čepice se zelenou LED tabulí, velké sklo přes celou šířku, pod ním vodorovný červený pás, černý pás se světly, bílý pás s červeným
       číslem vozu, červený spodek, černá zástěra. -->
  <!-- jednoramenný pantograf -->
  <g stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M134 104 L176 74 L150 46"/>
  </g>
  <path d="M104 46 H196" stroke="#3f4245" stroke-width="4" stroke-linecap="round"/>
  <rect x="140" y="98" width="44" height="8" rx="2" fill="#4a4b4c"/>
  <!-- kryty střešní výzbroje -->
  <path d="M68 126 L76 106 Q78 102 84 102 H236 Q242 102 244 106 L252 126 Z" fill="#c9cdd0"/>
  <path d="M232 102 H236 Q242 102 244 106 L252 126 H240 Z" fill="#aeb2b6"/>
  <!-- skříň: rovné čelo, svislé boky, červená čepice -->
  <path d="M37 392 V152 Q37 124 66 124 H254 Q283 124 283 152 V392 Z" fill="#d8262b"/>
  <!-- LED cílová tabule v čepici -->
  <rect x="78" y="132" width="164" height="22" rx="2" fill="#0d0f10"/>
  <g font-family="Arial, sans-serif" font-weight="bold" fill="#43d94c">
    <text x="86" y="149" font-size="14">4</text>
    <text x="168" y="149" font-size="12" text-anchor="middle" letter-spacing=".5">OBŘANSKÁ</text>
  </g>
  <!-- velké čelní sklo v černém rámu přes celou šířku čela (po stranách žádná červená) -->
  <path d="M37 162 H283 V290 H37 Z" fill="#17191c"/>
  <path d="M46 166 H274 V284 H46 Z" fill="#2c3944"/>
  <!-- vodorovný červený pás pod oknem -->
  <rect x="37" y="290" width="246" height="12" fill="#d8262b"/>
  <path d="M66 170 L108 170 L86 284 L62 284 Z" fill="#46596a" opacity=".55"/>
  <path d="M228 170 L248 170 L240 214 L224 214 Z" fill="#46596a" opacity=".4"/>
  <path d="M174 282 L132 236" stroke="#0e0f10" stroke-width="2" stroke-linecap="round"/>
  <!-- černý pás se světly a znakem -->
  <rect x="37" y="302" width="246" height="22" fill="#1b1d20"/>
  <circle cx="66" cy="312" r="7" fill="#eef0ea"/>
  <circle cx="86" cy="312" r="6" fill="#eef0ea"/>
  <circle cx="254" cy="312" r="7" fill="#eef0ea"/>
  <circle cx="234" cy="312" r="6" fill="#eef0ea"/>
  <circle cx="160" cy="312" r="7" fill="none" stroke="#c9cdd0" stroke-width="2"/>
  <!-- bílý pás s červeným číslem vozu a znakem Brna -->
  <rect x="37" y="324" width="246" height="28" fill="#f2f2ee"/>
  <text x="62" y="344" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d8262b">1760</text>
  <g fill="#d8262b"><rect x="116" y="334" width="5" height="5"/><rect x="125" y="334" width="5" height="5"/><rect x="134" y="334" width="5" height="5"/><rect x="143" y="333" width="3" height="7"/></g>
  <rect x="44" y="330" width="10" height="10" rx="1" fill="#2a63b8"/>
  <!-- červený spodek s malými světly -->
  <rect x="68" y="364" width="12" height="7" rx="2" fill="#f08a1c"/>
  <rect x="240" y="364" width="12" height="7" rx="2" fill="#f08a1c"/>
  <rect x="146" y="376" width="28" height="6" rx="2" fill="#a81d22"/>
  <!-- zpětné zrcátko na rameni z horního rohu -->
  <path d="M40 150 H22 Q16 150 16 156 V166" stroke="#1b1d20" stroke-width="3" fill="none"/>
  <rect x="8" y="166" width="14" height="26" rx="3" fill="#1b1d20"/>
  <!-- černá zástěra skoro ke kolejím (nízká podlaha, kola skrytá) -->
  <path d="M37 392 H283 V400 Q283 406 276 408 L268 410 H52 L44 408 Q37 406 37 400 Z" fill="#26282a"/>
  <rect x="78" y="410" width="14" height="8" fill="#8f9193"/>
  <rect x="228" y="410" width="14" height="8" fill="#8f9193"/>
  <!-- žlábkové kolejnice zapuštěné do vozovky (rozchod 1 435 mm) -->
  <rect x="74" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="88" y="418" width="4" height="2" fill="#2a2b2a"/>
  <rect x="224" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="228" y="418" width="4" height="2" fill="#2a2b2a"/>
</svg>
