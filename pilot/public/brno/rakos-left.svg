<svg viewBox="0 0 50 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Orobinec, rákos a ostřice na levém břehu povrchové retenční nádrže
       (Standardy HDV Praha, Povrchové retenční nádrže: nádrže s vegetací a umělé mokřady). Trs se kloní doprava ke středu
       nádrže, lata rákosu doleva od středu.
       Měřítko 1 px = 1 cm, viewBox 50 × 120 cm (šířka 50 cm, výška 1,2 m), spodní hrana = hladina / břeh, vodorovný střed = osa trsu.
       Předlohy: https://commons.wikimedia.org/wiki/Category:Typha_latifolia
       (např. https://commons.wikimedia.org/wiki/File:Typha_latifolia_Finland.jpg),
       https://commons.wikimedia.org/wiki/Category:Phragmites_australis, https://commons.wikimedia.org/wiki/Category:Carex_acutiformis.
       Stín vpravo (tmavší listy na straně ke středu nádrže). -->
  <!-- ostřice u vody (Carex acutiformis / C. riparia): nízký trs, listy převislé -->
  <path d="M6 120 Q3 106 1.5 102 M9 120 Q8 104 5 96 M12 120 Q14 106 18 101" fill="none" stroke="#7d9a4a" stroke-width="2" stroke-linecap="round"/>
