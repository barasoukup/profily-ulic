<svg viewBox="0 0 270 360" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(270 0) scale(-1 1)">
  <!-- Brněnský přístřešek zastávky tramvaje se šedým označníkem, zadní stěna vlevo, otevřená strana a označník vpravo (k vozovce). 1 px = 1 cm, spodní hrana = chodník. -->
  <!-- přístřešek z čela podle zásad KAM Brno (kap. 9, foto Joštova): subtilní kovová konstrukce a sklo, tenká plochá
       střecha s přesahem dopředu, rám v tmavě šedé s hnědozlatým tónem jako na Joštově, sklo s pruhem grafiky proti nárazu -->
  <g id="pristresek">
    <!-- střecha: tenká deska, spodní hrana ve stínu -->
    <rect x="12" y="96" width="190" height="6" fill="#5b4e3a"/>
    <rect x="12" y="96" width="190" height="1.6" fill="#8a7756"/>
    <rect x="22" y="102" width="180" height="2" fill="#3f3628"/>
    <!-- zadní sloup -->
    <rect x="18" y="102" width="7" height="258" fill="#5b4e3a"/>
    <rect x="23" y="102" width="2" height="258" fill="#3f3628"/>
    <!-- pás s názvem zastávky pod střechou -->
    <rect x="25" y="106" width="10" height="34" fill="#18191b"/>
    <!-- boční stěna: sklo v tenkém rámu -->
    <rect x="25" y="140" width="140" height="212" fill="#cfe0e4" opacity=".55"/>
    <rect x="25" y="140" width="140" height="3" fill="#5b4e3a"/>
    <rect x="162" y="140" width="3" height="220" fill="#5b4e3a"/>
    <rect x="25" y="350" width="140" height="3" fill="#5b4e3a"/>
    <path d="M40 330 L120 150 L140 150 L60 330 Z" fill="#f2f6f6" opacity=".7"/>
    <!-- pruh grafiky ve výšce očí -->
    <g fill="#5b4e3a" opacity=".8">
      <rect x="32" y="232" width="6" height="6"/><rect x="46" y="232" width="6" height="6"/><rect x="60" y="232" width="6" height="6"/>
      <rect x="74" y="232" width="6" height="6"/><rect x="88" y="232" width="6" height="6"/><rect x="102" y="232" width="6" height="6"/>
      <rect x="116" y="232" width="6" height="6"/><rect x="130" y="232" width="6" height="6"/><rect x="144" y="232" width="6" height="6"/>
    </g>
    <!-- lavička uvnitř -->
    <rect x="28" y="306" width="60" height="5" fill="#8a6440"/>
    <rect x="34" y="311" width="4" height="49" fill="#3d4246"/>
    <rect x="78" y="311" width="4" height="49" fill="#3d4246"/>
  </g>
  <!-- označník: šedý rám (v Brně ne červený), nahoře značka zastávky tramvaje (IJ 4b) -->
  <g id="oznacnik">
    <rect x="222" y="265" width="5" height="95" fill="#555b60"/>
    <rect x="261" y="265" width="5" height="95" fill="#555b60"/>
    <rect x="264" y="265" width="2" height="95" fill="#3d4246"/>
    <rect x="220" y="357" width="48" height="3" fill="#3d4246"/>
    <!-- dvě skříňky s jízdními řády -->
    <rect x="222" y="146" width="44" height="119" fill="#555b60"/>
    <rect x="262" y="146" width="4" height="119" fill="#3d4246"/>
    <rect x="226" y="150" width="16" height="62" fill="#f2d64b"/>
    <rect x="244" y="150" width="16" height="62" fill="#f4f4f0"/>
    <rect x="226" y="218" width="34" height="40" fill="#f4f4f0"/>
    <rect x="226" y="250" width="34" height="8" fill="#3a63b0"/>
    <!-- tabule s názvem a linkami -->
    <rect x="222" y="74" width="44" height="72" fill="#555b60"/>
    <rect x="262" y="74" width="4" height="72" fill="#3d4246"/>
    <rect x="226" y="78" width="34" height="50" fill="#f4f4f0"/>
    <rect x="230" y="84" width="26" height="4" fill="#2a2b2a"/>
    <rect x="232" y="92" width="22" height="1.5" fill="#9a9b9c"/>
    <rect x="230" y="99" width="8" height="8" fill="#2a2b2a"/>
    <rect x="239" y="99" width="8" height="8" fill="#2a2b2a"/>
    <rect x="248" y="99" width="8" height="8" fill="#555b60"/>
    <rect x="230" y="113" width="26" height="1.5" fill="#9a9b9c"/>
    <rect x="230" y="118" width="20" height="1.5" fill="#9a9b9c"/>
    <!-- značka: bílý okraj, modrý pás, bílé pole -->
    <rect x="221" y="26" width="46" height="46" rx="3" fill="#f4f4f0"/>
    <rect x="223" y="28" width="42" height="42" rx="2" fill="#1f56a8"/>
    <rect x="227" y="32" width="34" height="34" rx="1" fill="#f4f4f0"/>
    <g id="piktogram">
      <rect x="238" y="37" width="12" height="1.6" fill="#1a1a1a"/>
      <rect x="243.2" y="38" width="1.6" height="2" fill="#1a1a1a"/>
      <path d="M244 39.5 L250 43.3 L244 47.2 L238 43.3 Z" fill="#1a1a1a"/>
      <rect x="229" y="47" width="30" height="13" rx="2" fill="#1a1a1a"/>
      <rect x="231" y="49" width="5" height="4" fill="#f4f4f0"/>
      <rect x="238" y="49" width="5" height="4" fill="#f4f4f0"/>
      <rect x="245" y="49" width="5" height="4" fill="#f4f4f0"/>
      <rect x="252" y="49" width="5" height="4" fill="#f4f4f0"/>
      <rect x="231" y="60" width="9" height="2.5" fill="#1a1a1a"/>
      <rect x="248" y="60" width="9" height="2.5" fill="#1a1a1a"/>
    </g>
  </g>
  </g>
</svg>
