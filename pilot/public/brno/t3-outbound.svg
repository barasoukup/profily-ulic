<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Brněnská tramvaj Tatra T3 (T3M/T3R.P) v nátěru DPMB, zadní pohled. 1 px = 1 cm, šířka vozu 2,5 m. Stejný vůz jako t3-inbound.svg (brno/). -->
  <!-- pantograf: ze zadu stejný jako zepředu -->
  <g stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M126 104 L160 70 L194 104"/>
    <path d="M160 70 V40"/>
  </g>
  <path d="M82 46 Q86 36 96 36 H224 Q234 36 238 46" stroke="#5a5b5c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="120" y="34" width="80" height="3" fill="#3a3b3c"/>
  <rect x="123" y="102" width="8" height="7" rx="1" fill="#7a7b7c"/>
  <rect x="189" y="102" width="8" height="7" rx="1" fill="#7a7b7c"/>
  <rect x="122" y="108" width="76" height="10" rx="3" fill="#4a4b4c"/>
  <!-- zrcátka vpředu vozu, ze zadu prohozená: velké na rameni ze střechy vpravo (strana dveří), malé vlevo -->
  <path d="M210 117 H286 Q294 117 298 124 L308 160" stroke="#8a8c8e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="304" y="160" width="13" height="28" rx="2" fill="#3a3b3c"/>
  <rect x="303" y="190" width="14" height="24" rx="4" fill="#2a2b2a"/>
  <path d="M39 226 L33 230" stroke="#2a2b2a" stroke-width="3"/>
  <rect x="24" y="222" width="11" height="26" rx="4" fill="#2a2b2a"/>
  <!-- světle šedá horní část (DPMB): zaoblená střecha, boky se dolů mírně rozšiřují -->
  <path d="M39 266 L43 156 Q46 116 100 115 H220 Q274 116 277 156 L281 266 Z" fill="#e3e5e5"/>
  <path d="M268 132 Q276 142 277 156 L281 266 H270 Z" fill="#c4c7c8"/>
  <!-- zadní okno přes skoro celou šířku, vyšší než čelní sklo -->
  <path d="M46 173 Q48 157 74 156 Q160 151 246 156 Q272 157 274 173 L276 256 H44 Z" fill="#1f2a33"/>
  <path d="M51 175 Q53 163 76 162 Q160 157 244 162 Q267 163 269 175 L271 252 H49 Z" fill="#2e3b46"/>
  <path d="M51 175 Q52 167 60 165 V252 H49 Z" fill="#3a4854"/>
  <path d="M269 175 Q268 167 260 165 V252 H271 Z" fill="#3a4854"/>
  <path d="M92 165 L128 163 L106 250 L86 250 Z" fill="#46596a" opacity=".6"/>
  <!-- madlo v interiéru -->
  <g fill="#7d8790">
    <rect x="60" y="214" width="200" height="2"/>
    <rect x="96" y="214" width="2" height="38"/>
    <rect x="222" y="214" width="2" height="38"/>
  </g>
  <!-- tenké sloupky rohových skel -->
  <rect x="70" y="160" width="3" height="93" fill="#a9abad"/>
  <rect x="247" y="160" width="3" height="93" fill="#a9abad"/>
  <!-- linková tabule za sklem -->
  <rect x="137" y="218" width="46" height="34" rx="2" fill="#0d0f10"/>
  <text x="160" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#43d94c">12</text>
  <!-- stěrač zavěšený nahoře uprostřed -->
  <rect x="157" y="151" width="7" height="5" rx="1" fill="#a9abad"/>
  <path d="M160 157 L138 207" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <!-- červený pás -->
  <path d="M39 266 H281 L283 346 H37 Z" fill="#d8262b"/>
  <path d="M270 266 H281 L283 346 H271 Z" fill="#b01e22"/>
  <!-- víko nahoře v červeném pásu -->
  <rect x="134" y="268" width="52" height="17" rx="2" fill="none" stroke="#c22421" stroke-width="1.5"/>
  <!-- svítilny v rozích: blinkr nad koncovým/brzdovým světlem -->
  <rect x="46" y="300" width="12" height="36" rx="2" fill="#4a4b4c"/>
  <rect x="47" y="301" width="10" height="16" rx="1.5" fill="#f08a1c"/>
  <rect x="47" y="319" width="10" height="16" rx="1.5" fill="#c8151b"/>
  <rect x="262" y="300" width="12" height="36" rx="2" fill="#4a4b4c"/>
  <rect x="263" y="301" width="10" height="16" rx="1.5" fill="#f08a1c"/>
  <rect x="263" y="319" width="10" height="16" rx="1.5" fill="#c8151b"/>
  <!-- číslo vozu, odrazky a osvětlení čísla nad nárazníkem -->
  <text x="160" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#f6f7f7">1600</text>
  <rect x="97" y="335" width="20" height="10" rx="1.5" fill="#4a4b4c"/>
  <rect x="98.5" y="336.5" width="17" height="7" rx="1" fill="#b8141b"/>
  <rect x="203" y="335" width="20" height="10" rx="1.5" fill="#4a4b4c"/>
  <rect x="204.5" y="336.5" width="17" height="7" rx="1" fill="#b8141b"/>
  <rect x="150" y="335" width="20" height="9" rx="1.5" fill="#c9cbcd"/>
  <rect x="152" y="337" width="16" height="5" rx="1" fill="#f4f4f0"/>
  <!-- světle šedá zástěra pod červeným pásem -->
  <rect x="34" y="344" width="252" height="18" rx="4" fill="#e3e5e5"/>
  <rect x="34" y="346" width="252" height="3" fill="#f6f7f7"/>
  <!-- otevřený prostor pod nárazníkem: rám a spřáhlo zavěšené v ose -->
  <rect x="88" y="362" width="144" height="22" fill="#2a2b2a"/>
  <rect x="96" y="384" width="128" height="5" fill="#3a3b3c"/>
  <rect x="156" y="362" width="8" height="24" fill="#4a4b4c"/>
  <rect x="149" y="384" width="22" height="12" rx="2" fill="#5a5b5c"/>
  <!-- krémové rohy zástěry s kulatými odrazkami -->
  <path d="M48 362 H88 V402 H62 Q53 402 52 394 Z" fill="#e3e5e5"/>
  <path d="M232 362 H272 L268 394 Q267 402 258 402 H232 Z" fill="#e3e5e5"/>
  <path d="M260 362 H272 L268 394 Q267 402 258 402 Z" fill="#c4c7c8"/>
  <circle cx="72" cy="372" r="6" fill="#c9cbcd"/>
  <circle cx="72" cy="372" r="4.5" fill="#c8151b"/>
  <circle cx="248" cy="372" r="6" fill="#c9cbcd"/>
  <circle cx="248" cy="372" r="4.5" fill="#c8151b"/>
  <!-- podvozek: rám a ložiskové skříně -->
  <rect x="72" y="402" width="176" height="8" fill="#2a2b2a"/>
  <rect x="64" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <rect x="244" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <!-- ocelová kola, okolek na vnitřní hraně -->
  <path d="M78 402 H92 V420 H88 V418 H78 Z" fill="#8f9193"/>
  <path d="M228 402 H242 V418 H232 V420 H228 Z" fill="#8f9193"/>
  <rect x="78" y="402" width="3" height="16" fill="#b5b7b9"/>
  <rect x="239" y="402" width="3" height="16" fill="#b5b7b9"/>
  <!-- žlábkové kolejnice zapuštěné do vozovky (rozchod 1 435 mm) -->
  <rect x="74" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="88" y="418" width="4" height="2" fill="#2a2b2a"/>
  <rect x="224" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="228" y="418" width="4" height="2" fill="#2a2b2a"/>
</svg>
