  <!-- Fotky, ze kterých kresba vychází: Commons: „Praha, Zenklova, označník tramvajové zastávky Vychovatelna (1).jpg“ (Jan Polák, CC BY-SA 3.0), „Jindřišská, zastávkový sloupek u Jeruzalémské.jpg“ (ŠJů, CC BY 4.0); pro srovnání nový tmavý označník „Praha, Palackého náměstí, nový zastávkový označník 01.jpg“ a „… 02.jpg“ (Aktron, CC BY-SA 4.0), nekreslen. -->
