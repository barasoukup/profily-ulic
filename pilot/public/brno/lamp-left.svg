<svg viewBox="0 0 370 930" xmlns="http://www.w3.org/2000/svg">
  <!-- Brněnská lampa veřejného osvětlení, výložník doleva nad vozovku. 1 px = 1 cm.
       Podle zásad KAM Brno (Principy tvorby veřejných prostranství, kap. 9): kovový mobiliář v tmavě šedé
       (antracit) místo černé, oživený doplňkovou barvou (lampy na Zelném trhu do olivově zelené).
       Kuželový ocelový stožár, rovný mírně stoupající výložník, ploché LED svítidlo. Pata v ose x = 348 jako u Streetmixu.
       Stožár a výložník zesíleno pro čitelnost (asi 1,3×). -->
  <!-- výložník: rovná trubka stoupající asi o 5° -->
  <path d="M346 214 L214 196" stroke="#3d4246" stroke-width="9" stroke-linecap="round"/>
  <path d="M346 217.5 L214 199.5" stroke="#2c3033" stroke-width="2.5"/>
  <!-- ploché LED svítidlo na konci výložníku -->
  <path d="M226 188 L146 184 Q140 184 140 188 L140 194 L226 199 Z" fill="#3d4246"/>
  <path d="M226 188 L146 184 Q140 184 140 188 L140 189 L226 190 Z" fill="#50565a"/>
  <path d="M148 192 L214 195.6 L214 198 L148 194.4 Z" fill="#c7cfce"/>
  <!-- olivový prstenec pod výložníkem (doplňková barva) -->
  <rect x="340" y="226" width="16" height="7" fill="#7c8a3e"/>
  <!-- kuželový stožár: nahoru se zužuje -->
  <path d="M342 204 H354 L360 822 H336 Z" fill="#3d4246"/>
  <path d="M350 204 H354 L360 822 H352 Z" fill="#2c3033"/>
  <path d="M343 204 H345 L339.5 822 H337.5 Z" fill="#555b60"/>
  <rect x="341" y="198" width="14" height="8" rx="2" fill="#3d4246"/>
  <!-- evidenční štítek -->
  <rect x="339" y="760" width="10" height="3" fill="#e6e6e1"/>
  <!-- patka -->
  <path d="M332 822 H364 L366 930 H330 Z" fill="#33373a"/>
  <path d="M354 822 H364 L366 930 H355 Z" fill="#26292b"/>
  <rect x="336" y="852" width="8" height="30" rx="1" fill="#26292b"/>
</svg>
