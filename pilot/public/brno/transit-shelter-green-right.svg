<svg viewBox="0 0 270 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Brněnský přístřešek zastávky autobusu (zásady KAM Brno, kap. 9) s extenzivní vegetační střechou a šedým označníkem,
       zadní stěna vpravo, otevřená strana a označník vlevo (k vozovce).
       Měřítko 1 px = 1 cm, viewBox 270 × 360 cm, spodní hrana = chodník; zelená střecha 12 cm (substrát 8 cm + drenáž 2 cm
       + lem v barvě rámu), vrch rostlin asi 2,8 m nad chodníkem.
       Přístřešek a označník beze změny z transit-shelter-left.svg; střecha podle fotek zelených zastávek:
       https://commons.wikimedia.org/wiki/File:A_JCDecaux_bus_shelter_outside_the_Jardin_du_Luxembourg.jpg (Paříž),
       utrechtské „bijenhaltes“ (https://commons.wikimedia.org/wiki/Category:Bus_shelters_in_the_Netherlands),
       rostliny https://commons.wikimedia.org/wiki/Category:Sedum_album, https://commons.wikimedia.org/wiki/Category:Sedum_acre,
       https://commons.wikimedia.org/wiki/Category:Festuca_glauca; souvrství podle Standardů HDV Praha, kap. 5.1.1.
       Zrcadlový obraz -left přes transform, proto stín vlevo: tmavší levá část polštářů. -->
  <g transform="matrix(-1 0 0 1 270 0)">
  <!-- přístřešek z čela podle zásad KAM Brno (kap. 9, foto Joštova): subtilní kovová konstrukce a sklo, tenká plochá
       střecha s přesahem dopředu, rám v tmavě šedé s hnědozlatým tónem jako na Joštově, sklo s pruhem grafiky proti nárazu -->
  <g id="pristresek">
    <!-- střecha: tenká deska, spodní hrana ve stínu -->
    <rect x="12" y="96" width="190" height="6" fill="#5b4e3a"/>
    <rect x="12" y="96" width="190" height="1.6" fill="#8a7756"/>
    <rect x="22" y="102" width="180" height="2" fill="#3f3628"/>
    <!-- zadní sloup -->
    <rect x="18" y="102" width="7" height="258" fill="#5b4e3a"/>
    <rect x="23" y="102" width="2" height="258" fill="#3f3628"/>
    <!-- pás s názvem zastávky pod střechou -->
    <rect x="25" y="106" width="10" height="34" fill="#18191b"/>
    <!-- boční stěna: sklo v tenkém rámu -->
    <rect x="25" y="140" width="140" height="212" fill="#cfe0e4" opacity=".55"/>
    <rect x="25" y="140" width="140" height="3" fill="#5b4e3a"/>
    <rect x="162" y="140" width="3" height="220" fill="#5b4e3a"/>
    <rect x="25" y="350" width="140" height="3" fill="#5b4e3a"/>
    <path d="M40 330 L120 150 L140 150 L60 330 Z" fill="#f2f6f6" opacity=".7"/>
    <!-- pruh grafiky ve výšce očí -->
    <g fill="#5b4e3a" opacity=".8">
      <rect x="32" y="232" width="6" height="6"/><rect x="46" y="232" width="6" height="6"/><rect x="60" y="232" width="6" height="6"/>
      <rect x="74" y="232" width="6" height="6"/><rect x="88" y="232" width="6" height="6"/><rect x="102" y="232" width="6" height="6"/>
      <rect x="116" y="232" width="6" height="6"/><rect x="130" y="232" width="6" height="6"/><rect x="144" y="232" width="6" height="6"/>
    </g>
    <!-- lavička uvnitř -->
    <rect x="28" y="306" width="60" height="5" fill="#8a6440"/>
    <rect x="34" y="311" width="4" height="49" fill="#3d4246"/>
    <rect x="78" y="311" width="4" height="49" fill="#3d4246"/>
  </g>
  <!-- extenzivní vegetační střecha (Standardy HDV Praha, kap. 5.1.1): drenážní a hydroizolační vrstva 2 cm,
       substrát 8 cm, rozchodníky a nízké traviny; obrubový profil (hliníkový lem) na obou koncích vany -->
  <g id="zelena-strecha">
    <!-- drenážní rohož a hydroizolace -->
    <path d="M15 96 L199 96 L199 94 L15 94 Z" fill="#4a4036"/>
    <!-- substrát -->
    <path d="M15 94 L199 94 L199 86 L15 86 Z" fill="#8a7458"/>
    <path d="M15 94 L199 94 L199 91.5 L15 91.5 Z" fill="#6e5c45"/>
    <!-- rozchodníky (Sedum album, S. acre; dva polštáře S. spurium ‚Coccineum‘ karmínové): tmavší pravá část = stín (před zrcadlením) -->
    <path d="M15.5 87.5 Q20 77.8 24.5 87.5 Z" fill="#4f8a35"/>
    <path d="M15.5 87.5 Q19.3 77.8 22 87.5 Z" fill="#6aa84f"/>
    <path d="M22.5 87.5 Q28.3 80.2 34 87.5 Z" fill="#5f8f3a"/>
    <path d="M22.5 87.5 Q27.3 80.2 30.8 87.5 Z" fill="#86b46a"/>
