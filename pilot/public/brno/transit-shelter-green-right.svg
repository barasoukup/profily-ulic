    <path d="M138.5 87.5 Q143.1 79.3 147.6 87.5 Z" fill="#5f8f3a"/>
    <path d="M138.5 87.5 Q142.3 79.3 145.1 87.5 Z" fill="#86b46a"/>
    <path d="M145.6 87.5 Q152.4 76.2 159.2 87.5 Z" fill="#9e3b3b"/>
    <path d="M145.6 87.5 Q151.3 76.2 155.4 87.5 Z" fill="#c05a55"/>
    <path d="M156.2 87.5 Q160.8 78.2 165.3 87.5 Z" fill="#6c7a2a"/>
    <path d="M156.2 87.5 Q160 78.2 162.8 87.5 Z" fill="#8f9a3c"/>
    <path d="M163.3 87.5 Q171.4 77.4 179.4 87.5 Z" fill="#4f8a35"/>
    <path d="M163.3 87.5 Q170.1 77.4 174.9 87.5 Z" fill="#6aa84f"/>
    <path d="M175.9 87.5 Q180.8 76.8 185.7 87.5 Z" fill="#5f8f3a"/>
    <path d="M175.9 87.5 Q180 76.8 182.9 87.5 Z" fill="#86b46a"/>
    <path d="M183.5 87.5 Q191.3 78.6 199 87.5 Z" fill="#4f8a35"/>
    <path d="M183.5 87.5 Q190 78.6 194.7 87.5 Z" fill="#6aa84f"/>
    <path d="M195.6 87.5 Q197.3 80.4 199 87.5 Z" fill="#5f8f3a"/>
    <path d="M195.6 87.5 Q197 80.4 198 87.5 Z" fill="#86b46a"/>
    <!-- kvítky rozchodníků: žluté (S. acre) a růžovobílé (S. album) -->
    <circle cx="27.1" cy="83.1" r="1.7" fill="#f2c94c"/>
    <circle cx="48.5" cy="81.8" r="1.7" fill="#f1dfe0"/>
    <circle cx="59.2" cy="82.4" r="1.7" fill="#f2c94c"/>
    <circle cx="70" cy="80.7" r="1.7" fill="#f2c94c"/>
    <circle cx="95.3" cy="82.9" r="1.7" fill="#f1dfe0"/>
    <circle cx="114.3" cy="81.5" r="1.7" fill="#f2c94c"/>
    <circle cx="142.1" cy="82.6" r="1.7" fill="#f2c94c"/>
    <circle cx="149.7" cy="82.6" r="1.7" fill="#f1dfe0"/>
    <circle cx="155" cy="81.6" r="1.7" fill="#f2c94c"/>
    <circle cx="188.9" cy="82.2" r="1.7" fill="#f1dfe0"/>
    <!-- nízké traviny (kostřava sivá, Festuca glauca): trsy 10–15 cm, nepravidelně, jeden nižší, jeden zrcadlený -->
    <path d="M39 87 Q38 80.4 36 76 M40.2 87 Q39.8 78.6 39 73 M41.4 87 Q41.6 78 42 72 M42.6 87 Q43.4 79.8 45 75 M43.4 87 Q44.6 81.6 47 78" fill="none" stroke="#7d9a6a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M42 87 Q44 80 46 76" fill="none" stroke="#5f7a52" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M77 87 Q76 81.7 74 78.2 M78.2 87 Q77.8 80.3 77 75.8 M79.4 87 Q79.6 79.8 80 75 M80.6 87 Q81.4 81.2 83 77.4 M81.4 87 Q82.6 82.7 85 79.8" fill="none" stroke="#7d9a6a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M80 87 Q82 81.4 84 78.2" fill="none" stroke="#5f7a52" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M136 87 Q137 80.4 139 76 M134.8 87 Q135.2 78.6 136 73 M133.6 87 Q133.4 78 133 72 M132.4 87 Q131.6 79.8 130 75 M131.6 87 Q130.4 81.6 128 78" fill="none" stroke="#7d9a6a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M133 87 Q131 80 129 76" fill="none" stroke="#5f7a52" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M162 87 Q161 80.4 159 76 M163.2 87 Q162.8 78.6 162 73 M164.4 87 Q164.6 78 165 72 M165.6 87 Q166.4 79.8 168 75 M166.4 87 Q167.6 81.6 170 78" fill="none" stroke="#7d9a6a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M165 87 Q167 80 169 76" fill="none" stroke="#5f7a52" stroke-width="1.6" stroke-linecap="round"/>
    <!-- obrubový profil: hliníkový lem, drží substrát, světlejší horní hrana -->
    <rect x="12" y="84" width="3" height="12.5" fill="#5b4e3a"/>
    <rect x="12" y="84" width="3" height="1.2" fill="#8a7756"/>
    <rect x="199" y="84" width="3" height="12.5" fill="#5b4e3a"/>
    <rect x="199" y="84" width="3" height="1.2" fill="#8a7756"/>
  </g>
  <!-- označník: šedý rám (v Brně ne červený), nahoře značka zastávky autobusu (IJ 4a) -->
  <g id="oznacnik">
    <rect x="222" y="265" width="5" height="95" fill="#555b60"/>
    <rect x="261" y="265" width="5" height="95" fill="#555b60"/>
    <rect x="264" y="265" width="2" height="95" fill="#3d4246"/>
    <rect x="220" y="357" width="48" height="3" fill="#3d4246"/>
    <!-- dvě skříňky s jízdními řády -->
    <rect x="222" y="146" width="44" height="119" fill="#555b60"/>
    <rect x="262" y="146" width="4" height="119" fill="#3d4246"/>
    <rect x="226" y="150" width="16" height="62" fill="#f2d64b"/>
    <rect x="244" y="150" width="16" height="62" fill="#f4f4f0"/>
    <rect x="226" y="218" width="34" height="40" fill="#f4f4f0"/>
    <rect x="226" y="250" width="34" height="8" fill="#3a63b0"/>
    <!-- tabule s názvem a linkami -->
    <rect x="222" y="74" width="44" height="72" fill="#555b60"/>
    <rect x="262" y="74" width="4" height="72" fill="#3d4246"/>
    <rect x="226" y="78" width="34" height="50" fill="#f4f4f0"/>
    <rect x="230" y="84" width="26" height="4" fill="#2a2b2a"/>
    <rect x="232" y="92" width="22" height="1.5" fill="#9a9b9c"/>
    <rect x="230" y="99" width="8" height="8" fill="#2a2b2a"/>
    <rect x="239" y="99" width="8" height="8" fill="#2a2b2a"/>
    <rect x="248" y="99" width="8" height="8" fill="#555b60"/>
    <rect x="230" y="113" width="26" height="1.5" fill="#9a9b9c"/>
    <rect x="230" y="118" width="20" height="1.5" fill="#9a9b9c"/>
    <!-- značka: bílý okraj, modrý pás, bílé pole -->
    <rect x="221" y="26" width="46" height="46" rx="3" fill="#f4f4f0"/>
    <rect x="223" y="28" width="42" height="42" rx="2" fill="#1f56a8"/>
    <rect x="227" y="32" width="34" height="34" rx="1" fill="#f4f4f0"/>
    <g id="piktogram">
      <rect x="230" y="45" width="28" height="13" rx="2" fill="#1a1a1a"/>
