    <path d="M54.1 87.5 Q60.5 78.8 66.9 87.5 Z" fill="#4f8a35"/>
    <path d="M54.1 87.5 Q59.5 78.8 63.3 87.5 Z" fill="#6aa84f"/>
    <path d="M64.1 87.5 Q69.5 76.2 74.8 87.5 Z" fill="#9e3b3b"/>
    <path d="M64.1 87.5 Q68.6 76.2 71.8 87.5 Z" fill="#c05a55"/>
    <path d="M72.5 87.5 Q77.5 78.2 82.6 87.5 Z" fill="#4f8a35"/>
    <path d="M72.5 87.5 Q76.7 78.2 79.8 87.5 Z" fill="#6aa84f"/>
    <path d="M80.4 87.5 Q87.2 75.5 94.1 87.5 Z" fill="#5f8f3a"/>
    <path d="M80.4 87.5 Q86.1 75.5 90.2 87.5 Z" fill="#86b46a"/>
    <path d="M91.1 87.5 Q97.1 80 103.1 87.5 Z" fill="#3f7a2d"/>
    <path d="M91.1 87.5 Q96.1 80 99.7 87.5 Z" fill="#5f8f3a"/>
    <path d="M100.5 87.5 Q105.8 76.1 111.2 87.5 Z" fill="#6c7a2a"/>
    <path d="M100.5 87.5 Q105 76.1 108.2 87.5 Z" fill="#8f9a3c"/>
    <path d="M108.8 87.5 Q115.7 77.2 122.6 87.5 Z" fill="#4f8a35"/>
    <path d="M108.8 87.5 Q114.6 77.2 118.7 87.5 Z" fill="#6aa84f"/>
    <path d="M119.6 87.5 Q126 79.1 132.4 87.5 Z" fill="#5f8f3a"/>
    <path d="M119.6 87.5 Q125 79.1 128.8 87.5 Z" fill="#86b46a"/>
    <path d="M129.6 87.5 Q135.3 75.7 141 87.5 Z" fill="#4f8a35"/>
