<!-- Tramvaj Bombardier Flexity Outlook (Cityrunner, řada 301–, Innsbrucker Verkehrsbetriebe, IVB; obousměrná, šířka 2,40 m, celá skříň červená, čelní sklo v černém rámu, nad ním černý panel s bílým nápisem cíle podle vozu 327, nad panelem v kapotáži střechy jedno velké kulaté světlo, dole v rozích v tmavém šikmém pouzdře větší světlo níž a uvnitř, menší výš a vně, na vnějším konci oranžová směrovka; uprostřed prohnuté spáry tmavý ovál krytu spřáhla, nárazník pod tmavou spárou prohnutou dolů, stěrač sklopený vpravo dole), čelní pohled.
     Vycházeno z fotek na Wikimedia Commons (ne obkresleno): „Bombardier Flexity 327 Innsbruck.jpg“ (bílý nápis cíle), „IVB tram car no 351 … Bergisel terminus.jpg“, „IVB Bombardier Flexity Outlook Tram, Innsbruck.JPG“; Wikipedia de „Straßenbahn Innsbruck“ (šířka 2,4 m). 1 px = 1 cm. -->
