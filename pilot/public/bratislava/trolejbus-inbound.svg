<!-- Trolejbus Škoda 27Tr Solaris (skříň Solaris Urbino 18 IV. generace, kloubový, vozy řady 67xx dodávané od 2023, linky 40 a 61), Dopravný podnik Bratislava (DPB), čelní pohled. Nátěr DPB: červená skříň, celé horní čelo černé (čelní sklo v černém rámu až skoro k nárazníku, dole mírně prohnutý přechod do červené), nahoře tenký červený lem střechy, za sklem nahoře široká LED tabule s velkým číslem linky v červeném poli a bílým textem cíle na černém, dole v červené uprostřed červený ovál s tenkým tmavě červeným obrysem a v něm kulatý odznak Škoda (tmavý střed, stříbrný kroužek), v dolních rozích černé klínové vložky se dvěma kulatými bílými světly, horní okraj klínu klesá od vnějšího rohu dovnitř, mezi klínem a SPZ zůstává asi 25 cm červeného nárazníku, na nízkém vnitřním konci klínu tři krátké vodorovné šedé lamely stupňovitě nad sebou; pod světly červený lem nárazníku, který kolem mlhovky v malém černém výklenku tvoří červený rámeček ve tvaru C a dovnitř stoupá šikmo jen pod lamely; místo státní SPZ červené pole s bílým nápisem „DPB 6730“ (na fotkách 27Tr bílá SPZ s modrým pruhem není); na straně dveří (vlevo při pohledu zepředu) zrcátko „beraní roh“ (černé rameno od střechy, velká černá hlava), na straně řidiče menší zrcátko na krátkém rameni z horního rohu A-sloupku, světle šedý kryt výzbroje na střeše s kovovým zábradlím (stejný jako zezadu), dvě světle stříbrnošedé tyče sběračů s tmavými hlavicemi a světlými špičkami. Vycházeno z fotek na Wikimedia Commons (ne obkresleno): „Bratislava, Pozsony, bus, 5.jpg“ (čelo vozu 6730, linka 61 Letisko), „Škoda 27Tr Solaris Bratislava.jpg“ (Nonscio, 2024, vůz 6728, kategorie Škoda 27Tr Solaris in Bratislava). 1 px = 1 cm. -->
