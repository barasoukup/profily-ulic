<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Liberecká tramvaj Tatra T3R.SLF / T3R.PLF, zadní pohled v zeleno-bílém nátěru DPMLJ. 1 px = 1 cm, šířka
       vozu 2,5 m. Stejný vůz jako tram-inbound.svg (liberec/). Jednosměrný vůz: tvar zádě podle fotky
       https://commons.wikimedia.org/wiki/File:Liberec_tram_2025_1.jpg (vůz v reklamě: zadní okno přes celou šířku,
       nad ním tabule s číslem linky, svítilny v rozích), barvy podle
       https://commons.wikimedia.org/wiki/File:Tatra_T3R.SLF_č._44,_Liberec.jpg
       https://commons.wikimedia.org/wiki/File:L08_411_Wendeschleife_Fügnerová,_ET_82.jpg -->
  <!-- pantograf: silný sloupek ze střechy, nahoře ramena do V (ze zadu stejný jako zepředu) -->
  <g stroke="#d9b81f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 104 V72" stroke-width="6"/>
    <path d="M160 72 L128 40 M160 72 L192 40" stroke-width="3"/>
  </g>
  <path d="M82 46 Q86 36 96 36 H224 Q234 36 238 46" stroke="#5a5b5c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="120" y="34" width="80" height="3" fill="#3a3b3c"/>
  <rect x="122" y="104" width="76" height="12" rx="3" fill="#4a4b4c"/>
  <!-- bílý kryt klimatizace -->
  <rect x="128" y="96" width="64" height="12" rx="3" fill="#eceeee"/>
  <!-- zrcátka vpředu vozu, ze zadu prohozená: velké na žlutém rameni vpravo, malé vlevo -->
  <path d="M220 126 H286 Q294 126 298 133 L308 166" stroke="#e8b923" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="302" y="166" width="14" height="30" rx="4" fill="#2a2b2a"/>
  <path d="M39 232 L33 236" stroke="#2a2b2a" stroke-width="3"/>
  <rect x="24" y="228" width="11" height="26" rx="4" fill="#2a2b2a"/>
  <!-- bílá skříň -->
  <path d="M39 346 L43 156 Q46 116 100 115 H220 Q274 116 277 156 L281 346 Z" fill="#f4f5f4"/>
  <!-- zelený okraj střechy -->
  <path d="M43 156 Q46 116 100 115 H220 Q274 116 277 156 L277 160 Q262 140 220 138 H100 Q58 140 43 160 Z" fill="#1f9a76"/>
  <!-- tabule s číslem linky nad zadním oknem -->
  <rect x="136" y="142" width="48" height="20" rx="2" fill="#0d0f10"/>
  <text x="160" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#43d94c">3</text>
  <!-- zelený rám zadního okna -->
  <path d="M42 170 Q44 166 52 166 H268 Q276 166 278 170 L280 262 H40 Z" fill="#1f9a76"/>
  <path d="M50 177 Q52 172 60 172 H260 Q268 172 270 177 L271 254 H49 Z" fill="#2e3b46"/>
  <path d="M92 176 L126 176 L106 250 L86 250 Z" fill="#46596a" opacity=".6"/>
  <!-- madlo v interiéru -->
  <g fill="#7d8790">
    <rect x="58" y="216" width="204" height="2"/>
    <rect x="96" y="216" width="2" height="38"/>
    <rect x="222" y="216" width="2" height="38"/>
  </g>
  <rect x="70" y="172" width="3" height="82" fill="#c9cccd"/>
  <rect x="247" y="172" width="3" height="82" fill="#c9cccd"/>
  <!-- svítilny v rozích: blinkr nad koncovým/brzdovým světlem -->
  <path d="M270 262 H280 L281 346 H271 Z" fill="#000" opacity=".06"/>
  <rect x="46" y="290" width="12" height="36" rx="2" fill="#4a4b4c"/>
  <rect x="47" y="291" width="10" height="16" rx="1.5" fill="#f08a1c"/>
  <rect x="47" y="309" width="10" height="16" rx="1.5" fill="#c8151b"/>
  <rect x="262" y="290" width="12" height="36" rx="2" fill="#4a4b4c"/>
  <rect x="263" y="291" width="10" height="16" rx="1.5" fill="#f08a1c"/>
  <rect x="263" y="309" width="10" height="16" rx="1.5" fill="#c8151b"/>
  <!-- číslo vozu a odrazky -->
  <text x="160" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#22324a">44</text>
  <rect x="97" y="326" width="20" height="10" rx="1.5" fill="#4a4b4c"/>
  <rect x="98.5" y="327.5" width="17" height="7" rx="1" fill="#b8141b"/>
  <rect x="203" y="326" width="20" height="10" rx="1.5" fill="#4a4b4c"/>
  <rect x="204.5" y="327.5" width="17" height="7" rx="1" fill="#b8141b"/>
  <!-- černý nárazník -->
  <rect x="36" y="344" width="248" height="16" rx="3" fill="#1d1f20"/>
  <!-- otevřený prostor pod nárazníkem: rám a spřáhlo zavěšené v ose -->
  <rect x="88" y="360" width="144" height="24" fill="#2a2b2a"/>
  <rect x="96" y="384" width="128" height="5" fill="#3a3b3c"/>
  <rect x="156" y="360" width="8" height="26" fill="#4a4b4c"/>
  <rect x="149" y="384" width="22" height="12" rx="2" fill="#b39528"/>
  <!-- zelené rohy zástěry s kulatými odrazkami -->
  <path d="M48 360 H88 V402 H62 Q53 402 52 394 Z" fill="#1f9a76"/>
  <path d="M232 360 H272 L268 394 Q267 402 258 402 H232 Z" fill="#1f9a76"/>
  <path d="M260 360 H272 L268 394 Q267 402 258 402 Z" fill="#17805f"/>
  <circle cx="72" cy="372" r="6" fill="#c9cbcd"/>
  <circle cx="72" cy="372" r="4.5" fill="#c8151b"/>
  <circle cx="248" cy="372" r="6" fill="#c9cbcd"/>
  <circle cx="248" cy="372" r="4.5" fill="#c8151b"/>
  <!-- podvozek: rám a ložiskové skříně -->
  <rect x="72" y="402" width="176" height="8" fill="#2a2b2a"/>
  <rect x="64" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <rect x="244" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <!-- ocelová kola, okolek na vnitřní hraně -->
  <path d="M78 402 H92 V420 H88 V418 H78 Z" fill="#8f9193"/>
  <path d="M228 402 H242 V418 H232 V420 H228 Z" fill="#8f9193"/>
  <rect x="78" y="402" width="3" height="16" fill="#b5b7b9"/>
  <rect x="239" y="402" width="3" height="16" fill="#b5b7b9"/>
  <!-- žlábkové kolejnice zapuštěné do vozovky (rozchod 1 435 mm) -->
  <rect x="74" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="88" y="418" width="4" height="2" fill="#2a2b2a"/>
  <rect x="224" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="228" y="418" width="4" height="2" fill="#2a2b2a"/>
</svg>
