<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Liberecká tramvaj Tatra T3R.SLF / T3R.PLF, zadní pohled v zeleno-bílém nátěru DPMLJ. 1 px = 1 cm, šířka
       vozu 2,5 m. Stejný vůz jako tram-inbound.svg (liberec/). Jednosměrný vůz: záď podle fotky vozu 46
       přímo zezadu (Commons) a https://commons.wikimedia.org/wiki/File:Liberec_tram_2025_1.jpg: vysoké zadní okno
       přes celou šířku se žlutým madlem, nad ním v bílém pásu jen šedé číslo vozu (žádná tabule), za sklem dole světlá
       deska, pod oknem kolečko „1435“ v ose a šedý box vpravo, šedobéžová tažná příčka, svítilny až na hraně skříně bez rámečku, zelené rohy zástěry od okraje s odrazkami nahoře venku, tři světla nad dvoudílným nárazníkem. Barvy podle
       https://commons.wikimedia.org/wiki/File:Tatra_T3R.SLF_č._44,_Liberec.jpg
       https://commons.wikimedia.org/wiki/File:L08_411_Wendeschleife_Fügnerová,_ET_82.jpg -->
  <!-- pantograf: silný sloupek ze střechy, nahoře ramena do V (ze zadu stejný jako zepředu) -->
  <g stroke="#d9b81f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 104 V72" stroke-width="6"/>
    <path d="M160 72 L128 40 M160 72 L192 40" stroke-width="3"/>
  </g>
  <path d="M82 46 Q86 36 96 36 H224 Q234 36 238 46" stroke="#5a5b5c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="120" y="34" width="80" height="3" fill="#3a3b3c"/>
  <rect x="122" y="104" width="76" height="12" rx="3" fill="#4a4b4c"/>
  <!-- bílý kryt klimatizace -->
  <rect x="110" y="94" width="100" height="14" rx="4" fill="#eceeee"/>
  <!-- zrcátka vpředu vozu, ze zadu prohozená: velké na žlutém rameni vpravo, malé vlevo -->
  <path d="M220 126 H286 Q294 126 298 133 L308 166" stroke="#e8b923" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="302" y="166" width="14" height="30" rx="4" fill="#2a2b2a"/>
  <path d="M39 232 L33 236" stroke="#2a2b2a" stroke-width="3"/>
  <rect x="24" y="228" width="11" height="26" rx="4" fill="#2a2b2a"/>
  <!-- bílá skříň -->
  <path d="M39 346 L43 156 Q46 116 100 115 H220 Q274 116 277 156 L281 346 Z" fill="#f4f5f4"/>
  <!-- zelený okraj střechy -->
  <path d="M43 156 Q46 116 100 115 H220 Q274 116 277 156 L277 158 Q262 134 220 132 H100 Q58 134 43 158 Z" fill="#1f9a76"/>
  <!-- číslo vozu v bílém pásu nad zadním oknem -->
  <text x="160" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#868a8e">44</text>
  <!-- zelený rám zadního okna -->
  <path d="M42 167 Q43 164 50 164 H270 Q277 164 278 167 L280 266 H40 Z" fill="#1f9a76"/>
  <path d="M47 171 Q49 167 57 167 H263 Q271 167 273 171 L274 257 H46 Z" fill="#2e3b46"/>
  <path d="M92 170 L126 170 L106 253 L86 253 Z" fill="#46596a" opacity=".6"/>
  <!-- žluté madlo v interiéru -->
  <g fill="#e3b324">
    <rect x="70" y="222" width="177" height="2.5"/>
    <rect x="96" y="222" width="2.5" height="35"/>
    <rect x="219" y="222" width="2.5" height="35"/>
  </g>
  <!-- světlá prázdná deska za sklem uprostřed dole -->
  <rect x="145" y="226" width="51" height="29" fill="#c4c9cc" opacity=".85"/>
  <rect x="70" y="167" width="3" height="90" fill="#c9cccd"/>
  <rect x="247" y="167" width="3" height="90" fill="#c9cccd"/>
  <!-- svítilny v rozích: blinkr nad koncovým/brzdovým světlem -->
  <path d="M270 266 H280 L281 346 H271 Z" fill="#000" opacity=".06"/>
  <rect x="42" y="299" width="10" height="15" rx="1.5" fill="#f08a1c"/>
  <rect x="42" y="316" width="10" height="13" rx="1.5" fill="#c8151b"/>
  <rect x="268" y="299" width="10" height="15" rx="1.5" fill="#f08a1c"/>
  <rect x="268" y="316" width="10" height="13" rx="1.5" fill="#c8151b"/>
  <!-- kolečko rozchodu „1435“ v ose a šedý box vpravo pod oknem -->
  <circle cx="156" cy="276" r="8" fill="#d0202a"/>
  <text x="156" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" fill="#fff">1435</text>
  <rect x="183" y="268" width="12" height="16" rx="1" fill="#bfc2c1"/>
  <!-- koncová světla a couvací světlo uprostřed -->
  <rect x="98" y="327" width="18" height="8" rx="1" fill="#b8141b" stroke="#6a6c6e" stroke-width=".5"/>
  <rect x="204" y="327" width="18" height="8" rx="1" fill="#b8141b" stroke="#6a6c6e" stroke-width=".5"/>
  <rect x="151" y="327" width="18" height="8" rx="1" fill="#e6e8ea" stroke="#6a6c6e" stroke-width=".5"/>
  <!-- černý nárazník ze dvou dílů, uprostřed žlutý držák -->
  <rect x="36" y="344" width="119" height="16" rx="3" fill="#1d1f20"/>
  <rect x="165" y="344" width="119" height="16" rx="3" fill="#1d1f20"/>
  <rect x="154" y="346" width="12" height="10" rx="1.5" fill="#d9b81f"/>
  <!-- otevřený prostor pod nárazníkem: rám a spřáhlo zavěšené v ose -->
  <rect x="80" y="360" width="160" height="24" fill="#2a2b2a"/>
  <path d="M99 384 H221 L224 387 V388 L221 391 H99 L96 388 V387 Z" fill="#a9a79f"/>
  <rect x="156" y="360" width="8" height="24" fill="#4a4b4c"/>
  <rect x="149" y="384" width="22" height="12" rx="2" fill="#b39528"/>
  <!-- zelené rohy zástěry s kulatými odrazkami -->
  <path d="M40 360 H80 V402 H54 Q45 402 44 394 Z" fill="#1f9a76"/>
  <path d="M240 360 H280 L276 394 Q275 402 266 402 H240 Z" fill="#1f9a76"/>
  <path d="M268 360 H280 L276 394 Q275 402 266 402 Z" fill="#17805f"/>
  <circle cx="66" cy="366" r="6.5" fill="#c9cbcd"/>
  <circle cx="66" cy="366" r="5.5" fill="#c8151b"/>
  <circle cx="254" cy="366" r="6.5" fill="#c9cbcd"/>
  <circle cx="254" cy="366" r="5.5" fill="#c8151b"/>
  <!-- podvozek: rám a ložiskové skříně -->
  <rect x="72" y="402" width="176" height="8" fill="#2a2b2a"/>
  <rect x="64" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <rect x="244" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <!-- ocelová kola, okolek na vnitřní hraně -->
  <path d="M78 402 H92 V420 H88 V418 H78 Z" fill="#8f9193"/>
  <path d="M228 402 H242 V418 H232 V420 H228 Z" fill="#8f9193"/>
  <rect x="78" y="402" width="3" height="16" fill="#b5b7b9"/>
  <rect x="239" y="402" width="3" height="16" fill="#b5b7b9"/>
  <!-- žlábkové kolejnice zapuštěné do vozovky (rozchod 1 435 mm) -->
  <rect x="74" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="88" y="418" width="4" height="2" fill="#2a2b2a"/>
  <rect x="224" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="228" y="418" width="4" height="2" fill="#2a2b2a"/>
</svg>
