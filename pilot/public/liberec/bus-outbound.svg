<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Liberecký autobus DPMLJ, Iveco Urbanway 12M CNG, zadní pohled. Fotka zádě libereckého vozu chybí; nátěr
       podle bočních pohledů na fotkách z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_CNG_ev.č._531,_Liberec.jpg
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_ev.č._535,_Liberec_(2).jpg
       Bílá skříň, zelená linka pod střechou, žlutooranžový pás a zelený spodek (barvy zádě v Liberci neověřené).
       Tvar zádě podle Urbanway 12 CNG z Laonu přímo zezadu (Commons): nahoře černý panel s tabulí linky vpravo, dole
       zúžený do lichoběžníku, pod ním stříbrná „bumerangová“ lišta s nápisem IVECO (dole vodorovná, k bokům stoupá),
       hladké velké dveře motoru se spárou a oválnou síťkou sání vpravo, malé ev. číslo nad síťkou, svítilny v rozích
       nahoře úzké s oranžovým obrysovým světlem, dole rozšířené dovnitř (hokejka) s červenou LED čarou a oranžovým
       blinkrem u okraje, značka na horní hraně nárazníku. Výšky pásů podle bočního snímku vozu 531. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zrcátka vpředu vyčnívají za boky -->
  <rect x="26" y="56" width="16" height="42" rx="5" fill="#1d1f22"/>
  <rect x="318" y="56" width="16" height="42" rx="5" fill="#1d1f22"/>
  <!-- kryt nádrží CNG na střeše -->
  <path d="M84 22 Q86 8 104 8 H256 Q274 8 276 22 Z" fill="#e9e9e6"/>
  <!-- bílá skříň, zelená linka pod střechou -->
  <path d="M52 296 V40 Q52 22 72 22 H288 Q308 22 308 40 V296 Z" fill="#f4f4f2"/>
  <path d="M298 24 Q308 28 308 42 V296 H298 Z" fill="#dededb"/>
  <path d="M52 40 Q52 30 58 28 H302 Q308 30 308 40 V44 H52 Z" fill="#0f9d82"/>
  <!-- černý panel nahoře, vpravo tabule s číslem linky; dole se zužuje do lichoběžníku -->
  <path d="M62 27 H298 V58 H280 L242 80 H118 L80 58 H62 Z" fill="#1d1f22"/>
  <path d="M82 32 L102 32 L98 64 L84 59 Z" fill="#3a4654" opacity=".45"/>
  <rect x="238" y="32" width="50" height="26" rx="2" fill="#0b0c0d"/>
  <text x="263" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#43d94c">16</text>
  <!-- stříbrná bumerangová lišta s nápisem IVECO: dole vodorovná, k bokům stoupá -->
  <path d="M60 56 H80 L118 80 H242 L280 58 H300 V72 Q300 76 296 78 L250 104 Q246 107 240 107 H120 Q114 107 110 104 L64 78 Q60 76 60 72 Z" fill="#c9cbcc"/>
  <text x="180" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.5" fill="#4a4e52">IVECO</text>
  <!-- evidenční číslo vpravo nad síťkou, pod koncem lišty -->
  <text x="288" y="114" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3a3c3e">531</text>
  <!-- spára velkých dveří motorového prostoru se zaoblenými dolními rohy -->
  <path d="M62 110 V232 Q62 244 74 244 H286 Q298 244 298 232 V110" stroke="#d6d6d3" stroke-width=".8" fill="none"/>
  <!-- hladký kryt motoru, vpravo oválná síťka sání -->
  <rect x="234" y="124" width="42" height="94" rx="16" fill="#3a3d40"/>
  <!-- svítilny v rozích: nahoře úzké s malým oranžovým obrysovým světlem, dole se jako hokejka rozšiřují
       dovnitř; po vnitřní hraně červená LED čára, u vnějšího okraje oranžový blinkr -->
  <path d="M52 40 Q52 34 58 34 H62 V180 Q64 222 80 245 H58 Q52 245 52 239 Z" fill="#b3141a"/>
  <path d="M62.5 194 Q65 222 78.5 243" stroke="#ff2a32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="53" y="205" width="9" height="39" rx="3" fill="#f5a623"/>
  <circle cx="58" cy="42" r="3" fill="#f5a623"/>
  <path d="M308 40 Q308 34 302 34 H298 V180 Q296 222 280 245 H302 Q308 245 308 239 Z" fill="#b3141a"/>
  <path d="M297.5 194 Q295 222 281.5 243" stroke="#ff2a32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="298" y="205" width="9" height="39" rx="3" fill="#f5a623"/>
  <circle cx="302" cy="42" r="3" fill="#f5a623"/>
  <!-- žlutooranžový pás a zelený spodek jako na boku vozu 531 (barvy zádě neověřené), registrační značka na
       horní hraně nárazníku -->
  <rect x="52" y="245" width="256" height="25" fill="#f6b820"/>
  <path d="M52 270 H308 V290 Q308 296 302 296 H58 Q52 296 52 290 Z" fill="#0f9d82"/>
  <rect x="152" y="266" width="56" height="12" rx="1" fill="#f4f4f2" stroke="#3a3c3e" stroke-width=".8"/><rect x="152" y="266" width="6" height="12" fill="#2a63b8"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
