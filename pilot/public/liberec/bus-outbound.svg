<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Liberecký autobus DPMLJ, Iveco Urbanway 12M CNG, zadní pohled. Fotka zádě libereckého vozu chybí; nátěr
       podle bočních pohledů na fotkách z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_CNG_ev.č._531,_Liberec.jpg
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_ev.č._535,_Liberec_(2).jpg
       Bílá skříň, zelená linka pod střechou, oranžovožlutý pás a zelený spodek. Záď podle tvaru Urbanway: zadní
       okno s číslem linky, pod ním kryt motoru s mřížkou, svislá světla v rozích. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zrcátka vpředu vyčnívají za boky -->
  <rect x="26" y="56" width="16" height="42" rx="5" fill="#1d1f22"/>
  <rect x="318" y="56" width="16" height="42" rx="5" fill="#1d1f22"/>
  <!-- kryt nádrží CNG na střeše -->
  <path d="M84 22 Q86 8 104 8 H256 Q274 8 276 22 Z" fill="#e9e9e6"/>
  <!-- bílá skříň, zelená linka pod střechou -->
  <path d="M52 296 V40 Q52 22 72 22 H288 Q308 22 308 40 V296 Z" fill="#f4f4f2"/>
  <path d="M298 24 Q308 28 308 42 V296 H298 Z" fill="#dededb"/>
  <path d="M52 40 Q52 30 58 28 H302 Q308 30 308 40 V44 H52 Z" fill="#1f9a76"/>
  <!-- zadní okno s číslem linky -->
  <rect x="70" y="50" width="220" height="88" rx="5" fill="#1d1f22"/>
  <path d="M84 56 L112 56 L96 132 L84 132 Z" fill="#3a4654" opacity=".55"/>
  <rect x="238" y="104" width="46" height="26" rx="2" fill="#0b0c0d"/>
  <text x="261" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#43d94c">16</text>
  <!-- kryt motoru: mřížka sání a evidenční číslo -->
  <rect x="96" y="150" width="168" height="40" rx="4" fill="#d6d8d6"/>
  <g stroke="#9ea2a3" stroke-width="2.5"><path d="M104 158 H256"/><path d="M104 166 H256"/><path d="M104 174 H256"/><path d="M104 182 H256"/></g>
  <text x="180" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3a3c3e">531</text>
  <!-- svislá světla v rozích -->
  <rect x="56" y="150" width="16" height="84" rx="6" fill="#9c1418"/><rect x="58" y="206" width="12" height="12" rx="3" fill="#f2a33a"/><rect x="58" y="190" width="12" height="12" rx="3" fill="#eef1f3"/>
  <rect x="288" y="150" width="16" height="84" rx="6" fill="#9c1418"/><rect x="290" y="206" width="12" height="12" rx="3" fill="#f2a33a"/><rect x="290" y="190" width="12" height="12" rx="3" fill="#eef1f3"/>
  <!-- oranžovožlutý pás s registrační značkou, zelený spodek -->
  <rect x="52" y="240" width="256" height="34" fill="#eba320"/>
  <rect x="152" y="251" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="251" width="6" height="12" fill="#2a63b8"/>
  <path d="M52 274 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1f9a76"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
