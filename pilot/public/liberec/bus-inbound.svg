<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Liberecký autobus DPMLJ, Iveco Urbanway 12M CNG (spolu se SOR NS 12 nejpočetnější typ, 32 vozů), čelní pohled
       v nátěru DPMLJ. 1 px = 1 cm, šířka 2,55 m. Podle fotek z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_CNG_ev.č._531,_Liberec.jpg
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_ev.č._535,_Liberec_(2).jpg
       https://commons.wikimedia.org/wiki/File:Liberec,_Fügnerova,_autobusy.jpg
       Bílá skříň s nádržemi CNG na střeše, velké čelní sklo v černém rámu s LED tabulí (zelené číslo linky,
       oranžový cíl), pod sklem šedá lišta (znak výrobce bez nápisu), světla v rozích, oranžovožluté rohy
       nárazníku, dole zelený pás s registrační značkou. -->
  <!-- zpětná zrcátka na ramenech -->
  <path d="M54 40 H40 Q32 40 32 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="22" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <path d="M306 40 H320 Q328 40 328 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="320" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <!-- kryt nádrží CNG na střeše -->
  <path d="M84 22 Q86 8 104 8 H256 Q274 8 276 22 Z" fill="#e9e9e6"/>
  <!-- bílá skříň -->
  <path d="M52 296 V40 Q52 22 72 22 H288 Q308 22 308 40 V296 Z" fill="#f4f4f2"/>
  <path d="M298 24 Q308 28 308 42 V296 H298 Z" fill="#dededb"/>
  <!-- čelní sklo v černém rámu, nahoře LED tabule -->
  <path d="M58 32 Q58 28 64 28 H296 Q302 28 302 32 V204 H58 Z" fill="#1d1f22"/>
  <rect x="62" y="32" width="236" height="32" fill="#111214"/>
  <g font-family="Arial, sans-serif" font-weight="bold">
    <text x="78" y="55" font-size="18" fill="#43d94c">16</text>
    <text x="200" y="55" font-size="15" text-anchor="middle" letter-spacing=".5" fill="#f2a33a">KRISTIÁNOV</text>
  </g>
  <rect x="62" y="66" width="236" height="134" fill="#3a4a58"/>
  <path d="M76 70 L118 70 L90 196 L74 196 Z" fill="#5c6c79" opacity=".5"/>
  <rect x="160" y="74" width="110" height="12" fill="#5c6c79" opacity=".5"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 200 L166 186"/><path d="M276 200 L210 186"/></g>
  <!-- šedá lišta se znakem výrobce -->
  <path d="M104 214 H256 L248 230 H112 Z" fill="#a9adb0"/>
  <rect x="150" y="219" width="60" height="6" rx="2" fill="#e4e6e7"/>
  <!-- světla v rozích -->
  <path d="M56 218 H100 L96 244 Q72 246 58 240 Z" fill="#d9dcde" stroke="#8d9296" stroke-width="1.5"/>
  <circle cx="70" cy="230" r="6" fill="#f7f8f9" stroke="#8d9296"/><circle cx="86" cy="231" r="5" fill="#f7f8f9" stroke="#8d9296"/>
  <path d="M304 218 H260 L264 244 Q288 246 302 240 Z" fill="#d9dcde" stroke="#8d9296" stroke-width="1.5"/>
  <circle cx="290" cy="230" r="6" fill="#f7f8f9" stroke="#8d9296"/><circle cx="274" cy="231" r="5" fill="#f7f8f9" stroke="#8d9296"/>
  <!-- evidenční číslo -->
  <text x="236" y="258" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d1f22">531</text>
  <!-- oranžovožluté rohy nárazníku, zelený spodek s registrační značkou -->
  <path d="M52 250 H62 Q66 264 92 266 H112 V280 H52 Z" fill="#eba320"/>
  <path d="M308 250 H298 Q294 264 268 266 H248 V280 H308 Z" fill="#eba320"/>
  <path d="M52 278 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1f9a76"/>
  <rect x="104" y="264" width="152" height="18" rx="3" fill="#2a2c2e"/>
  <rect x="152" y="267" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="267" width="6" height="12" fill="#2a63b8"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
