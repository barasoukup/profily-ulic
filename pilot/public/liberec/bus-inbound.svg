<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Liberecký autobus DPMLJ, Iveco Urbanway 12M CNG (spolu se SOR NS 12 nejpočetnější typ, 32 vozů), čelní pohled
       v nátěru DPMLJ. 1 px = 1 cm, šířka 2,55 m. Podle fotek z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_CNG_ev.č._531,_Liberec.jpg
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_ev.č._535,_Liberec_(2).jpg
       https://commons.wikimedia.org/wiki/File:Liberec,_Fügnerova,_autobusy.jpg
       Zpřesněno podle fotky vozu 535 zepředu: na střeše vpředu úzký kryt klimatizace, za ním širší kryt
       nádrží CNG, velké čelní sklo v černém rámu s LED tabulí (zelené číslo linky, oranžový cíl), pod sklem
       stříbrná „miska“ s tučným chromovým nápisem IVECO, světlomety z tmavého šikmého „obočí“ s malým světlem
       a stříbrné jednotky se dvěma projektory a LED proužkem, velké skoro černé ev. číslo, piktogram vozíčkáře
       a zelený znak CNG u osy, zrcátka před rohy skla, žlutooranžové rohy se šikmou vnitřní hranou a oranžovými
       mlhovými světly nad zeleným pásem, mezi nimi bílé „nohy“ nárazníku a užší tmavé sání se zaoblenými rohy
       a registrační značkou (spodek čela podle detailu vozu 535). -->
  <!-- zpětná zrcátka na ramenech -->
  <path d="M54 40 H48 Q44 40 44 46 V66" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <path d="M306 40 H312 Q316 40 316 46 V66" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <!-- kryt nádrží CNG na střeše (vzadu, širší) -->
  <path d="M70 22 Q72 14 86 14 H274 Q288 14 290 22 Z" fill="#e2e2df"/>
  <!-- vpředu úzký kryt klimatizace -->
  <path d="M133 22 Q134 4 146 4 H214 Q226 4 227 22 Z" fill="#f2f2f0"/>
  <!-- bílá skříň -->
  <path d="M52 296 V40 Q52 22 72 22 H288 Q308 22 308 40 V296 Z" fill="#f4f4f2"/>
  <path d="M298 24 Q308 28 308 42 V296 H298 Z" fill="#dededb"/>
  <!-- čelní sklo v černém rámu, nahoře LED tabule -->
  <path d="M58 32 Q58 28 64 28 H296 Q302 28 302 32 V204 H58 Z" fill="#1d1f22"/>
  <rect x="62" y="32" width="236" height="32" fill="#111214"/>
  <g font-family="Arial, sans-serif" font-weight="bold">
    <text x="78" y="55" font-size="18" fill="#43d94c">16</text>
    <text x="200" y="55" font-size="15" text-anchor="middle" letter-spacing=".5" fill="#f2a33a">KRISTIÁNOV</text>
  </g>
  <rect x="62" y="66" width="236" height="134" fill="#3a4a58"/>
  <path d="M76 70 L118 70 L90 196 L74 196 Z" fill="#5c6c79" opacity=".5"/>
  <rect x="160" y="74" width="110" height="12" fill="#5c6c79" opacity=".5"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 200 L166 186"/><path d="M276 200 L210 186"/></g>
  <!-- zrcátka visí před rohy skla a překrývají okraj karoserie -->
  <rect x="32" y="66" width="28" height="44" rx="5" fill="#1d1f22"/>
  <rect x="300" y="66" width="28" height="44" rx="5" fill="#1d1f22"/>
  <!-- stříbrná lišta („miska“) s vystouplým tučným chromovým nápisem IVECO -->
  <path d="M98 207 H262 Q258 216 248 221 Q180 236 112 221 Q102 216 98 207 Z" fill="#a9adb0"/>
  <text x="180.6" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="1.2" fill="#e6e8ea" stroke="#5a5e62" stroke-width=".6">IVECO</text>
  <!-- žlutooranžové rohy, vnitřní hrana šikmo dolů dovnitř, pod nimi zelený pás; mezi rohy a tmavým sáním
       bílá „noha“ nárazníku, v sání registrační značka -->
  <path d="M52 246 H92 Q99 247 100 252 L107 278 H52 Z" fill="#f6b820"/>
  <path d="M308 246 H268 Q261 247 260 252 L253 278 H308 Z" fill="#f6b820"/>
  <path d="M52 278 H107 L105 296 H60 Q52 296 52 290 Z" fill="#0f9d82"/>
  <path d="M308 278 H253 L255 296 H300 Q308 296 308 290 Z" fill="#0f9d82"/>
  <path d="M114 296 V277 Q114 271 120 271 H240 Q246 271 246 277 V296 Z" fill="#1d1e22"/>
  <rect x="152" y="274" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="274" width="6" height="12" fill="#2a63b8"/>
  <!-- oranžová kulatá mlhová světla v rozích -->
  <circle cx="76" cy="271" r="4.8" fill="#e3901c" stroke="#c47a14" stroke-width=".6"/>
  <circle cx="284" cy="271" r="4.8" fill="#e3901c" stroke="#c47a14" stroke-width=".6"/>
  <!-- světlomety: nahoře tmavé šikmé „obočí“ s malým kulatým světlem, pod ním stříbrná jednotka se dvěma
       projektory, LED proužek po spodní a vnější hraně -->
  <path d="M58 215 L92 222 V233 H58 Z" fill="#2e3134"/>
  <circle cx="64" cy="224" r="3.5" fill="#dfe3e7" stroke="#8d9296" stroke-width=".5"/>
  <rect x="61" y="233" width="38" height="19" rx="2" fill="#cfd3d8"/>
  <circle cx="69" cy="242" r="4.3" fill="#eef0f3" stroke="#7d8286" stroke-width=".8"/>
  <circle cx="82" cy="242" r="4.3" fill="#eef0f3" stroke="#7d8286" stroke-width=".8"/>
  <path d="M97 250 H65 Q63 250 63 248 V236" stroke="#e7dcff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M302 215 L268 222 V233 H302 Z" fill="#2e3134"/>
  <circle cx="296" cy="224" r="3.5" fill="#dfe3e7" stroke="#8d9296" stroke-width=".5"/>
  <rect x="261" y="233" width="38" height="19" rx="2" fill="#cfd3d8"/>
  <circle cx="278" cy="242" r="4.3" fill="#eef0f3" stroke="#7d8286" stroke-width=".8"/>
  <circle cx="291" cy="242" r="4.3" fill="#eef0f3" stroke="#7d8286" stroke-width=".8"/>
  <path d="M263 250 H295 Q297 250 297 248 V236" stroke="#e7dcff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- znak CNG (zelený obdélníček s bílým kosočtvercem) a piktogram vozíčkáře u osy -->
  <rect x="106" y="230" width="12" height="9" rx="1" fill="#2f8a4e"/>
  <path d="M112 231.5 L116.5 234.5 L112 237.5 L107.5 234.5 Z" fill="none" stroke="#fff" stroke-width=".7"/>
  <rect x="125" y="238" width="17" height="19" rx="1.5" fill="#2a72c8"/>
  <g fill="none" stroke="#fff" stroke-width="1.7"><circle cx="132.6" cy="250.5" r="3.8"/><path d="M132.2 243 V249 H138 L139.4 253.5"/></g>
  <circle cx="132.6" cy="240.8" r="1.4" fill="#fff"/>
  <!-- evidenční číslo -->
  <text x="218" y="255" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#222428">531</text>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
