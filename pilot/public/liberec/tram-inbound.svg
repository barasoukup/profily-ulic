<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Liberecká tramvaj Tatra T3R.SLF / T3R.PLF (modernizovaná T3 s nízkopodlažním středem; tramvaje odvozené
       od T3 tvoří skoro celý vozový park DPMLJ), čelní pohled v zeleno-bílém nátěru DPMLJ. 1 px = 1 cm, šířka vozu
       2,5 m. Podle fotek z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Tatra_T3R.SLF_č._44,_Liberec.jpg
       https://commons.wikimedia.org/wiki/File:L08_411_Wendeschleife_Fügnerová,_ET_82.jpg
       https://commons.wikimedia.org/wiki/File:Liberec,_Mrštíkova,_vozovna_(01).jpg
       Zpřesněno podle fotky vozu 28 (Tatra T3R.PLF, Liberec, Commons): vysoké čelní sklo (asi 38 %
       výšky od střechy k nárazníku, horní rohy výrazně zaoblené), tenký zelený rám nad sklem, tenká zelená čepice, v bílém pásu LED tabule
       s číslem vozu vlevo, nízko posazená světla, svislé spřáhlo v ose, velký bílý kryt klimatizace, piktogram
       vozíčkáře vlevo, v ose světlý box se štěrbinou a pod ním kolečko „1435“. Žlutý držák zrcátka.
       Spodek čela (zelené rohy zástěry od okraje skříně, vysoký blinkr nad pozičním světlem) podle detailu vozu 44. -->
  <!-- pantograf zepředu: silný sloupek ze střechy, nahoře ramena do V k širokému sběrači -->
  <g stroke="#d9b81f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 104 V72" stroke-width="6"/>
    <path d="M160 72 L128 40 M160 72 L192 40" stroke-width="3"/>
  </g>
  <path d="M82 46 Q86 36 96 36 H224 Q234 36 238 46" stroke="#5a5b5c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="120" y="34" width="80" height="3" fill="#3a3b3c"/>
  <rect x="122" y="104" width="76" height="12" rx="3" fill="#4a4b4c"/>
  <!-- bílý kryt klimatizace nad čelem -->
  <rect x="110" y="94" width="100" height="14" rx="4" fill="#eceeee"/>
  <!-- bílá skříň: zaoblená střecha, boky se dolů mírně rozšiřují -->
  <path d="M39 346 L43 156 Q46 116 100 115 H220 Q274 116 277 156 L281 346 Z" fill="#f4f5f4"/>
  <!-- zelený okraj střechy -->
  <path d="M43 156 Q46 116 100 115 H220 Q274 116 277 156 L277 158 Q262 134 220 132 H100 Q58 134 43 158 Z" fill="#1f9a76"/>
  <!-- LED tabule v bílém pásu a číslo vozu -->
  <rect x="94" y="136" width="148" height="24" rx="2" fill="#0d0f10"/>
  <g font-family="Arial, sans-serif" font-weight="bold">
    <text x="102" y="154" font-size="15" fill="#43d94c">3</text>
    <text x="178" y="153" font-size="11" text-anchor="middle" letter-spacing=".5" fill="#f2a33a">LIDOVÉ SADY</text>
    <text x="70" y="154" font-size="15" text-anchor="middle" fill="#22324a">44</text>
  </g>
  <!-- zelený rám čelního skla -->
  <path d="M42 165 Q43 162 50 162 H270 Q277 162 278 165 L280 264 H40 Z" fill="#1f9a76"/>
  <path d="M46 181 Q46 165 62 165 H258 Q274 165 274 181 L275 248 Q275 254 269 254 H51 Q45 254 45 248 Z" fill="#1f2a33"/>
  <path d="M51 182 Q51 169 64 169 H256 Q269 169 269 182 L270 245 Q270 250 265 250 H55 Q50 250 50 245 Z" fill="#2e3b46"/>
  <path d="M76 171 L114 171 L92 246 L72 246 Z" fill="#46596a" opacity=".75"/>
  <path d="M232 172 L248 172 L242 208 L230 208 Z" fill="#46596a" opacity=".5"/>
  <rect x="68" y="166" width="4" height="88" fill="#c9cccd"/>
  <rect x="248" y="166" width="4" height="88" fill="#c9cccd"/>
  <!-- stěrač -->
  <path d="M150 250 L118 196" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <!-- levé zrcátko na žlutém rameni ze střechy -->
  <path d="M100 126 H34 Q26 126 22 133 L14 172" stroke="#e8b923" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="6" y="172" width="16" height="42" rx="4" fill="#2a2b2a"/>
  <!-- pravé malé zrcátko u spodní hrany skla -->
  <path d="M281 232 L287 236" stroke="#2a2b2a" stroke-width="3"/>
  <rect x="285" y="228" width="11" height="26" rx="4" fill="#2a2b2a"/>
  <!-- bílý spodek: kulatá světla, blinkry, poziční světla -->
  <path d="M270 264 H280 L281 346 H271 Z" fill="#000" opacity=".06"/>
  <circle cx="98" cy="320" r="12" fill="#c9cbcd"/>
  <circle cx="98" cy="320" r="9" fill="#f7f4ea"/>
  <circle cx="222" cy="320" r="12" fill="#c9cbcd"/>
  <circle cx="222" cy="320" r="9" fill="#f7f4ea"/>
  <rect x="45" y="296" width="10" height="18" rx="2" fill="#f08a1c"/>
  <rect x="265" y="296" width="10" height="18" rx="2" fill="#f08a1c"/>
  <rect x="45" y="315" width="10" height="12" rx="2" fill="#c9ced6"/>
  <rect x="265" y="315" width="10" height="12" rx="2" fill="#c9ced6"/>
  <!-- světlý box v ose nad kolečkem, uvnitř tmavá štěrbina -->
  <rect x="153" y="277" width="14" height="13" rx="2" fill="#cfd0ce" stroke="#9a9c9c" stroke-width=".6"/>
  <rect x="157" y="279" width="6" height="9" fill="#5d6062"/>
  <!-- piktogram vozíčkáře a kolečko rozchodu „1435“ -->
  <rect x="95" y="280" width="18" height="18" rx="1.5" fill="#2f73c6"/>
  <g fill="none" stroke="#fff" stroke-width="1.8"><circle cx="103.2" cy="292" r="3.9"/><path d="M102.5 284.5 V290.5 H108.5 L110 295"/></g>
  <circle cx="103.5" cy="282.7" r="1.4" fill="#fff"/>
  <circle cx="160" cy="300" r="8" fill="#d0202a"/>
  <text x="160" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" fill="#fff">1435</text>
  <!-- černý nárazník -->
  <rect x="36" y="344" width="248" height="11" rx="3" fill="#1d1f20"/>
  <rect x="150" y="345" width="20" height="9" rx="1.5" fill="#d9b81f"/>
  <!-- otevřený prostor pod nárazníkem: rám a spřáhlo zavěšené svisle v ose -->
  <rect x="80" y="355" width="160" height="29" fill="#2a2b2a"/>
  <rect x="96" y="384" width="128" height="5" fill="#3a3b3c"/>
  <rect x="156" y="360" width="8" height="26" fill="#4a4b4c"/>
  <rect x="149" y="384" width="22" height="12" rx="2" fill="#b39528"/>
  <!-- zelené rohy zástěry -->
  <path d="M40 355 H80 V402 H54 Q45 402 44 394 Z" fill="#1f9a76"/>
  <path d="M240 355 H280 L276 394 Q275 402 266 402 H240 Z" fill="#1f9a76"/>
  <path d="M268 355 H280 L276 394 Q275 402 266 402 Z" fill="#17805f"/>
  <!-- podvozek: rám a ložiskové skříně -->
  <rect x="72" y="402" width="176" height="8" fill="#2a2b2a"/>
  <rect x="64" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <rect x="244" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <!-- ocelová kola, okolek na vnitřní hraně -->
  <path d="M78 402 H92 V420 H88 V418 H78 Z" fill="#8f9193"/>
  <path d="M228 402 H242 V418 H232 V420 H228 Z" fill="#8f9193"/>
  <rect x="78" y="402" width="3" height="16" fill="#b5b7b9"/>
  <rect x="239" y="402" width="3" height="16" fill="#b5b7b9"/>
  <!-- žlábkové kolejnice zapuštěné do vozovky (rozchod 1 435 mm) -->
  <rect x="74" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="88" y="418" width="4" height="2" fill="#2a2b2a"/>
  <rect x="224" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="228" y="418" width="4" height="2" fill="#2a2b2a"/>
</svg>
