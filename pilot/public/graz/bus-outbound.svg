<!-- Autobus Mercedes-Benz Citaro C2 (12 m), Holding Graz Linien, Štýrský Hradec/Graz, zadní pohled. Zelená střešní hrana (nízká kopule) a horní lem, bílá horní část zádi, zadní okno v černém pásu, který nese i malou jantarovou tabuli s číslem linky, záď celá světle stříbrošedá (jako zadní článek kloubových vozů na fotkách), kryt motoru jen jemně obtažený, v barvě zádi, s úzkou mřížkou nahoře, šedou hvězdou Mercedes uprostřed a zeleným logem GRAZ, tabule s číslem linky v pravém horním rohu zadního okna, úzký zelený lem nad černou hranou nárazníku, rohové svislé svítilny (červené koncové/brzdové, jantarový blinkr a bílé couvací v jednom celku), nárazník světle šedý se zeleným lemem a černou hranou; rakouská SPZ s modrým pruhem EU a červeno-bílo-červenými linkami (G = Graz). Barvy zádi podle vozu v pozadí fotky „Graz Linien Wagen 131 am Jakominiplatz.jpg“ (světlá záď, nanejvýš zelený spodní lem) a „Citaro Graz.jpg“ (zelená vpředu, dozadu stříbrošedá). Fotky jen jako předloha (popsáno, ne obkresleno, nic z nich není v obrázku): Wikimedia Commons „Graz Linien Citaros am Jakominiplatz.jpg“ a „Graz Linien Citaro am Dietrichsteinplatz.jpg“, obě Armin Ademovic (User:Öffis Graz), CC BY-SA 4.0; dále Wikipedia de „Graz Linien“ (vozový park: Citaro 2) a Wikipedia „Mercedes-Benz Citaro“ (tvar C2). Zelená podle vzorku z první fotky (asi #029C5E na světle, #058D59 ve stínu). 1 px = 1 cm. -->
