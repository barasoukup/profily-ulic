<!-- Tramvaj Stadler Variobahn (řada 200, Holding Graz Linien, Štýrský Hradec/Graz; jednosměrná, šířka 2,20 m, 100% nízkopodlažní), zadní pohled – jednosměrné vozidlo nemá vzadu stanoviště: bílá záď se zadním oknem, číslo linky, červená koncová světla, zelená spodní část (bez světle zeleného proužku), malé tmavé evidenční číslo vozu, bez zrcátek.
