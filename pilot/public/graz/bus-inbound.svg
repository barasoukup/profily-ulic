<!-- Autobus Mercedes-Benz Citaro C2 (12 m), Holding Graz Linien, Štýrský Hradec/Graz, čelní pohled. Celé čelo zelené (lehce do modra), střecha jen s nízkou kopulí, černý rám čelního skla až k dolní hraně skla a stěračům, LED cílová tabule (číslo linky jasně jantarové, text tmavší a užší), pod sklem vlevo úzký bílý pruh „Verbund Linie“, vpravo bílé logo „Holding Graz Linien“ (malé HOLDING nad čtyřmi políčky GRAZ), uprostřed hvězda Mercedes, šikmé čiré světlomety s blinkrem ve vnitřním rohu, tři modré piktogramy (vozík, kočárek, osoba) těsně u SPZ, nárazník v zelené barvě skříně s tenkou spárou a černou hranou, malé světlé číslo vozu vlevo nad světlometem, pod políčky GRAZ linka za nápis LINIEN, dolní hrana čelního skla se k rohům mírně zvedá; rakouská SPZ s modrým pruhem EU a červeno-bílo-červenými linkami (G = Graz). Fotky jen jako předloha (popsáno, ne obkresleno, nic z nich není v obrázku): Wikimedia Commons „Graz Linien Citaros am Jakominiplatz.jpg“ a „Graz Linien Citaro am Dietrichsteinplatz.jpg“, obě Armin Ademovic (User:Öffis Graz), CC BY-SA 4.0; dále Wikipedia de „Graz Linien“ (vozový park: Citaro 2) a Wikipedia „Mercedes-Benz Citaro“ (tvar C2). Zelená podle vzorku z první fotky (asi #029C5E na světle, #058D59 ve stínu). 1 px = 1 cm. -->
