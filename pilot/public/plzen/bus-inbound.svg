<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Plzeňský autobus PMDP, SOR NS 12, čelní pohled podle fotky vozu 626 (Wikimedia Commons, „Plzeňský
       autobus SOR NS12.jpg“): černé čelo s velkým sklem a oranžovou LED tabulí, červené hrany boků, dole černý
       panel s výrazným červeným obloukem a stříbrnými rámy světel, žluté číslo vozu. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zpětná zrcátka na ramenech („králičí uši“) -->
  <path d="M60 30 Q38 28 34 48" stroke="#1d1f22" stroke-width="5" fill="none"/>
  <rect x="22" y="46" width="18" height="50" rx="6" fill="#1d1f22"/>
  <path d="M300 30 Q322 28 326 48" stroke="#1d1f22" stroke-width="5" fill="none"/>
  <rect x="320" y="46" width="18" height="50" rx="6" fill="#1d1f22"/>
  <!-- skříň: bílá střecha, červené hrany boků -->
  <path d="M52 296 V40 Q52 20 74 20 H286 Q308 20 308 40 V296 Z" fill="#d8262b"/>
  <path d="M64 22 H296 Q304 24 306 32 H54 Q56 24 64 22 Z" fill="#f2f2f0"/>
  <!-- černé čelo se sklem a LED tabulí -->
  <path d="M58 296 V38 Q58 32 66 32 H294 Q302 32 302 38 V296 Z" fill="#17191c"/>
  <g font-family="Arial, sans-serif" font-weight="bold" fill="#f2a33a">
    <text x="84" y="57" font-size="18">35</text>
    <text x="200" y="57" font-size="15" text-anchor="middle" letter-spacing="1">KRIMICE</text>
  </g>
  <path d="M64 68 H296 V186 Q180 196 64 186 Z" fill="#2c3944"/>
  <path d="M80 74 L120 74 L92 182 L76 180 Z" fill="#46596a" opacity=".5"/>
  <path d="M248 74 L270 74 L260 120 L240 120 Z" fill="#46596a" opacity=".4"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M100 188 L170 172"/><path d="M272 188 L206 172"/></g>
  <text x="180" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#f2c233">626</text>
  <circle cx="180" cy="232" r="5" fill="none" stroke="#7a7e82" stroke-width="2"/>
  <!-- světla ve stříbrných rámech -->
  <path d="M60 218 H104 Q110 218 112 226 L114 248 Q100 256 64 252 Z" fill="#d6d9dc"/>
  <circle cx="76" cy="234" r="6" fill="#f6f7f8" stroke="#9fa3a6"/><circle cx="96" cy="236" r="6" fill="#f6f7f8" stroke="#9fa3a6"/>
  <path d="M300 218 H256 Q250 218 248 226 L246 248 Q260 256 296 252 Z" fill="#d6d9dc"/>
  <circle cx="284" cy="234" r="6" fill="#f6f7f8" stroke="#9fa3a6"/><circle cx="264" cy="236" r="6" fill="#f6f7f8" stroke="#9fa3a6"/>
  <!-- červený oblouk přes spodek čela -->
  <path d="M52 250 Q120 266 180 262 Q240 266 308 250 V276 Q240 284 180 280 Q120 284 52 276 Z" fill="#d8262b"/>
  <!-- černý nárazník s registrační značkou -->
  <path d="M52 276 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#17191c"/>
  <rect x="152" y="280" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="280" width="6" height="12" fill="#2a63b8"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
