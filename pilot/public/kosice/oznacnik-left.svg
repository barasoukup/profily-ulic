<svg viewBox="0 0 50 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Košický označník autobusové zastávky DPMK (Dopravný podnik mesta Košice): šedý pozinkovaný sloupek, nahoře tabule v úzkém hliníkovém rámu (asi 46 × 56 cm) se světlejší stříškou nahoře; modré pole i pruh se štítky lemuje uvnitř rámu tenký smetanový okraj: bílý pruh s názvem zastávky (na skutečné tabuli jen jeden řádek, bez podnázvu), modré pole s logem DPMK (bledě khaki žlutý praporek s šedým znakem přes levý konec a tmavým nápisem „DPMK a.s.“ nad oknem, celé na modré), smetanové okno s tenkým tmavým obrysem a piktogramem autobusu (bok vozu: tmavá skříň, světlý pás oken dělený sloupky, vpředu vpravo světlé čelní sklo a přední dveře, kola u konců), vlevo dole smetanový trojúhelník s tmavým symbolem vozíčkáře; pod tenkou linkou modrý pruh se štítky linek: bílé štítky, nahoře malá ikonka vozidla (u denní linky zelený obrys autobusu, u noční tmavý), pod ní velké číslo v barvě linky (28 zeleně, N2 černě), vpravo prázdné tmavší sklo. Pod tabulí plechová skříňka s jízdním řádem se světlejší stříškou: nahoře prázdný šedý plech v rámečku, dole okénko v tmavomodrém rámu se dvěma listy. Na fotce visí skříňka vedle sloupku; tady je kvůli šířce obrázku (50 cm) nakreslena před ním. Stín vpravo (pro levou stranu ulice); při zrcadlení se mění jen stínové pruhy, tabule, logo, štítky a piktogramy se nepřevracejí (tabule se z obou stran čte stejně). 1 px = 1 cm, spodní hrana tabule asi 2,0 m nad chodníkem, spodek skříňky 1,1 m, celý označník asi 2,6 m (poměr sloupku a tabule podle fotky Levočská, ověřený listy A4 ve skříňce), spodní hrana = chodník, střed obrázku = osa označníku. -->
  <!-- Fotky, ze kterých kresba vychází (popsáno, ne obkresleno): Commons „Košice, zastávka Levočská.jpg“ (Jagro, CC BY-SA 3.0, 2009; tento typ tabule, rozměry a poloha prvků odhadnuté z fotky), barvy čísel podle „Košice, Staniční náměstí, odjezdový označník.jpg“ (Jagro, CC BY-SA 3.0, 2009; denní linky zeleně, noční N černě, regionální R modře). Novější fotky autobusových zastávek DPMK na Commons nejsou (16. 11. 2026 prohledány kategorie „Bus stops in Košice“, „Tram stops in Košice“ a hledání „Košice zastávka“); nové tmavé sloupy s LED tabulí jsou doložené jen na električkových zastávkách (viz oznacnik-tram-*), proto u autobusu zůstává tato tabule. -->
  <g transform="translate(-219 -20)">
    <rect x="240" y="154" width="8" height="206" fill="#8f9496"/><rect x="245" y="154" width="3" height="206" fill="#6e7375"/>
    <rect x="238" y="352" width="12" height="8" fill="#6e7375"/>
    <g transform="translate(0 78)">
      <!-- skříňka s jízdním řádem asi 0,3 m pod tabulí, vysoká 0,64 m, spodek 1,1 m nad chodníkem (podle fotky), nahoře světlejší stříška 1 cm: nahoře prázdný šedý plech s vyraženým rámečkem, dole okénko v tmavomodrém rámu, v něm širší list se zelenou hlavičkou linky a užší list s tmavou hlavičkou -->
      <rect x="227.5" y="107" width="33" height="1.2" fill="#c9cccd" rx="0.4"/>
      <rect x="228" y="108" width="32" height="64" fill="#a3a8aa" rx="0.8"/><rect x="258" y="108" width="2" height="64" fill="#868b8d"/>
      <rect x="230" y="110" width="28" height="31" fill="#bfc3c5"/><rect x="231.6" y="111.6" width="24.8" height="27.8" fill="none" stroke="#9ea3a5" stroke-width="0.6"/>
      <rect x="230" y="143" width="28" height="27" fill="#1f3570"/>
      <rect x="231.5" y="144.5" width="14" height="24" fill="#f4f4f0"/><rect x="231.5" y="144.5" width="14" height="2.2" fill="#1f8a3c"/><rect x="247" y="144.5" width="9.5" height="24" fill="#f4f4f0"/><rect x="247" y="144.5" width="9.5" height="2.2" fill="#2a2b2a"/>
      <rect x="232.5" y="149" width="12" height="0.8" fill="#9a9b9c"/><rect x="232.5" y="151.6" width="12" height="0.8" fill="#9a9b9c"/><rect x="232.5" y="154.2" width="12" height="0.8" fill="#9a9b9c"/><rect x="232.5" y="156.8" width="12" height="0.8" fill="#9a9b9c"/><rect x="232.5" y="159.4" width="12" height="0.8" fill="#9a9b9c"/><rect x="232.5" y="162" width="12" height="0.8" fill="#9a9b9c"/><rect x="248" y="149" width="7.5" height="0.8" fill="#9a9b9c"/><rect x="248" y="151.6" width="7.5" height="0.8" fill="#9a9b9c"/><rect x="248" y="154.2" width="7.5" height="0.8" fill="#9a9b9c"/><rect x="248" y="156.8" width="7.5" height="0.8" fill="#9a9b9c"/><rect x="248" y="159.4" width="7.5" height="0.8" fill="#9a9b9c"/><rect x="248" y="162" width="7.5" height="0.8" fill="#9a9b9c"/>
    </g>
    <!-- tabule DPMK: hliníkový rám 2,5 cm po obou stranách (stínová strana tmavší) se světlejší stříškou přesahující o 0,5 cm, bílý pruh s názvem, modré pole se smetanovým okrajem 0,6 cm, logo nad smetanovým oknem, trojúhelník se symbolem vozíčkáře, pruh se štítky linek -->
    <g transform="translate(0 76)">
      <rect x="221" y="24" width="46" height="56" fill="#c9cccd" rx="1"/><rect x="264.5" y="24" width="2.5" height="56" fill="#8f9496"/>
      <rect x="219.5" y="23" width="49" height="1.4" fill="#e2e4e5" rx="0.5"/>
      <rect x="223.5" y="26" width="41" height="9.8" fill="#f4f4f0"/><rect x="233" y="29.2" width="22" height="3.4" fill="#2a2b2a"/><rect x="223.5" y="35.8" width="41" height="0.8" fill="#a3a8aa"/>
      <rect x="223.5" y="36.6" width="41" height="41.4" fill="#e8dcae"/><rect x="224.1" y="37.2" width="39.8" height="28.4" fill="#1d4f9e"/>
      <!-- logo DPMK: bledě khaki žlutý praporek se zaobleným levým koncem, šedý kulatý znak napůl přes levý konec, tmavý nápis „DPMK“ a menší „a.s.“; sedí celé na modré, 0,8 cm nad oknem -->
      <path d="M237.6 38.4 H252.7 L251.4 42.8 H237.6 A2.2 2.2 0 0 1 237.6 38.4 Z" fill="#dcd68e"/><circle cx="237.9" cy="40.6" r="1.55" fill="#b4b8ba" stroke="#6e7375" stroke-width="0.3"/><rect x="240.3" y="39.9" width="7" height="1.4" fill="#1d2a4a"/><rect x="248" y="40.6" width="2.3" height="0.7" fill="#1d2a4a"/>
      <rect x="228.3" y="43.6" width="31.5" height="14.6" fill="#efe3a6" stroke="#2a2b2a" stroke-width="0.3"/>
      <!-- piktogram autobusu z boku, vpředu vpravo: tmavá (černozelená) skříň, světlý pás oken dělený tmavými sloupky, světlé prostřední a přední dveře, světlé čelní sklo, kola blízko konců -->
      <rect x="231.6" y="48.4" width="24.8" height="6" rx="0.8" fill="#1f2b25"/>
      <rect x="232.4" y="49.2" width="2.8" height="2.4" fill="#f7f5ea"/><rect x="235.8" y="49.2" width="2.8" height="2.4" fill="#f7f5ea"/><rect x="239.2" y="49.2" width="2.8" height="2.4" fill="#f7f5ea"/><rect x="242.6" y="49.2" width="1.6" height="4.6" fill="#f7f5ea"/><rect x="244.8" y="49.2" width="2.8" height="2.4" fill="#f7f5ea"/><rect x="248.2" y="49.2" width="3.4" height="2.4" fill="#f7f5ea"/><rect x="252.2" y="49.2" width="1.6" height="4.6" fill="#f7f5ea"/><path d="M254.4 49.2 H255.4 L255.9 50 V53 H254.4 Z" fill="#f7f5ea"/>
      <circle cx="234.8" cy="54.8" r="1.4" fill="#1a1a1a"/><circle cx="234.8" cy="54.8" r="0.5" fill="#efe3a6"/><circle cx="250.4" cy="54.8" r="1.4" fill="#1a1a1a"/><circle cx="250.4" cy="54.8" r="0.5" fill="#efe3a6"/>
      <!-- symbol vozíčkáře (mezinárodní značka přístupnosti): hlava, záda a sedadlo do L s nohou, opěrka, otevřený oblouk kola; tmavý na smetanovém trojúhelníku vlevo dole -->
      <path d="M224.1 55.2 L232.4 65.6 H224.1 Z" fill="#efe3a6"/><circle cx="225.6" cy="60.2" r="0.72" fill="#1a1a1a"/><path d="M225.7 61.4 V63.4 H227.8 L228.7 65.2" stroke="#1a1a1a" stroke-width="0.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M225.7 62.4 H227.2" stroke="#1a1a1a" stroke-width="0.55" stroke-linecap="round"/><path d="M225.65 62.7 A1.4 1.4 0 1 0 227.8 63.9" stroke="#1a1a1a" stroke-width="0.55" fill="none" stroke-linecap="round"/>
      <rect x="224.1" y="65.6" width="39.8" height="1" fill="#e8dcae"/><rect x="224.1" y="66.6" width="39.8" height="10.8" fill="#1d4f9e"/><rect x="252.5" y="66.6" width="11.4" height="10.8" fill="#2b4a7c"/>
      <!-- štítky linek: bílý štítek, nahoře malý obrys autobusu (u 28 zelený, u N2 tmavý), pod ním číslo tahy v barvě linky -->
      <rect x="224.4" y="66.8" width="9.2" height="10.4" fill="#f4f4f0"/><rect x="226.6" y="67.6" width="4.4" height="1.2" rx="0.3" fill="none" stroke="#1f8a3c" stroke-width="0.35"/><path d="M225.2 70.6 H227.9 M227.9 70.6 V73.1 M225.2 73.1 H227.9 M225.2 73.1 V75.6 M225.2 75.6 H227.9" stroke="#1f8a3c" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/><path d="M229.6 70.6 H232.3 M232.3 70.6 V73.1 M232.3 73.1 V75.6 M229.6 75.6 H232.3 M229.6 73.1 V75.6 M229.6 70.6 V73.1 M229.6 73.1 H232.3" stroke="#1f8a3c" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
      <rect x="241.2" y="66.8" width="9.4" height="10.4" fill="#f4f4f0"/><rect x="243.7" y="67.6" width="4.4" height="1.2" rx="0.3" fill="none" stroke="#2a2b2a" stroke-width="0.35"/><path d="M242.3 75.6 V70.6 L245 75.6 V70.6" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/><path d="M246.8 70.6 H249.5 M249.5 70.6 V73.1 M246.8 73.1 H249.5 M246.8 73.1 V75.6 M246.8 75.6 H249.5" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
