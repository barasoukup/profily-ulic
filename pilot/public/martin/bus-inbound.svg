<!-- Městský autobus MHD Martin–Vrútky, Dopravný podnik mesta Martin (DPMM, od 1. 1. 2022 jediný typ vozu), Iveco Urbanway 12M CNG, čelní pohled. Celá skříň jasně zelená (i čelo a střešní kryt nádrží CNG), velké čelní sklo v černém rámu, nahoře bílá LED cílová tabule, pod sklem spodní hrana skla mírně stoupá k prostředku, u levého horního rohu skla u ramene zrcátka tři modrá kolečka s piktogramy (vozík, kočárek, osoba) nad sebou, dole na rámu skla úzký černý pás s odstavenými stěrači, pod sklem široká stříbrná lišta, horní hrana vyklenutá obloukem nahoru, dolní skoro rovná, s tmavošedým nápisem IVECO, světlomety jako samostatné jednotky v zelené skříni pod rohy skla (nahoře menší kulaté světlo v tmavém okolí, pod ním větší obdélníkové čiré sklo v tmavém rámu), blinkry jen jako drobné značky, malá bílá nálepka s modrým středem vedle levého světlometu směrem dovnitř, kulaté mlhovky, slovenská SPZ (bílá s modrým pruhem EU, SK) v tmavém vybrání dole uprostřed. Vycházeno z fotek a popisů na Wikimedia Commons (ne obkresleno): „Iveco Bus Urbanway 12M CNG in Martin, Slovakia, November 4, 2024 - 01.jpg“ (vůz č. 31, MT-149FM, Kohútova), „Bus DPMM MT-149FM - Iveco Urbanway 12M CNG in Martin, Slovakia, November 8, 2024 - 01.jpg“ (Jesenského); slovenská Wikipedie „Autobusová doprava v Martine“. 1 px = 1 cm. -->
