<svg viewBox="0 0 50 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Pražský označník zastávky PID v klasickém červeném rámu (DPP), jako u přístřešku transit-shelter-tram, značka IJ 4c (autobus). Stín na straně vpravo (pro levou stranu ulice). 1 px = 1 cm, výška 3,35 m, spodní hrana = chodník, střed obrázku = osa označníku. -->
  <!-- Fotky, ze kterých kresba vychází: Commons: „Praha, Zenklova, označník tramvajové zastávky Vychovatelna (1).jpg“ (Jan Polák, CC BY-SA 3.0), „Jindřišská, zastávkový sloupek u Jeruzalémské.jpg“ (ŠJů, CC BY 4.0); pro srovnání nový tmavý označník „Praha, Palackého náměstí, nový zastávkový označník 01.jpg“ a „… 02.jpg“ (Aktron, CC BY-SA 4.0), nekreslen. -->
  <g transform="translate(-219 -20)">
    <!-- nožky rámu s příčkou u země -->
    <rect x="222" y="265" width="5" height="95" fill="#d42a22"/><rect x="261" y="265" width="5" height="95" fill="#d42a22"/>
    <rect x="264" y="265" width="2" height="95" fill="#a81f19"/><rect x="222" y="336" width="44" height="4" fill="#d42a22"/>
    <rect x="262" y="336" width="4" height="4" fill="#a81f19"/><rect x="220" y="357" width="48" height="3" fill="#a81f19"/>
    <!-- skříňka s jízdními řády -->
    <rect x="222" y="146" width="44" height="119" fill="#d42a22"/><rect x="262" y="146" width="4" height="119" fill="#a81f19"/>
    <rect x="226" y="150" width="16" height="62" fill="#f2d64b"/><rect x="244" y="150" width="16" height="62" fill="#f4f4f0"/>
    <rect x="226" y="218" width="34" height="40" fill="#f4f4f0"/><rect x="226" y="250" width="34" height="8" fill="#3a63b0"/>
    <!-- tabule s názvem zastávky a čísly linek -->
    <rect x="222" y="74" width="44" height="72" fill="#d42a22"/><rect x="262" y="74" width="4" height="72" fill="#a81f19"/>
    <rect x="226" y="78" width="34" height="50" fill="#f4f4f0"/><rect x="230" y="84" width="26" height="4" fill="#2a2b2a"/>
    <rect x="232" y="92" width="22" height="1.5" fill="#9a9b9c"/><rect x="230" y="99" width="8" height="8" fill="#2a2b2a"/>
    <rect x="239" y="99" width="8" height="8" fill="#2a2b2a"/><rect x="248" y="99" width="8" height="8" fill="#d42a22"/>
    <rect x="230" y="113" width="26" height="1.5" fill="#9a9b9c"/><rect x="230" y="118" width="20" height="1.5" fill="#9a9b9c"/>
    <!-- značka zastávky IJ 4 v červené skříňce: bílý okraj, modrý pás, bílé pole s piktogramem -->
    <rect x="219" y="23" width="50" height="51" fill="#d42a22"/><rect x="265" y="23" width="4" height="51" fill="#a81f19"/>
    <rect x="221" y="26" width="46" height="46" rx="3" fill="#f4f4f0"/><rect x="223" y="28" width="42" height="42" rx="2" fill="#1f56a8"/>
    <rect x="227" y="32" width="34" height="34" rx="1" fill="#f4f4f0"/>
    <path d="M229 42 Q229 40 231 40 H257 Q259 40 259 42 V58 Q259 60 257 60 H231 Q229 60 229 58 Z" fill="#1a1a1a"/><rect x="231.5" y="43" width="5" height="6" fill="#f4f4f0"/><rect x="238.5" y="43" width="5" height="6" fill="#f4f4f0"/><rect x="245.5" y="43" width="5" height="6" fill="#f4f4f0"/><rect x="252.5" y="43" width="4.5" height="9" fill="#f4f4f0"/><circle cx="235" cy="60" r="3" fill="#1a1a1a" stroke="#f4f4f0" stroke-width="1"/><circle cx="252" cy="60" r="3" fill="#1a1a1a" stroke="#f4f4f0" stroke-width="1"/>
