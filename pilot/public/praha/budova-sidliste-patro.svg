<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Pražský panelový dům (typ VVÚ-ETA / Larsen-Nielsen) po revitalizaci, jedno typické patro, pruh 4 m. 1 px = 1 cm. -->
  <!-- Zateplená světlá omítka, uprostřed vodorovné plastové okno 1,9 × 1,5 m s parapetem 0,9 m nad podlahou, -->
  <!-- po stranách souměrné svislé barevné pásy po celé výšce. Horní i spodní hrana jen plná omítka (navazuje bez švu). -->

  <!-- světlá omítka -->
  <rect x="0" y="0" width="400" height="280" fill="#ebe7dc"/>
  <!-- svislé barevné pásy 0,8 m, jediná sytá barva fasády -->
  <rect x="0" y="0" width="80" height="280" fill="#e1b23f"/>
  <rect x="320" y="0" width="80" height="280" fill="#e1b23f"/>

  <!-- okenní otvor: ostění v zateplení, nahoře stín nadpraží -->
  <rect x="103" y="38" width="194" height="152" fill="#cbc5b7"/>
  <!-- rám okna bílý 7 cm, sloupek uprostřed -->
  <rect x="107" y="44" width="186" height="146" fill="#f5f4f0"/>
  <rect x="114" y="51" width="82" height="132" fill="#687c88"/>
  <rect x="204" y="51" width="82" height="132" fill="#687c88"/>
  <!-- horní část skla ve stínu nadpraží -->
  <rect x="114" y="51" width="82" height="10" fill="#566873"/>
  <rect x="204" y="51" width="82" height="10" fill="#566873"/>
  <!-- vnější parapet z plechu -->
  <rect x="101" y="190" width="198" height="5" fill="#c3c4c1"/>
  <rect x="101" y="195" width="198" height="3" fill="#d9d4c8"/>
</svg>
