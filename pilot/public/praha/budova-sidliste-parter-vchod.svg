<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Přízemí pražského panelového domu (typ VVÚ-ETA / Larsen-Nielsen) po revitalizaci, pruh 4 m, se vchodem do sekce. -->
  <!-- Hliníková vstupní stěna (dvoukřídlé dveře, nadsvětlík, boční skla), stříška, nástupní stupeň; po stranách -->
  <!-- luxferová okénka sušárny a sklepů. Podlaha 0,2 m nad terénem, výška 3,0 m. 1 px = 1 cm, spodní hrana = chodník. -->

  <!-- omítka a barevné pásy jako v patrech -->
  <rect x="0" y="0" width="400" height="300" fill="#ebe7dc"/>
  <rect x="0" y="0" width="80" height="300" fill="#e1b23f"/>
  <rect x="320" y="0" width="80" height="300" fill="#e1b23f"/>
  <!-- sokl 0,8 m -->
  <rect x="0" y="220" width="400" height="80" fill="#77746d"/>
  <rect x="0" y="220" width="400" height="4" fill="#8f8c85"/>

  <!-- luxfery sušárny a sklepů (v barevných pásech), parapet 1,9 m nad terénem -->
  <rect x="8" y="70" width="64" height="44" fill="#c9c3b4"/>
  <rect x="12" y="74" width="56" height="36" fill="#e2e7e5"/>
  <rect x="12" y="86" width="56" height="2" fill="#b9c2c1"/>
  <rect x="12" y="98" width="56" height="2" fill="#b9c2c1"/>
  <rect x="26" y="74" width="2" height="36" fill="#b9c2c1"/>
  <rect x="39" y="74" width="2" height="36" fill="#b9c2c1"/>
  <rect x="52" y="74" width="2" height="36" fill="#b9c2c1"/>
  <rect x="328" y="70" width="64" height="44" fill="#c9c3b4"/>
  <rect x="332" y="74" width="56" height="36" fill="#e2e7e5"/>
  <rect x="332" y="86" width="56" height="2" fill="#b9c2c1"/>
  <rect x="332" y="98" width="56" height="2" fill="#b9c2c1"/>
  <rect x="346" y="74" width="2" height="36" fill="#b9c2c1"/>
  <rect x="359" y="74" width="2" height="36" fill="#b9c2c1"/>
  <rect x="372" y="74" width="2" height="36" fill="#b9c2c1"/>

  <!-- ostění vstupu (stín) a vstupní stěna z tmavých hliníkových profilů -->
  <rect x="114" y="34" width="172" height="248" fill="#bdb6a7"/>
  <rect x="120" y="40" width="160" height="242" fill="#4a4f53"/>
  <rect x="126" y="46" width="148" height="44" fill="#687c88"/>
  <rect x="126" y="96" width="26" height="180" fill="#687c88"/>
  <rect x="248" y="96" width="26" height="180" fill="#687c88"/>
  <rect x="158" y="96" width="39" height="180" fill="#5a6b75"/>
  <rect x="203" y="96" width="39" height="180" fill="#5a6b75"/>
  <!-- madla -->
  <rect x="191" y="170" width="3" height="40" fill="#c8c9c6"/>
  <rect x="206" y="170" width="3" height="40" fill="#c8c9c6"/>

  <!-- stříška nad vstupem a stín pod ní -->
  <rect x="94" y="16" width="212" height="12" fill="#5b6064"/>
  <rect x="94" y="16" width="212" height="3" fill="#7a7f83"/>
  <rect x="114" y="28" width="172" height="6" fill="#a8a193"/>

  <!-- nástupní stupeň -->
  <rect x="108" y="282" width="184" height="18" fill="#a9a8a2"/>
  <rect x="108" y="282" width="184" height="3" fill="#bdbcb6"/>
</svg>
