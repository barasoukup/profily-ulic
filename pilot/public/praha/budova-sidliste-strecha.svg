<svg viewBox="0 0 400 70" xmlns="http://www.w3.org/2000/svg">
  <!-- Plochá střecha pražského panelového domu (typ VVÚ-ETA / Larsen-Nielsen) po zateplení, pruh 4 m: čelo střešní -->
  <!-- desky a atika o tón tmavší než fasáda, s plechovou krycí lištou, celkem 0,7 m. Strojovna výtahu stojí nad -->
  <!-- schodištěm uprostřed traktu (jedna na sekci, několik metrů za fasádou), proto ji ve 4m pruhu nekreslíme. 1 px = 1 cm. -->

  <rect x="0" y="6" width="400" height="64" fill="#d9d3c5"/>
  <!-- krycí lišta a stín pod ní -->
  <rect x="0" y="0" width="400" height="6" fill="#b4b7b6"/>
  <rect x="0" y="6" width="400" height="3" fill="#c9c3b4"/>
</svg>
