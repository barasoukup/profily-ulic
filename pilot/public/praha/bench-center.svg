  <!-- Nová pražská lavička (soutěž IPR 2017, návrh Olgoj Chorchoj – M. Froněk, J. Němeček), pohled z boku.
       Litá bočnice: obě nohy se pod sedákem trubkovitě rozšiřují do tenkého nosníku, přední vybíhá špičkou
       pod přední lať, zadní přechází v páteř opěradla; dole trubková příčka. Barva rámu teplá tmavá
       hnědošedá podle pražských kusů téže sady (koš, stojan; foto prototypu IPR 2017). Latě termojasan:
       přední 9,5 × 4 cm s oblým nosem, 7 v sedáku 4 × 4 cm (sedák prohnutý), 9 v oblouku a opěradle 4,0 × 2,8 cm
       (kompromis kvůli výšce opěradla 86 cm; tvar podle výkresu v soutěžní brožuře IPR).
       1 px = 1 cm, sedák 45 cm, opěradlo do 86 cm. Opěradlo vlevo, sedí se doprava. -->
