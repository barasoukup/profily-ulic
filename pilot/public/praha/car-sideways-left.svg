  <path d="M30 100 L150 92 L176 89 L178 92 L150 95 L32 103 Z" fill="#bcc0c4"/>
  <path d="M7 128 L474 120 L475 150 Q474 162 466 166 L14 166 L8 158 Q5 148 6 132 Z" fill="#8e9398"/>
  <!-- černé prahy a spodky nárazníků -->
  <path d="M120 158 H346 V166 H120 Z" fill="#2f3133"/>
  <path d="M8 150 L40 152 L40 166 H14 L8 158 Z" fill="#2f3133"/>
  <path d="M420 156 H475 Q474 162 466 166 H420 Z" fill="#2f3133"/>
  <!-- střešní ližiny -->
  <path d="M286 35 V31 H426 L432 35 Z" fill="#c4c7ca"/>
