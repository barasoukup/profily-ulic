  <path d="M188 92 L252 46 Q259 40 272 40 L420 41 Q432 42 438 46 L452 70 L450 88 Z" fill="#1f2a33"/>
  <path d="M194 90 L254 48 Q260 44 272 44 L304 44 V89 Z" fill="#2e3b46"/>
  <path d="M312 44 H388 V88 H312 Z" fill="#2e3b46"/>
  <path d="M396 44 H420 Q430 45 434 49 L446 70 L444 86 L396 87 Z" fill="#2e3b46"/>
  <path d="M220 72 L250 50 L262 50 L232 72 Z" fill="#46596a" opacity=".7"/>
  <path d="M330 72 L350 46 L360 46 L340 72 Z" fill="#46596a" opacity=".5"/>
  <!-- spáry dveří a kliky -->
  <rect x="179" y="93" width="1.5" height="58" fill="#8e9398"/>
  <rect x="306" y="89" width="1.5" height="69" fill="#8e9398"/>
  <rect x="391" y="88" width="1.5" height="58" fill="#8e9398"/>
  <rect x="268" y="104" width="18" height="4" rx="2" fill="#8e9398"/>
  <rect x="356" y="102" width="18" height="4" rx="2" fill="#8e9398"/>
