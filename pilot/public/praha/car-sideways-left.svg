<svg viewBox="0 0 480 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Obecné osobní kombi střední třídy (nejčastější auto v pražských ulicích), z boku, předkem vlevo (kolmé stání).
       1 px = 1 cm: délka 4,70 m, šířka 1,83 m (se zrcátky 2,03), výška 1,47 m. Bez loga a značky. -->
  <g transform="translate(0.5,0)">
  <!-- karoserie: kapota, čelní sklo, rovná střecha, skoro svislé páté dveře -->
  <path d="M14 166 L8 158 Q4 146 6 132 L10 112 Q14 102 30 100 L150 92 L176 89 L250 42 Q258 36 272 35 L420 36 Q438 37 446 42 L452 46 L462 70 L470 92 Q474 100 474 110 L475 150 Q474 162 466 166 Z" fill="#a9aeb3"/>
