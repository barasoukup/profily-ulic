  <path d="M10 112 Q14 104 30 102 L62 100 L58 108 L13 117 Z" fill="#e3e9ec"/>
  <path d="M440 100 L463 96 L474 106 L474 113 L440 108 Z" fill="#c0272d"/>
  <!-- zrcátko u paty sloupku -->
  <path d="M186 92 Q190 82 204 82 L210 84 L210 94 Q200 97 188 96 Z" fill="#a9aeb3"/>
  <path d="M186 92 L210 92 V94 Q200 97 188 96 Z" fill="#2f3133"/>
  <!-- kola -->
  <path d="M129 166 A36 36 0 1 0 67 166 Z" fill="#1c1e20"/>
  <circle cx="98" cy="148" r="32" fill="#2a2b2a"/>
  <circle cx="98" cy="148" r="21" fill="#c4c7ca"/>
  <circle cx="98" cy="148" r="15" fill="#8f9193"/>
  <circle cx="98" cy="148" r="5" fill="#c4c7ca"/>
  <path d="M398 166 A36 36 0 1 0 336 166 Z" fill="#1c1e20"/>
  <circle cx="367" cy="148" r="32" fill="#2a2b2a"/>
  <circle cx="367" cy="148" r="21" fill="#c4c7ca"/>
  <circle cx="367" cy="148" r="15" fill="#8f9193"/>
  <circle cx="367" cy="148" r="5" fill="#c4c7ca"/>
  </g>
</svg>
