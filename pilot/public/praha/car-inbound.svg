<svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Obecné osobní kombi střední třídy (nejčastější auto v pražských ulicích), zepředu.
       1 px = 1 cm: délka 4,70 m, šířka 1,83 m (se zrcátky 2,03), výška 1,47 m. Bez loga a značky. -->
  <!-- pneumatiky pod autem, rozchod 1,54 m -->
  <rect x="92" y="148" width="22" height="32" rx="4" fill="#2a2b2a"/>
  <rect x="246" y="148" width="22" height="32" rx="4" fill="#2a2b2a"/>
  <rect x="114" y="158" width="132" height="8" fill="#2a2b2a"/>
  <!-- silueta: střecha, sklo zužující se ke střeše, ramena -->
  <path d="M134 35 H226 Q236 35 240 40 L262 86 L270 92 L272 100 H88 L90 92 L98 86 L120 40 Q124 35 134 35 Z" fill="#a9aeb3"/>
  <path d="M236 38 Q238 38 240 40 L262 86 L270 92 L272 100 H260 L258 92 Z" fill="#8e9398"/>
  <!-- konce střešních ližin -->
  <rect x="128" y="31" width="5" height="4" fill="#c4c7ca"/>
  <rect x="227" y="31" width="5" height="4" fill="#c4c7ca"/>
  <!-- čelní sklo, boční okna z profilu -->
  <path d="M124 43 Q127 39 134 39 H226 Q233 39 236 43 L255 87 H105 Z" fill="#1f2a33"/>
  <path d="M129 46 Q131 43 136 43 H224 Q229 43 231 46 L248 84 H112 Z" fill="#2e3b46"/>
  <path d="M140 80 L162 46 H178 L156 80 Z" fill="#46596a" opacity=".6"/>
  <path d="M100 86 L118 44 L121 44 L104 86 Z" fill="#1f2a33"/>
  <path d="M260 86 L242 44 L239 44 L256 86 Z" fill="#1f2a33"/>
  <!-- stěrače -->
  <path d="M150 84 L196 80" stroke="#2f3133" stroke-width="2.5" stroke-linecap="round"/>
  <!-- kapota -->
  <path d="M98 86 H262 L270 92 V96 H90 V92 Z" fill="#bcc0c4"/>
  <!-- zrcátka -->
  <path d="M90 86 L82 85 Q78 87 78 93 L80 99 L90 99 Z" fill="#a9aeb3"/>
  <path d="M270 86 L278 85 Q282 87 282 93 L280 99 L270 99 Z" fill="#8e9398"/>
  <!-- předek pod kapotou -->
  <path d="M88 100 L90 94 H270 L272 100 V150 Q272 158 266 160 H94 Q88 158 88 150 Z" fill="#a9aeb3"/>
  <path d="M260 94 H270 L272 100 V150 Q272 158 266 160 H262 Z" fill="#8e9398"/>
  <!-- úzké světlomety, mezi nimi obecná vodorovná maska bez znaku -->
  <path d="M94 104 L140 108 L138 117 L96 114 Z" fill="#e3e9ec"/>
  <path d="M266 104 L220 108 L222 117 L264 114 Z" fill="#e3e9ec"/>
  <path d="M98 108 L132 110 L131 113 L98 111 Z" fill="#b9c3c9"/>
  <path d="M262 108 L228 110 L229 113 L262 111 Z" fill="#b9c3c9"/>
  <path d="M144 109 H216 L212 119 H148 Z" fill="#2f3133"/>
  <!-- registrační značka jen jako náznak (52 × 11 cm, modrý pruh) -->
  <rect x="154" y="125" width="52" height="11" rx="1" fill="#f2f2ee"/>
  <rect x="154" y="125" width="5" height="11" fill="#1d4c99"/>
  <!-- spodní sání a mlhovky -->
  <path d="M116 140 H244 L238 154 H122 Z" fill="#2f3133"/>
  <rect x="98" y="141" width="12" height="5" rx="2" fill="#b9c3c9"/>
  <rect x="250" y="141" width="12" height="5" rx="2" fill="#b9c3c9"/>
  <rect x="92" y="155" width="176" height="5" rx="2" fill="#3c3f42"/>
</svg>
