<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Pražská tramvaj Tatra T3, čelní pohled. 1 px = 1 cm, šířka vozu 2,5 m. -->
  <!-- pantograf zepředu: ramena v ose, široký sběrač -->
  <g stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M126 104 L160 70 L194 104"/>
    <path d="M160 70 V40"/>
  </g>
  <path d="M82 46 Q86 36 96 36 H224 Q234 36 238 46" stroke="#5a5b5c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="120" y="34" width="80" height="3" fill="#3a3b3c"/>
  <rect x="123" y="102" width="8" height="7" rx="1" fill="#7a7b7c"/>
  <rect x="189" y="102" width="8" height="7" rx="1" fill="#7a7b7c"/>
  <rect x="122" y="108" width="76" height="10" rx="3" fill="#4a4b4c"/>
  <!-- krémová horní část: zaoblená střecha, boky se dolů mírně rozšiřují -->
  <path d="M39 266 L43 156 Q46 116 100 115 H220 Q274 116 277 156 L281 266 Z" fill="#f1ead7"/>
  <path d="M268 132 Q276 142 277 156 L281 266 H270 Z" fill="#ddd4bd"/>
  <!-- linková tabulka: čtverec v bílém rámečku -->
  <rect x="144" y="116" width="32" height="32" rx="4" fill="#f4f4f0" stroke="#cfc6ae" stroke-width="1"/>
  <rect x="147" y="119" width="26" height="26" rx="2" fill="#1d4c99"/>
  <text x="160" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">9</text>
  <!-- čelní sklo přes skoro celou šířku, sloupky a rohová skla -->
  <path d="M46 174 Q48 158 74 157 Q160 152 246 157 Q272 158 274 174 L276 246 H44 Z" fill="#1f2a33"/>
  <path d="M52 176 Q54 164 76 163 Q160 158 244 163 Q266 164 268 176 L270 241 H50 Z" fill="#2e3b46"/>
  <path d="M70 168 L108 166 L88 238 L70 238 Z" fill="#46596a" opacity=".75"/>
  <path d="M232 167 L248 168 L242 200 L230 200 Z" fill="#46596a" opacity=".5"/>
  <path d="M52 176 Q53 168 62 166 V241 H50 Z" fill="#3a4854"/>
  <path d="M268 176 Q267 168 258 166 V241 H270 Z" fill="#3a4854"/>
  <rect x="62" y="160" width="4" height="86" fill="#1f2a33"/>
  <rect x="254" y="160" width="4" height="86" fill="#1f2a33"/>
  <!-- cedule za sklem -->
  <rect x="126" y="216" width="68" height="24" rx="2" fill="#f4f4f0"/>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1d4c99" text-anchor="middle">
    <text x="160" y="226">VOZOVNA</text>
    <text x="160" y="236">ŽIŽKOV</text>
  </g>
  <!-- stěrače s osou dole -->
  <g stroke="#111" stroke-width="3" stroke-linecap="round">
    <path d="M112 238 L80 200"/>
    <path d="M208 238 L240 200"/>
  </g>
  <!-- víko pod sklem -->
  <rect x="130" y="251" width="60" height="12" rx="2" fill="none" stroke="#d8cfb7" stroke-width="1.5"/>
  <!-- levé zrcátko na rameni ze střechy s boční linkovou tabulkou -->
  <path d="M110 117 H34 Q26 117 22 124 L12 160" stroke="#8a8c8e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="3" y="160" width="13" height="28" rx="2" fill="#1d4c99"/>
  <text x="9.5" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">9</text>
  <rect x="3" y="190" width="14" height="24" rx="4" fill="#2a2b2a"/>
  <!-- pravé malé zrcátko u spodní hrany skla -->
  <path d="M281 226 L287 230" stroke="#2a2b2a" stroke-width="3"/>
  <rect x="285" y="222" width="11" height="26" rx="4" fill="#2a2b2a"/>
  <!-- červený pás -->
  <path d="M39 266 H281 L283 346 H37 Z" fill="#dc2a26"/>
  <path d="M270 266 H281 L283 346 H271 Z" fill="#b81f1d"/>
  <!-- světla v chromovém rámečku, blinkry, poziční světla, číslo vozu -->
  <circle cx="86" cy="316" r="16" fill="#c9cbcd"/>
  <circle cx="86" cy="316" r="12" fill="#f7f4ea"/>
  <circle cx="234" cy="316" r="16" fill="#c9cbcd"/>
  <circle cx="234" cy="316" r="12" fill="#f7f4ea"/>
  <rect x="44" y="283" width="9" height="14" rx="2" fill="#f08a1c"/>
  <rect x="267" y="283" width="9" height="14" rx="2" fill="#f08a1c"/>
  <rect x="44" y="310" width="8" height="8" rx="2" fill="#f4f4f0"/>
  <rect x="268" y="310" width="8" height="8" rx="2" fill="#f4f4f0"/>
  <text x="160" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#f2b233">7144</text>
  <!-- tmavě hnědý nárazník -->
  <rect x="34" y="344" width="252" height="18" rx="4" fill="#5a2f25"/>
  <!-- otevřený prostor pod nárazníkem: rám a sklopené spřáhlo -->
  <rect x="88" y="362" width="144" height="22" fill="#2a2b2a"/>
  <rect x="96" y="384" width="128" height="5" fill="#3a3b3c"/>
  <path d="M160 366 L190 388" stroke="#4a4b4c" stroke-width="5" stroke-linecap="round"/>
  <rect x="182" y="386" width="22" height="10" rx="2" fill="#5a5b5c"/>
  <!-- krémové rohy zástěry -->
  <path d="M48 362 H88 V402 H62 Q53 402 52 394 Z" fill="#f1ead7"/>
  <path d="M232 362 H272 L268 394 Q267 402 258 402 H232 Z" fill="#f1ead7"/>
  <path d="M260 362 H272 L268 394 Q267 402 258 402 Z" fill="#ddd4bd"/>
  <!-- podvozek: rám a ložiskové skříně -->
  <rect x="72" y="402" width="176" height="8" fill="#2a2b2a"/>
  <rect x="64" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <rect x="244" y="402" width="12" height="10" rx="2" fill="#3a3b3c"/>
  <!-- ocelová kola, okolek na vnitřní hraně -->
  <path d="M78 402 H92 V420 H88 V418 H78 Z" fill="#8f9193"/>
  <path d="M228 402 H242 V418 H232 V420 H228 Z" fill="#8f9193"/>
  <rect x="78" y="402" width="3" height="16" fill="#b5b7b9"/>
  <rect x="239" y="402" width="3" height="16" fill="#b5b7b9"/>
  <!-- žlábkové kolejnice zapuštěné do vozovky (rozchod 1 435 mm) -->
  <rect x="74" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="88" y="418" width="4" height="2" fill="#2a2b2a"/>
  <rect x="224" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="228" y="418" width="4" height="2" fill="#2a2b2a"/>
</svg>
