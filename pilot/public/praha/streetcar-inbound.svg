<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Pražská tramvaj (inspirováno Škodou 15T), čelní pohled. 1 px = 1 cm. -->
  <!-- sběrač -->
  <g stroke="#3a3b3c" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M120 72 L160 30 L200 72"/>
    <path d="M125 20 H195"/>
    <path d="M160 30 V20"/>
  </g>
  <rect x="110" y="66" width="100" height="10" rx="3" fill="#5c5e5f"/>
  <!-- střecha -->
  <path d="M48 110 Q50 78 90 76 H230 Q270 78 272 110 Z" fill="#d9d6cc"/>
  <!-- skříň -->
  <path d="M40 110 H280 L284 380 Q284 396 268 396 H52 Q36 396 36 380 Z" fill="#d6262d"/>
  <!-- krémový pás s čelním oknem -->
  <path d="M42 110 H278 L281 262 H39 Z" fill="#f3efe3"/>
  <!-- čelní sklo -->
  <path d="M58 132 Q60 116 80 116 H240 Q260 116 262 132 L266 250 H54 Z" fill="#26323d"/>
  <path d="M70 140 L120 140 L95 240 L62 240 Z" fill="#3b4b59" opacity=".8"/>
  <!-- cílová tabule -->
  <rect x="88" y="120" width="144" height="22" rx="3" fill="#111"/>
  <text x="160" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffb21a">22 BÍLÁ HORA</text>
  <!-- šedá linka pod oknem -->
  <rect x="38" y="262" width="244" height="8" fill="#5c5e5f"/>
  <!-- světla -->
  <rect x="56" y="300" width="44" height="16" rx="8" fill="#fff6d6" stroke="#5c5e5f" stroke-width="2"/>
  <rect x="220" y="300" width="44" height="16" rx="8" fill="#fff6d6" stroke="#5c5e5f" stroke-width="2"/>
  <!-- logo / znak -->
  <circle cx="160" cy="308" r="14" fill="#f3efe3"/>
  <text x="160" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d6262d">DPP</text>
  <!-- spojka a pojezd -->
  <rect x="140" y="360" width="40" height="18" rx="3" fill="#2a2b2a"/>
  <rect x="44" y="396" width="232" height="16" fill="#2a2b2a"/>
  <rect x="60" y="408" width="40" height="12" fill="#3a3b3c"/>
  <rect x="220" y="408" width="40" height="12" fill="#3a3b3c"/>
</svg>
