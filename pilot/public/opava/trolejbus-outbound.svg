<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Opavský trolejbus MDPO, Škoda 32Tr SOR, zadní pohled. Fotka zádě opavského vozu chybí; nátěr podle
       bočních pohledů na fotkách z Wikimedia Commons („Opava, Škoda 32Tr SOR č. 325“, „č. 328“): bílá střecha,
       černý pás oken, bílý pás a červená spodní část, tvar zádě podle karoserie SOR NS 12 (černé zadní sklo
       s číslem linky, svislá světla v rozích). 1 px = 1 cm, šířka 2,55 m. -->
  <!-- sběrače: dvě tyče ze zadní části střechy k trolejím -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 266 L148 16" stroke-width="5"/>
    <path d="M200 266 L212 16" stroke-width="5"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zrcátka vpředu vyčnívají za boky -->
    <rect x="26" y="56" width="16" height="42" rx="5" fill="#16181b"/>
    <rect x="318" y="56" width="16" height="42" rx="5" fill="#16181b"/>
    <!-- bílá záď se zaoblenými rohy -->
    <path d="M52 298 V54 Q52 26 80 26 H280 Q308 26 308 54 V298 Z" fill="#f3f3f1"/>
    <path d="M298 30 Q308 36 308 54 V298 H298 Z" fill="#dcdcd8"/>
    <!-- základna sběračů a kryt výzbroje -->
    <rect x="128" y="18" width="104" height="12" rx="4" fill="#e4e4e1"/>
    <!-- černé zadní sklo s číslem linky -->
    <rect x="62" y="50" width="236" height="118" rx="6" fill="#16181b"/>
    <path d="M78 56 L108 56 L92 160 L78 160 Z" fill="#3a4654" opacity=".55"/>
    <text x="268" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#52e08a">206</text>
    <!-- bílý panel s mřížkou chlazení, znakem a evidenčním číslem -->
    <rect x="96" y="180" width="168" height="26" rx="3" fill="#d8d9d6"/>
    <g stroke="#a7aaa8" stroke-width="2"><path d="M104 187 H256"/><path d="M104 193 H256"/><path d="M104 199 H256"/></g>
    <text x="80" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3a3c3e">314</text>
    <text x="280" y="226" text-anchor="end" font-family="Arial, sans-serif" font-size="10" font-weight="bold" font-style="italic" fill="#d42027">MDPO</text>
    <!-- červená spodní část zádě -->
    <path d="M52 234 H308 V280 H52 Z" fill="#d42027"/>
    <!-- svislá světla v rozích -->
    <rect x="56" y="168" width="14" height="96" rx="5" fill="#9c1418"/><rect x="58" y="246" width="10" height="14" rx="3" fill="#f2a33a"/><rect x="58" y="230" width="10" height="12" rx="3" fill="#eef1f3"/>
    <rect x="290" y="168" width="14" height="96" rx="5" fill="#9c1418"/><rect x="292" y="246" width="10" height="14" rx="3" fill="#f2a33a"/><rect x="292" y="230" width="10" height="12" rx="3" fill="#eef1f3"/>
    <rect x="152" y="252" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="252" width="6" height="12" fill="#2a63b8"/>
    <!-- tmavý nárazník -->
    <path d="M52 278 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#2c2e31"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
