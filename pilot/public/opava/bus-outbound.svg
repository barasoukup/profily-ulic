<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Opavský autobus MDPO, Iveco Urbanway 12M CNG, zadní pohled. Fotka zádě opavského vozu chybí; nátěr
       podle bočních pohledů na fotkách z Wikimedia Commons („Opava, IVECO Urbanway 12M CNG č. 171“, „č. 176“):
       bílá skříň, černý pás oken, červený spodek. Záď podle tvaru Urbanway: zadní okno s číslem linky, pod ním
       kryt motoru s mřížkou, svislá světla v rozích. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zrcátka vpředu vyčnívají za boky -->
  <rect x="26" y="56" width="16" height="42" rx="5" fill="#1d1f22"/>
  <rect x="318" y="56" width="16" height="42" rx="5" fill="#1d1f22"/>
  <!-- kryt nádrží CNG na střeše -->
  <path d="M84 22 Q86 8 104 8 H256 Q274 8 276 22 Z" fill="#e9e9e6"/>
  <!-- bílá skříň -->
  <path d="M52 296 V40 Q52 22 72 22 H288 Q308 22 308 40 V296 Z" fill="#f4f4f2"/>
  <path d="M298 24 Q308 28 308 42 V296 H298 Z" fill="#dededb"/>
  <!-- zadní okno s číslem linky -->
  <rect x="70" y="34" width="220" height="100" rx="5" fill="#1d1f22"/>
  <path d="M84 40 L112 40 L96 128 L84 128 Z" fill="#3a4654" opacity=".55"/>
  <text x="262" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e6d36a">213</text>
  <!-- kryt motoru: mřížka sání a evidenční číslo -->
  <rect x="96" y="150" width="168" height="40" rx="4" fill="#d6d8d6"/>
  <g stroke="#9ea2a3" stroke-width="2.5"><path d="M104 158 H256"/><path d="M104 166 H256"/><path d="M104 174 H256"/><path d="M104 182 H256"/></g>
  <text x="180" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3a3c3e">171</text>
  <!-- svislá světla v rozích -->
  <rect x="56" y="150" width="16" height="84" rx="6" fill="#9c1418"/><rect x="58" y="206" width="12" height="12" rx="3" fill="#f2a33a"/><rect x="58" y="190" width="12" height="12" rx="3" fill="#eef1f3"/>
  <rect x="288" y="150" width="16" height="84" rx="6" fill="#9c1418"/><rect x="290" y="206" width="12" height="12" rx="3" fill="#f2a33a"/><rect x="290" y="190" width="12" height="12" rx="3" fill="#eef1f3"/>
  <!-- červený spodek s registrační značkou a nápisem MDPO -->
  <path d="M52 236 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#d42027"/>
  <text x="80" y="256" font-family="Arial, sans-serif" font-size="11" font-weight="bold" font-style="italic" fill="#f4f4f2">MDPO</text>
  <rect x="152" y="262" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="262" width="6" height="12" fill="#2a63b8"/>
  <rect x="52" y="282" width="256" height="8" fill="#a8171d"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
