<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Opavský trolejbus MDPO, Škoda 32Tr SOR (nejpočetnější typ, 15 vozů), čelní pohled podle fotek z Wikimedia
       Commons („Opava, Horní náměstí, Škoda 32Tr SOR č. 314 (2019-08-14; 01)“, „Opava, Škoda 32Tr SOR č. 325“):
       celé čelo černé, velké sklo se zelenou LED tabulí, po stranách červené hrany od bílé střechy dolů, pod sklem
       bílá linka do oblouku a pod ní červený „úsměv“ mezi světly, kulatá světla v černých pouzdrech v rozích,
       nápis MDPO. 1 px = 1 cm, šířka 2,55 m; nahoře sběrače k trolejím. -->
  <!-- sběrače: dvě tyče ze zadní části střechy k trolejím (troleje 5,3–5,5 m nad vozovkou, rozchod 0,6 m) -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 262 L148 16" stroke-width="5"/>
    <path d="M200 262 L212 16" stroke-width="5"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zpětná zrcátka na ramenech od střechy -->
    <path d="M58 40 Q34 36 32 58" stroke="#16181b" stroke-width="5" fill="none"/>
    <rect x="22" y="56" width="18" height="46" rx="6" fill="#16181b"/>
    <path d="M302 40 Q326 36 328 58" stroke="#16181b" stroke-width="5" fill="none"/>
    <rect x="320" y="56" width="18" height="46" rx="6" fill="#16181b"/>
    <!-- bílá střecha s krytem výzbroje -->
    <path d="M56 46 Q58 24 86 24 H274 Q302 24 304 46 Z" fill="#f3f3f1"/>
    <rect x="128" y="16" width="104" height="12" rx="4" fill="#e4e4e1"/>
    <!-- černé čelo od střechy po nárazník -->
    <path d="M52 298 V60 Q52 38 76 36 H284 Q308 38 308 60 V298 Z" fill="#16181b"/>
    <!-- červené hrany boků od střechy dolů -->
    <path d="M52 62 Q52 40 74 36 L80 38 Q60 46 60 66 V280 H52 Z" fill="#d42027"/>
    <path d="M308 62 Q308 40 286 36 L280 38 Q300 46 300 66 V280 H308 Z" fill="#d42027"/>
    <!-- LED tabule: linka 206, cíl Jaktař -->
    <rect x="70" y="46" width="220" height="30" fill="#0c0d0e"/>
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#52e08a">
      <text x="86" y="68" font-size="18">206</text>
      <text x="200" y="68" font-size="17" text-anchor="middle" letter-spacing="1">JAKTAŘ</text>
    </g>
    <!-- čelní sklo s odlesky a stěrači -->
    <path d="M66 80 H294 V192 Q180 206 66 192 Z" fill="#26313b"/>
    <path d="M82 86 L128 86 L98 186 L80 184 Z" fill="#46596a" opacity=".5"/>
    <path d="M250 86 L272 86 L262 134 L240 134 Z" fill="#46596a" opacity=".4"/>
    <g stroke="#0b0c0d" stroke-width="2.5" stroke-linecap="round"><path d="M96 196 L170 186"/><path d="M276 196 L204 186"/></g>
    <!-- bílá linka do oblouku a pod ní červený úsměv mezi světly -->
    <path d="M60 226 Q180 270 300 226" stroke="#f3f3f1" stroke-width="4" fill="none"/>
    <path d="M96 246 Q180 274 264 246 L268 268 Q180 288 92 268 Z" fill="#d42027"/>
    <!-- nápis MDPO a znak Škoda -->
    <text x="180" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" font-style="italic" fill="#f3f3f1">MDPO</text>
    <circle cx="180" cy="226" r="6" fill="none" stroke="#9fb1bf" stroke-width="2"/>
    <!-- světla: tři kulatá v černém pouzdře v každém rohu -->
    <path d="M60 222 Q78 232 98 240 L96 272 Q74 274 60 268 Z" fill="#2b2e33" stroke="#7d8389" stroke-width="1.5"/>
    <circle cx="72" cy="240" r="6" fill="#eef2f5"/><circle cx="86" cy="248" r="6" fill="#eef2f5"/><circle cx="76" cy="260" r="4.5" fill="#f2a33a"/>
    <path d="M300 222 Q282 232 262 240 L264 272 Q286 274 300 268 Z" fill="#2b2e33" stroke="#7d8389" stroke-width="1.5"/>
    <circle cx="288" cy="240" r="6" fill="#eef2f5"/><circle cx="274" cy="248" r="6" fill="#eef2f5"/><circle cx="284" cy="260" r="4.5" fill="#f2a33a"/>
    <!-- nárazník s registrační značkou -->
    <rect x="54" y="278" width="252" height="20" rx="4" fill="#16181b"/>
    <rect x="152" y="282" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="282" width="6" height="12" fill="#2a63b8"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
