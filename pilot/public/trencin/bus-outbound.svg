<!-- Městský autobus MHD Trenčín (SOR NSG 12 na CNG, faceliftovaná skříň SOR NS/NSG 12, dopravce TD Transport / Transdev od 1. 9. 2022, vozy 401–438), zadní pohled. Nátěr v červeno-bílých barvách města: červená střecha s krytem plynových lahví, dvě malá červená obrysová světla v horních rozích a třetí malé červené světlo vpravo na červeném panelu kousek pod střechou a malá černá kopule zadní kamery vlevo od středu, velké jednolitě černé zadní okno (asi 46 % výšky skříně) s hustou mřížkou motorové věže v horních dvou třetinách levé části, číslo linky (bílé v poli s červeným okrajem) uvnitř okna ve střední výšce vpravo od středu, malé bílé logo SOR dole v okně vlevo od středu; pod oknem vysoký bílý pás (asi třetina výšky) s červeným znakem města (dva do sebe zaklesnuté oblé tahy) a nápisem TRENČÍN vlevo a červeným číslem vozu vpravo, malý černý kulatý znak/madlo, SPZ a logo SOR na jedné ose vlevo od středu (asi 36 % šířky), na krajích přes rohy světle šedé svislé sloupky od spodní hrany okna k nárazníku se třemi velkými kulatými červenými svítilnami v chromových rámečcích, slovenská SPZ (bílá, modrý pruh EU se SK) v bílém pásu; vysoký spodní nárazník (asi pětina výšky) červený na levých třech čtvrtinách s malým černým rohem vlevo, na něm bílý kotouč „80“, v pravé čtvrtině černý (roh motoru), černá spodní hrana. Vycházeno z fotek (popsáno, ne obkresleno): Wikimedia Commons „Zastávka Hasičská, Trenčín.jpg“ (Jetam2, CC BY-SA 4.0, 5. 10. 2025, vůz 426 zezadu); tiskové fotky SITA z představení vozů 15. 8. 2022 (cdn.sita.sk/sites/32/2022/08/…). 1 px = 1 cm. -->
