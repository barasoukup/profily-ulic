<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Mostecká tramvaj EVO2 (Pragoimex) dopravního podniku DPmML, čelní pohled. 1 px = 1 cm, šířka vozu 2,50 m,
       nízká podlaha. Podle fotek na Wikimedia Commons „Litvínov tram EVO2.jpg“ (vůz 323), „Litvínov tram 2024 2.jpg“
       a „Litvínov tram 2024 4.jpg“ (vůz 324), „Litvínov tram 2024 3.jpg“, „Pragoimex EVO Nr 327 Wendeschleife
       Chemopetrol 08 26.jpg“: černá zaoblená kapota až ke střeše, červená čepice jen v horních rozích a na bocích,
       velké sklo se zelenou LED tabulí, vedle skla tmavé sloupky, pod sklem černý panel se znakem, žlutá křídla se
       dvěma kulatými světly nad sebou, žlutý pás s drobnými LED, červený spodek skoro ke kolejím, černý jednoramenný
       pantograf. Číslo vozu je na boku za čelem, proto na čele není. -->
  <!-- jednoramenný pantograf: tmavá konstrukce, sběrač asi 1,6 m se sklopenými náběhy -->
  <path d="M74 52 L82 40 H238 L246 52" stroke="#2a2c2e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 40 V36 H170 V40" stroke="#2a2c2e" stroke-width="3" fill="none"/>
  <path d="M178 102 L146 72" stroke="#2a2c2e" stroke-width="6" stroke-linecap="round"/>
  <path d="M146 72 L162 41" stroke="#2a2c2e" stroke-width="4" stroke-linecap="round"/>
  <path d="M184 102 L160 86" stroke="#2a2c2e" stroke-width="2" stroke-linecap="round"/>
  <rect x="136" y="100" width="56" height="8" rx="2" fill="#2a2c2e"/>
  <!-- nízké tmavé kryty střešní výzbroje za kapotou -->
  <path d="M78 126 L84 112 Q86 108 92 108 H228 Q234 108 236 112 L242 126 Z" fill="#4c5054"/>
  <path d="M224 108 H228 Q234 108 236 112 L242 126 H232 Z" fill="#3a3d40"/>
  <!-- skříň: žlutá, nahoře červená čepice -->
  <path d="M35 404 V160 Q35 124 70 124 H250 Q285 124 285 160 V404 Z" fill="#f2c51c"/>
  <path d="M35 200 V160 Q35 124 70 124 H250 Q285 124 285 160 V200 Z" fill="#e2341f"/>
  <!-- černá kapota a maska čela až ke střeše, červená zůstává jen v rozích a na bocích -->
  <path d="M40 300 V184 Q40 131 96 128 H224 Q280 131 280 184 V300 Z" fill="#141618"/>
  <path d="M70 136 Q100 129 160 129 Q220 129 250 136 Q220 133 160 133 Q100 133 70 136 Z" fill="#3a3e42"/>
  <!-- tmavé boční sklo a sloupek vedle čelního skla -->
  <rect x="35" y="196" width="5" height="104" fill="#22272b"/>
  <rect x="280" y="196" width="5" height="104" fill="#22272b"/>
  <!-- velké čelní sklo, nahoře zelená LED tabule -->
  <path d="M47 296 V176 Q47 162 62 161 H258 Q273 162 273 176 V296 Z" fill="#2c3944"/>
  <rect x="64" y="166" width="192" height="20" rx="2" fill="#0d1012"/>
  <g font-family="Arial, sans-serif" font-weight="bold" fill="#43d94c">
    <text x="72" y="181" font-size="14">4</text>
    <text x="166" y="181" font-size="11" text-anchor="middle" letter-spacing=".5">LITVÍNOV</text>
  </g>
  <path d="M70 190 L112 190 L90 292 L64 292 Z" fill="#46596a" opacity=".5"/>
  <path d="M232 190 L252 190 L244 234 L228 234 Z" fill="#46596a" opacity=".4"/>
  <path d="M198 292 L246 236" stroke="#0e0f10" stroke-width="3" stroke-linecap="round"/>
  <!-- žlutá křídla a žlutý pás pod panelem -->
  <rect x="35" y="300" width="250" height="66" fill="#f2c51c"/>
  <!-- černý panel pod sklem se znakem, spodní hrana v mírném „U“ -->
  <path d="M64 300 H256 V334 Q256 358 228 358 H92 Q64 358 64 334 Z" fill="#141618"/>
  <circle cx="160" cy="330" r="8" fill="none" stroke="#e8eaec" stroke-width="2"/>
  <path d="M155 328 H165 M160 328 V336" stroke="#e8eaec" stroke-width="1.6"/>
  <!-- dvě kulatá světla nad sebou ve spodku křídel -->
  <circle cx="49" cy="322" r="5" fill="#eef0ea" stroke="#3a3c3e" stroke-width="1.5"/>
  <circle cx="50" cy="337" r="4" fill="#eef0ea" stroke="#3a3c3e" stroke-width="1.5"/>
  <circle cx="271" cy="322" r="5" fill="#eef0ea" stroke="#3a3c3e" stroke-width="1.5"/>
  <circle cx="270" cy="337" r="4" fill="#eef0ea" stroke="#3a3c3e" stroke-width="1.5"/>
  <!-- řada drobných LED v pásu -->
  <g fill="#fbf6dc">
    <circle cx="42" cy="349" r="1.4"/><circle cx="47" cy="353" r="1.4"/><circle cx="52" cy="356" r="1.4"/>
    <circle cx="58" cy="358.5" r="1.4"/><circle cx="64" cy="360.5" r="1.4"/><circle cx="70" cy="362" r="1.4"/><circle cx="76" cy="363" r="1.4"/>
    <circle cx="278" cy="349" r="1.4"/><circle cx="273" cy="353" r="1.4"/><circle cx="268" cy="356" r="1.4"/>
    <circle cx="262" cy="358.5" r="1.4"/><circle cx="256" cy="360.5" r="1.4"/><circle cx="250" cy="362" r="1.4"/><circle cx="244" cy="363" r="1.4"/>
  </g>
  <!-- červený spodek skoro ke kolejím -->
  <path d="M35 366 H285 V398 Q285 404 278 404 H42 Q35 404 35 398 Z" fill="#e2341f"/>
  <path d="M272 140 Q285 148 285 164 V398 Q285 404 280 404 H278 V160 Z" fill="#000" opacity=".08"/>
  <rect x="146" y="390" width="28" height="5" rx="2" fill="#a8261a"/>
  <!-- zpětná zrcátka na ramenech z horních rohů -->
  <path d="M282 168 H296 Q302 168 302 174 V210" stroke="#1b1d20" stroke-width="3" fill="none"/>
  <rect x="294" y="210" width="14" height="30" rx="3" fill="#1b1d20"/>
  <path d="M38 168 H24 Q18 168 18 174 V210" stroke="#1b1d20" stroke-width="3" fill="none"/>
  <rect x="12" y="210" width="14" height="30" rx="3" fill="#1b1d20"/>
  <!-- černá spodní hrana a podvozek -->
  <path d="M37 404 H283 V406 Q283 410 276 410 H44 Q37 410 37 406 Z" fill="#26282a"/>
  <rect x="78" y="410" width="14" height="8" fill="#8f9193"/>
  <rect x="228" y="410" width="14" height="8" fill="#8f9193"/>
  <!-- žlábkové kolejnice zapuštěné do vozovky (rozchod 1 435 mm) -->
  <rect x="74" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="88" y="418" width="4" height="2" fill="#2a2b2a"/>
  <rect x="224" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="228" y="418" width="4" height="2" fill="#2a2b2a"/>
</svg>
