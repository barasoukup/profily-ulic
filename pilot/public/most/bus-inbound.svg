<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Mostecký autobus DPmML, SOR NB 12 City, čelní pohled podle fotky na Wikimedia Commons („Most, Rudolická,
       autobusy DPmML (01).jpg“): bílá střecha, velké čelní sklo v tmavém rámu s oranžovou LED tabulí, rohové
       sloupky tmavé, pod sklem žlutý pás, pod ním červená příď se středovým bílým lichoběžníkem se znakem SOR,
       velké vodorovné světlomety v červené části u dolních rohů, pod nimi malá mlhová světla, uprostřed dole
       registrační značka. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zpětná zrcátka na ramenech -->
  <path d="M54 40 H40 Q32 40 32 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="22" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <path d="M306 40 H320 Q328 40 328 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="320" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <!-- skříň: bílá střecha -->
  <path d="M52 296 V42 Q52 22 72 22 H288 Q308 22 308 42 V296 Z" fill="#f4f4f1"/>
  <!-- čelní sklo v tmavém rámu s tmavými rohovými sloupky, nahoře LED tabule -->
  <path d="M55 36 Q55 30 62 30 H298 Q305 30 305 36 V206 H55 Z" fill="#262a2e"/>
  <rect x="62" y="34" width="236" height="30" fill="#15171a"/>
  <g font-family="Arial, sans-serif" font-weight="bold" fill="#f5a623">
    <text x="78" y="56" font-size="18">30</text>
    <text x="196" y="55" font-size="15" text-anchor="middle" letter-spacing=".5">NEMOCNICE</text>
  </g>
  <rect x="62" y="66" width="236" height="136" fill="#3a4a58"/>
  <path d="M76 70 L118 70 L90 198 L74 198 Z" fill="#5c6c79" opacity=".5"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 202 L166 188"/><path d="M276 202 L210 188"/></g>
  <!-- žlutý pás pod sklem -->
  <rect x="52" y="206" width="256" height="16" fill="#f2c51c"/>
  <circle cx="122" cy="214" r="4" fill="none" stroke="#8a7a2a" stroke-width="1.2"/>
  <circle cx="238" cy="214" r="4" fill="none" stroke="#8a7a2a" stroke-width="1.2"/>
  <!-- červená příď, na bocích až ke žlutému pásu -->
  <path d="M52 222 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#d42a22"/>
  <rect x="52" y="222" width="256" height="2" fill="#f4f4f1"/>
  <!-- středový bílý lichoběžník se znakem SOR -->
  <path d="M94 222 H266 L254 250 Q252 254 246 254 H114 Q108 254 106 250 Z" fill="#f4f4f1"/>
  <path d="M104 226 H256" stroke="#d9dadb" stroke-width="1"/>
  <path d="M170 240 H190 L186 246 H174 Z" fill="none" stroke="#8a8d90" stroke-width="1.6"/>
  <!-- velké vodorovné světlomety u dolních rohů -->
  <rect x="62" y="256" width="50" height="18" rx="5" fill="#d9dadb" stroke="#9fa3a6" stroke-width="1.5"/>
  <circle cx="76" cy="265" r="5" fill="#f6f7f8" stroke="#b9bcbf"/><circle cx="96" cy="265" r="5" fill="#f6f7f8" stroke="#b9bcbf"/>
  <rect x="248" y="256" width="50" height="18" rx="5" fill="#d9dadb" stroke="#9fa3a6" stroke-width="1.5"/>
  <circle cx="284" cy="265" r="5" fill="#f6f7f8" stroke="#b9bcbf"/><circle cx="264" cy="265" r="5" fill="#f6f7f8" stroke="#b9bcbf"/>
  <!-- malá mlhová světla pod nimi -->
  <rect x="78" y="282" width="16" height="5" rx="2" fill="#eef0f1"/>
  <rect x="266" y="282" width="16" height="5" rx="2" fill="#eef0f1"/>
  <!-- registrační značka pod bílým panelem -->
  <rect x="152" y="272" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="272" width="6" height="12" fill="#2a63b8"/>
  <path d="M298 24 Q308 28 308 42 V296 H298 Z" fill="#000" opacity=".08"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
