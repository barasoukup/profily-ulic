<!-- Městský autobus SOR NB 12 City, MHD Trnava (dopravce Arriva Trnava), zadní pohled. Celá skříň v tyrkysovém nátěru Arrivy včetně nárazníku (dole jen tenký tmavý pruh), na střeše užší tyrkysový kryt klimatizace posunutý (zezadu) doleva s tmavými větracími otvory, červená obrysová světla v horních rozích, zadní okno v černém pásu s oranžovou LED tabulí s číslem linky a tmavou svislou větrací mřížkou v levé části, pod oknem přes celou šířku pás vodorovných větracích štěrbin, pod ním hladká dvířka motoru mezi sloupci světel s prohlubní pro kliku a bílým logem „arriva“ s malou šipkou, po stranách svislé sloupce zadních světel (nahoře čirý blinkr s oranžovým nádechem, brzdové, bílé couvací, koncové), zpětná zrcátka na ramenech z horních rohů (zezadu jejich rub ve stejné výšce jako zepředu), nad SPZ prohlubeň s osvětlením, slovenská SPZ (bílá s modrým pruhem EU) na nárazníku, u jeho konců malé červené odrazky. Kreslen je SOR v tyrkysové (17 vozů z roku 2021); novější elektrobusy Iveco Streetway Elec 12M v trnavských barvách (od 2/2026) nakresleny nejsou. Vycházeno z fotek na Wikimedia Commons (ne obkresleno): „TT-663IP (4).jpg“ (SOR NB 12, Trnava, prosinec 2023, foto Šimon Šarvaic) pro nátěr, „SOR NB 12 in Kielce - rear.jpg“ pro tvar zádě; Wikipedia „Mestská hromadná doprava v Trnave“. 1 px = 1 cm. -->
