<!-- Městský autobus SOR NB 12 City, MHD Trnava (dopravce Arriva Trnava), čelní pohled. Celá skříň v tyrkysovém nátěru Arrivy včetně nárazníku (dole jen tenký tmavý pruh), na střeše užší tyrkysový kryt klimatizace posunutý doprava s tmavými větracími otvory, bílá obrysová světla na tyrkysové horní hraně nad rohy skla, velké čelní sklo v černém rámu s oranžovou LED tabulí (číslo linky vlevo, cíl, vpravo malá modrá kulatá ikona), stěrače parkované souběžně podél spodní hrany skla, vlevo dole na skle tři modré kulaté piktogramy (vozíček, cestující, kočárek), pod levou polovinou skla bílé logo „arriva“ s malou šipkou, uprostřed malé logo SOR, obdélníkové světlomety zasazené přímo do tyrkysového čela ve světle stříbrném lemu, s oranžovým blinkrem na vnějším konci, slovenská SPZ (bílá s modrým pruhem EU, „TT“) nízko na nárazníku mezi malými světly. Kreslen je SOR v tyrkysové (17 vozů z roku 2021); novější elektrobusy Iveco Streetway Elec 12M v trnavských barvách (od 2/2026) a žluto-červený městský nátěr nakresleny nejsou. Vycházeno z fotek na Wikimedia Commons (ne obkresleno): „TT-663IP (4).jpg“ (SOR NB 12, Trnava, prosinec 2023, foto Šimon Šarvaic), pro tvar čela i „TT-157HI (3).jpg“ (starší zeleno-bílý nátěr); Wikipedia „Mestská hromadná doprava v Trnave“. 1 px = 1 cm. -->
