<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Ostravský autobus DPO, Solaris Urbino 12 CNG IV. generace (plynový, DPO jezdí jen na CNG a elektřinu),
       čelní pohled v nátěru DPO od roku 2018 (světle modrá až tyrkysová). 1 px = 1 cm, šířka 2,55 m. Podle fotek:
       https://commons.wikimedia.org/wiki/File:Ostrava,_Solaris_Urbino_IV_12_CNG_č._7245_tulips.jpg (přesně zepředu)
       https://commons.wikimedia.org/wiki/File:Ostrava,_Solaris_Urbino_IV_12_CNG_č._7235.jpg
       https://commons.wikimedia.org/wiki/File:Ostrava,_Solaris_Urbino_IV_12_CNG_č._7249.jpg
       Na střeše plochý kryt plynových lahví, velké zrcátko vlevo výš než vpravo, černé čelo s oranžovou LED tabulí
       a sklem až nízko nad světla (spodní hrana skoro rovně stoupá doprava), pod ním modrý klín s piktogramy,
       znakem Solaris, znakem dpo (zjednodušeným) a číslem vozu, stříbrná lišta mezi horními světlomety, pod nimi
       šikmé černé klíny s LED pásky a mlhovkami, mezi nimi modrý nárazník s registrační značkou. -->
  <!-- zpětná zrcátka: velké černé hlavy na krátkých držácích u horních rohů, pravé níž -->
  <rect x="46" y="52" width="10" height="6" rx="2" fill="#1d1f22"/>
  <rect x="29" y="49" width="23" height="69" rx="6" fill="#1d1f22"/>
  <rect x="45" y="58" width="3" height="50" rx="1.5" fill="#4a4e52"/>
  <rect x="304" y="74" width="10" height="6" rx="2" fill="#1d1f22"/>
  <rect x="312" y="71" width="22" height="72" rx="6" fill="#1d1f22"/>
  <rect x="316" y="80" width="3" height="52" rx="1.5" fill="#4a4e52"/>
  <!-- modrá skříň -->
  <path d="M52 298 V40 Q52 20 74 20 H286 Q308 20 308 40 V298 Z" fill="#1ba8de"/>
  <path d="M298 22 Q308 28 308 40 V298 H298 Z" fill="#000" opacity=".1"/>
  <!-- plochý kryt plynových lahví na střeše -->
  <path d="M76 31 V20 Q76 16 80 16 H276 Q280 16 280 20 V31 Z" fill="#2db3e6"/>
  <path d="M268 16 H276 Q280 16 280 20 V31 H268 Z" fill="#1a93c6"/>
  <path d="M76 31 H280" stroke="#1590c2" stroke-width="1.5"/>
  <!-- černé čelo: LED tabule a sklo, spodní hrana skoro rovně stoupá doprava -->
  <path d="M56 253 V48 Q56 40 66 40 H294 Q304 40 304 48 V222 Q200 228 56 250 Z" fill="#17191c"/>
  <rect x="105" y="48" width="154" height="28" rx="2" fill="#2a1f14"/>
  <rect x="107" y="50" width="26" height="24" rx="1" fill="#f2a33a"/>
  <text x="120" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2a1f14">37</text>
  <g fill="#f2a33a" opacity=".85"><rect x="139" y="58" width="44" height="8" rx="1"/><rect x="188" y="58" width="64" height="8" rx="1"/></g>
  <path d="M64 82 H296 V217 Q200 222 64 243 Z" fill="#2c3944"/>
  <path d="M80 88 L120 88 L96 238 L76 241 Z" fill="#46596a" opacity=".5"/>
  <path d="M248 88 L270 88 L260 134 L240 134 Z" fill="#46596a" opacity=".4"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M100 237 L172 225"/><path d="M262 218 L208 224"/></g>
  <!-- modrý klín pod sklem: piktogramy přístupnosti, znak Solaris, znak dpo, číslo vozu -->
  <g fill="#2a63b8" stroke="#f4f8fa" stroke-width="1"><circle cx="93" cy="257" r="6"/><circle cx="106" cy="257" r="6"/><circle cx="119" cy="257" r="6"/></g>
  <g fill="none" stroke="#f4f8fa" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(22 26)"><circle cx="70.5" cy="226.8" r=".9" fill="#f4f8fa"/><path d="M70.5 228.5 V231.5 H73 L74.5 234.5"/><path d="M68.6 230.6 A2.6 2.6 0 1 0 72.6 234"/></g>
    <g transform="translate(21 26)"><circle cx="85" cy="226.5" r="1.1" fill="#f4f8fa"/><path d="M85 228.4 V232.6 M83.2 236 L85 232.6 L86.8 236 M82.8 230 H87.2"/></g>
    <g transform="translate(20 26)"><path d="M95.6 229.4 H102 Q102 233 98.8 233 Q95.6 233 95.6 229.4 Z M102 229.4 L103.4 226.8"/><circle cx="97.2" cy="235.2" r=".9"/><circle cx="100.6" cy="235.2" r=".9"/></g>
  </g>
  <ellipse cx="181" cy="251" rx="15" ry="7" fill="#c9d0d6" stroke="#8d969d" stroke-width="1.5"/>
  <g fill="none" stroke="#3d4a55" stroke-width="1.6" stroke-linecap="round">
    <path d="M170 252 Q177 245 190 247"/><path d="M172 255 Q185 256 192 250"/>
  </g>
  <g fill="none" stroke="#f4f8fa" stroke-width="2" stroke-linecap="round">
    <circle cx="211" cy="252" r="3.4"/><path d="M214.4 252 V245"/>
    <circle cx="220.2" cy="252" r="3.4"/><path d="M216.8 252 V258.5"/>
    <circle cx="229" cy="252" r="3.4"/>
  </g>
  <text x="295" y="257" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f4f8fa">7235</text>
  <!-- stříbrná lišta mezi horními světlomety -->
  <rect x="94" y="264" width="173" height="7" rx="2" fill="#d3d8dc"/>
  <rect x="94" y="269.5" width="173" height="1.5" fill="#a9afb4"/>
  <!-- horní světlomety ke středu zúžené do špičky u lišty: oranžový blinkr na vnějším konci a dvě kulaté lampy -->
  <path d="M52 261 H82 Q93 262 105 267.5 Q93 274 82 276 H52 Z" fill="#17191c"/>
  <circle cx="61" cy="268" r="3" fill="#f2a33a"/><circle cx="75" cy="268" r="4" fill="#e4e8eb" stroke="#8d9499"/><circle cx="90" cy="268" r="4" fill="#e4e8eb" stroke="#8d9499"/>
  <path d="M308 261 H278 Q267 262 255 267.5 Q267 274 278 276 H308 Z" fill="#17191c"/>
  <circle cx="299" cy="268" r="3" fill="#f2a33a"/><circle cx="285" cy="268" r="4" fill="#e4e8eb" stroke="#8d9499"/><circle cx="270" cy="268" r="4" fill="#e4e8eb" stroke="#8d9499"/>
  <!-- modrý nárazník mezi klíny (lichoběžník) s registrační značkou -->
  <path d="M94 277 H266 L250 298 H110 Z" fill="#22ade2"/>
  <rect x="152" y="280" width="57" height="13" rx="1" fill="#f4f4f2" stroke="#2a2b2a" stroke-width=".8"/><rect x="152" y="280" width="6" height="13" fill="#2a63b8"/>
  <!-- spodní černé klíny šikmo dolů ke středu: LED pásek a kulatá mlhovka -->
  <path d="M52 277 H94 L112 295 Q114 299 108 299 H72 Q56 298 52 292 Z" fill="#17191c"/>
  <circle cx="64" cy="284" r="3.5" fill="#e4e8eb" stroke="#8d9499"/>
  <path d="M69 284 H92" stroke="#f6fafc" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M308 277 H266 L248 295 Q246 299 252 299 H288 Q304 298 308 292 Z" fill="#17191c"/>
  <circle cx="296" cy="284" r="3.5" fill="#e4e8eb" stroke="#8d9499"/>
  <path d="M268 284 H291" stroke="#f6fafc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
