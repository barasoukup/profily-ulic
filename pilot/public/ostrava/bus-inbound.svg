<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Ostravský autobus DPO, Solaris Urbino 12 CNG IV. generace (plynový, DPO jezdí jen na CNG a elektřinu),
       čelní pohled v nátěru DPO od roku 2018 (světle modrá až tyrkysová). 1 px = 1 cm, šířka 2,55 m. Podle fotek:
       https://commons.wikimedia.org/wiki/File:Ostrava,_Solaris_Urbino_IV_12_CNG_č._7235.jpg
       https://commons.wikimedia.org/wiki/File:Ostrava,_Solaris_Urbino_IV_12_CNG_č._7249.jpg
       Na střeše kryt plynových lahví, černé čelo s velkou oranžovou LED tabulí a sklem, modrý panel se znakem
       Solaris, znakem dpo (zjednodušenými) a číslem vozu, bílá linka, šikmé černé světlomety v rozích. -->
  <!-- zpětná zrcátka na ramenech („králičí uši“) -->
  <path d="M60 30 Q38 28 34 48" stroke="#1d1f22" stroke-width="5" fill="none"/>
  <rect x="22" y="46" width="18" height="50" rx="6" fill="#1d1f22"/>
  <path d="M300 30 Q322 28 326 48" stroke="#1d1f22" stroke-width="5" fill="none"/>
  <rect x="320" y="46" width="18" height="50" rx="6" fill="#1d1f22"/>
  <!-- kryt plynových lahví na střeše -->
  <path d="M70 22 Q72 6 92 4 H268 Q288 6 290 22 Z" fill="#2db3e6"/>
  <path d="M262 4 H268 Q288 6 290 22 H274 Z" fill="#1a93c6"/>
  <!-- modrá skříň -->
  <path d="M52 296 V40 Q52 20 74 20 H286 Q308 20 308 40 V296 Z" fill="#1ba8de"/>
  <path d="M298 22 Q308 28 308 40 V296 H298 Z" fill="#000" opacity=".1"/>
  <!-- černé čelo: LED tabule a sklo, spodní hrana v oblouku zleva doprava -->
  <path d="M56 206 V38 Q56 30 66 30 H294 Q304 30 304 38 V180 Q250 182 200 192 Q130 206 56 206 Z" fill="#17191c"/>
  <rect x="72" y="38" width="216" height="24" rx="2" fill="#2a1f14"/>
  <rect x="76" y="41" width="30" height="18" rx="1" fill="#f2a33a"/>
  <text x="91" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2a1f14">37</text>
  <g fill="#f2a33a" opacity=".85"><rect x="116" y="47" width="60" height="7" rx="1"/><rect x="182" y="47" width="92" height="7" rx="1"/></g>
  <path d="M64 70 H296 V174 Q248 176 198 186 Q130 198 64 198 Z" fill="#2c3944"/>
  <path d="M80 76 L120 76 L94 194 L76 194 Z" fill="#46596a" opacity=".5"/>
  <path d="M248 76 L270 76 L260 122 L240 122 Z" fill="#46596a" opacity=".4"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M104 198 L170 186"/><path d="M268 176 L210 184"/></g>
  <!-- modrý panel: piktogramy, znak Solaris, znak dpo, číslo vozu -->
  <g fill="#2a63b8"><rect x="64" y="226" width="9" height="9" rx="1"/><rect x="76" y="226" width="9" height="9" rx="1"/><rect x="88" y="226" width="9" height="9" rx="1"/></g>
  <ellipse cx="132" cy="224" rx="13" ry="7" fill="#c9d0d6" stroke="#8d969d" stroke-width="1.5"/>
  <g fill="none" stroke="#f4f8fa" stroke-width="2.6" stroke-linecap="round">
    <circle cx="187" cy="224" r="4.5"/><path d="M191.5 224 V214"/>
    <circle cx="200" cy="224" r="4.5"/><path d="M195.5 224 V234"/>
    <circle cx="213" cy="224" r="4.5"/>
  </g>
  <text x="288" y="216" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f4f8fa">7235</text>
  <!-- bílá linka přes čelo -->
  <path d="M100 242 H260" stroke="#eef3f6" stroke-width="3"/>
  <!-- šikmé černé světlomety v rozích s LED pásky, vlevo blinkr -->
  <path d="M52 236 L60 236 Q100 240 108 248 L112 260 Q100 262 88 262 Q70 262 52 268 Z" fill="#17191c"/>
  <circle cx="62" cy="246" r="4" fill="#f2a33a"/><circle cx="76" cy="250" r="5" fill="#eef1f3"/><circle cx="92" cy="252" r="5" fill="#eef1f3"/>
  <path d="M62 260 L100 256" stroke="#f4f8fa" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M308 236 L300 236 Q260 240 252 248 L248 260 Q260 262 272 262 Q290 262 308 268 Z" fill="#17191c"/>
  <circle cx="298" cy="246" r="4" fill="#f2a33a"/><circle cx="284" cy="250" r="5" fill="#eef1f3"/><circle cx="268" cy="252" r="5" fill="#eef1f3"/>
  <path d="M298 260 L260 256" stroke="#f4f8fa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- registrační značka a modrý nárazník -->
  <rect x="152" y="256" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="256" width="6" height="12" fill="#2a63b8"/>
  <path d="M52 272 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1897cb"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
