<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Ostravská tramvaj Stadler Tango NF2 „nOVA“ (DPO, 39 vozů, nejnovější typ), čelní pohled v nátěru DPO od roku
       2018 (světle modrá až tyrkysová skříň). 1 px = 1 cm, šířka vozu 2,5 m, nízká podlaha. Podle fotek:
       https://commons.wikimedia.org/wiki/File:Ostrava,_Stadler_Tango_NF2_č._1704.jpg
       https://commons.wikimedia.org/wiki/File:Stadler_Tango_NF2_1717.jpg
       Tmavá maska kolem LED tabule a velkého čelního skla, pod ní modré čelo se dvěma černými „očima“ světel,
       znak dpo (zjednodušený) a bílé číslo vozu, modrá zástěra. -->
  <!-- jednoramenný pantograf, žlutý -->
  <g stroke="#f0b323" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M138 104 L180 72 L152 46"/>
  </g>
  <path d="M106 46 H198" stroke="#3f4245" stroke-width="4" stroke-linecap="round"/>
  <rect x="140" y="98" width="44" height="8" rx="2" fill="#4a4b4c"/>
  <!-- modré kryty střešní výzbroje -->
  <path d="M66 126 L76 106 Q78 102 84 102 H236 Q242 102 244 106 L254 126 Z" fill="#2db3e6"/>
  <path d="M232 102 H236 Q242 102 244 106 L254 126 H240 Z" fill="#1a93c6"/>
  <!-- modrá skříň, mírně vyboulená dolů -->
  <path d="M38 384 V152 Q38 124 66 124 H254 Q282 124 282 152 V300 Q286 340 285 384 Z" fill="#1ba8de"/>
  <path d="M38 300 Q34 340 35 384 H48 V300 Z" fill="#1ba8de"/>
  <path d="M272 126 Q282 134 282 152 V300 Q286 340 285 384 H274 Z" fill="#000" opacity=".1"/>
  <!-- tmavě šedá hrana střechy nad maskou -->
  <path d="M50 134 Q54 128 66 128 H254 Q266 128 270 134 Z" fill="#3a4047"/>
  <!-- černá maska: LED tabule, vysoké čelní sklo, spodní obruba těsně nad světly -->
  <path d="M48 290 V146 Q48 136 60 136 H260 Q272 136 272 146 V290 Q240 298 160 298 Q80 298 48 290 Z" fill="#17191c"/>
  <!-- oranžová LED tabule: číslo linky a řádek bodů místo cíle -->
  <rect x="64" y="142" width="192" height="20" rx="2" fill="#2a1f14"/>
  <text x="70" y="158" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f2a33a">4</text>
  <g fill="#f2a33a" opacity=".85">
    <rect x="96" y="149" width="22" height="6" rx="1"/><rect x="122" y="149" width="40" height="6" rx="1"/>
    <rect x="166" y="149" width="30" height="6" rx="1"/><rect x="200" y="149" width="44" height="6" rx="1"/>
  </g>
  <!-- čelní sklo s odlesky a dlouhým stěračem -->
  <path d="M56 170 H264 L266 280 Q160 290 54 280 Z" fill="#2c3944"/>
  <path d="M74 174 L114 174 L90 276 L70 274 Z" fill="#46596a" opacity=".55"/>
  <path d="M230 174 L250 174 L242 220 L224 220 Z" fill="#46596a" opacity=".4"/>
  <path d="M192 282 L240 200" stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dvě šikmé černé „oči“ světel s bílými LED v rozích čela -->
  <path d="M50 304 Q50 298 58 299 L120 306 Q128 307 128 314 Q128 322 120 322 H66 Q50 322 50 312 Z" fill="#17191c"/>
  <circle cx="68" cy="310" r="6" fill="#f4f8fa"/><circle cx="86" cy="312" r="5" fill="#eef4f6"/><circle cx="106" cy="314" r="4" fill="#dfe6ea"/>
  <path d="M270 304 Q270 298 262 299 L200 306 Q192 307 192 314 Q192 322 200 322 H254 Q270 322 270 312 Z" fill="#17191c"/>
  <circle cx="252" cy="310" r="6" fill="#f4f8fa"/><circle cx="234" cy="312" r="5" fill="#eef4f6"/><circle cx="214" cy="314" r="4" fill="#dfe6ea"/>
  <!-- znak dpo zjednodušený (tři bílé kroužky s nožičkami), pod ním bílé číslo vozu -->
  <g fill="none" stroke="#f4f8fa" stroke-width="2.6" stroke-linecap="round">
    <circle cx="147" cy="314" r="4.5"/><path d="M151.5 314 V304"/>
    <circle cx="160" cy="314" r="4.5"/><path d="M155.5 314 V324"/>
    <circle cx="173" cy="314" r="4.5"/>
  </g>
  <text x="160" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f4f8fa">1704</text>
  <!-- prolis zástěry -->
  <path d="M40 358 Q160 368 280 358" stroke="#1590c2" stroke-width="2" fill="none"/>
  <!-- zpětné zrcátko na rameni vlevo -->
  <path d="M40 164 H24 Q18 164 18 170 V178" stroke="#17191c" stroke-width="3" fill="none"/>
  <rect x="10" y="178" width="14" height="26" rx="3" fill="#17191c"/>
  <!-- tmavý spodek zástěry skoro ke kolejím (nízká podlaha, kola skrytá) -->
  <path d="M35 384 H285 V396 Q285 404 278 406 L270 410 H50 L42 406 Q35 404 35 396 Z" fill="#26282a"/>
  <rect x="140" y="390" width="40" height="8" rx="2" fill="#3a3c3e"/>
  <rect x="78" y="410" width="14" height="8" fill="#8f9193"/>
  <rect x="228" y="410" width="14" height="8" fill="#8f9193"/>
  <!-- žlábkové kolejnice zapuštěné do vozovky (rozchod 1 435 mm) -->
  <rect x="74" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="88" y="418" width="4" height="2" fill="#2a2b2a"/>
  <rect x="224" y="418" width="22" height="2" fill="#a7a9ab"/>
  <rect x="228" y="418" width="4" height="2" fill="#2a2b2a"/>
</svg>
