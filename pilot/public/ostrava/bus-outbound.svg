<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Ostravský autobus DPO, Solaris Urbino 12 CNG IV. generace, zadní pohled v nátěru DPO od roku 2018 (světle
       modrá až tyrkysová, záď celá modrá): plochý kryt plynových lahví na střeše, tmavé zadní sklo od střechy dolů
       se spodním okrajem jako „obočí“ (na krajích níž), těsně pod horní hranou skla v rozích malé brzdové pásky, uprostřed tabulka
       s linkou, hladká modrá klapka motoru s číslem vozu, dole vodorovný černý pás přes celou šířku s kulatými
       svítilnami a registrační značkou, modrý spodek s odrazkami. 1 px = 1 cm, šířka 2,55 m.
       Barvy podle fotek ostravských vozů (záď z nich vidět není):
       https://commons.wikimedia.org/wiki/File:Ostrava,_Solaris_Urbino_IV_12_CNG_č._7245_tulips.jpg
       https://commons.wikimedia.org/wiki/File:Ostrava,_Solaris_Urbino_IV_12_CNG_č._7235.jpg
       https://commons.wikimedia.org/wiki/File:Ostrava,_Solaris_Urbino_IV_12_CNG_č._7249.jpg
       Tvar zádě karoserie Urbino IV podle fotky rižského vozu 78071:
       https://commons.wikimedia.org/wiki/File:21._autobuss_Šmerļa_ielā.jpg -->
  <!-- zrcátka vpředu vyčnívají za boky (zezadu je pravé zrcátko vlevo, níž) -->
  <rect x="27" y="71" width="22" height="72" rx="6" fill="#1d1f22"/>
  <rect x="309" y="49" width="23" height="69" rx="6" fill="#1d1f22"/>
  <!-- modrá záď -->
  <path d="M52 298 V40 Q52 20 74 20 H286 Q308 20 308 40 V298 Z" fill="#1ba8de"/>
  <path d="M298 22 Q308 28 308 40 V298 H298 Z" fill="#000" opacity=".1"/>
  <!-- plochý kryt plynových lahví na střeše -->
  <path d="M76 31 V20 Q76 16 80 16 H276 Q280 16 280 20 V31 Z" fill="#2db3e6"/>
  <path d="M268 16 H276 Q280 16 280 20 V31 H268 Z" fill="#1a93c6"/>
  <path d="M76 31 H280" stroke="#1590c2" stroke-width="1.5"/>
  <!-- tmavé zadní sklo od střechy dolů, spodní okraj „obočí“ (na krajích níž), tenká černá obruba -->
  <path d="M58 184 V40 Q58 32 66 32 H294 Q302 32 302 40 V184 Q292 160 255 156 H105 Q68 160 58 184 Z" fill="#2a3038" stroke="#0e0f10" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M84 40 L112 40 L100 152 L84 156 Z" fill="#46525e" opacity=".5"/>
  <!-- malé červené brzdové pásky v horních rozích a tabulka s linkou uprostřed -->
  <rect x="72" y="39" width="12" height="4" rx="1.5" fill="#d8262b"/><rect x="276" y="39" width="12" height="4" rx="1.5" fill="#d8262b"/>
  <rect x="168" y="44" width="36" height="20" rx="2" fill="#2a1f14"/>
  <text x="186" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f2a33a">37</text>
  <!-- hladká modrá klapka motoru s číslem vozu -->
  <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f4f8fa">7235</text>
  <!-- vodorovný černý pás svítilen přes celou šířku, uprostřed registrační značka -->
  <rect x="52" y="252" width="256" height="14" fill="#17191c"/>
  <circle cx="67" cy="259" r="4.5" fill="#9fa3a6"/><circle cx="82" cy="259" r="4.5" fill="#d8262b"/><circle cx="97" cy="259" r="4.5" fill="#9fa3a6"/><circle cx="112" cy="259" r="4.5" fill="#9fa3a6"/>
  <circle cx="293" cy="259" r="4.5" fill="#f2a33a"/><circle cx="278" cy="259" r="4.5" fill="#d8262b"/><circle cx="263" cy="259" r="4.5" fill="#9fa3a6"/><circle cx="248" cy="259" r="4.5" fill="#9fa3a6"/>
  <rect x="152" y="255" width="56" height="15" rx="1" fill="#f4f4f2" stroke="#2a2b2a" stroke-width=".8"/><rect x="152" y="255" width="6" height="15" fill="#2a63b8"/>
  <!-- modrý spodek s odrazkami -->
  <path d="M52 272 H308" stroke="#1590c2" stroke-width="1.2"/>
  <circle cx="66" cy="284" r="4" fill="#b3161d"/><circle cx="294" cy="284" r="4" fill="#b3161d"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
