<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Jihlavský autobus DPmJ, Irisbus Citelis, zadní pohled podle fotky (Jihlavský MHD): krémová skříň, široké
       zadní okno se zeleným číslem linky vpravo dole, vpravo nahoře mřížka sání, uprostřed krytu motoru malá
       mřížka a evidenční číslo, dole červený pás s řadou kulatých světel a registrační značkou. 1 px = 1 cm. -->
  <!-- zrcátka vpředu vyčnívají za boky -->
  <rect x="24" y="54" width="16" height="44" rx="4" fill="#1d1f22"/>
  <rect x="320" y="54" width="16" height="44" rx="4" fill="#1d1f22"/>
  <!-- krémová skříň -->
  <path d="M52 296 V40 Q52 20 72 20 H288 Q308 20 308 40 V296 Z" fill="#efe6cf"/>
  <path d="M298 22 Q308 26 308 40 V296 H298 Z" fill="#d6cbb0"/>
  <!-- široké zadní okno v tmavém rámu, číslo linky vpravo dole -->
  <path d="M60 36 Q60 32 66 32 H258 Q264 32 264 36 V118 H60 Z" fill="#262a2e"/>
  <rect x="65" y="37" width="194" height="76" fill="#3a4a58"/>
  <path d="M80 41 L108 41 L92 109 L78 109 Z" fill="#5c6c79" opacity=".5"/>
  <rect x="222" y="90" width="34" height="20" fill="#15171a"/>
  <text x="239" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#43d94c">36</text>
  <!-- mřížka sání vpravo nahoře -->
  <g fill="#5d5a52"><rect x="272" y="42" width="26" height="4" rx="1"/><rect x="272" y="50" width="26" height="4" rx="1"/><rect x="272" y="58" width="26" height="4" rx="1"/><rect x="272" y="66" width="26" height="4" rx="1"/><rect x="272" y="74" width="26" height="4" rx="1"/><rect x="272" y="82" width="26" height="4" rx="1"/></g>
  <!-- kryt motoru: malá mřížka uprostřed a evidenční číslo -->
  <g fill="#5d5a52"><rect x="152" y="150" width="56" height="4" rx="1"/><rect x="152" y="158" width="56" height="4" rx="1"/><rect x="152" y="166" width="56" height="4" rx="1"/><rect x="152" y="174" width="56" height="4" rx="1"/></g>
  <text x="180" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d1f22">207</text>
  <!-- výstražný trojúhelník vlevo -->
  <circle cx="68" cy="160" r="6" fill="none" stroke="#cc2229" stroke-width="2"/>
  <!-- červený pás s řadou kulatých světel a registrační značkou -->
  <rect x="52" y="236" width="256" height="48" fill="#cc2229"/>
  <g>
    <circle cx="66" cy="250" r="5" fill="#f2a33a"/><circle cx="80" cy="250" r="5" fill="#8f1218"/><circle cx="94" cy="250" r="5" fill="#8f1218"/><circle cx="108" cy="250" r="5" fill="#eef1f3"/>
    <circle cx="294" cy="250" r="5" fill="#f2a33a"/><circle cx="280" cy="250" r="5" fill="#8f1218"/><circle cx="266" cy="250" r="5" fill="#8f1218"/><circle cx="252" cy="250" r="5" fill="#eef1f3"/>
  </g>
  <rect x="152" y="244" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="244" width="6" height="12" fill="#2a63b8"/>
  <path d="M52 284 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#2f3132"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
