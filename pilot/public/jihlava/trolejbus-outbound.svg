<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Jihlavský trolejbus DPmJ, Škoda 32Tr, zadní pohled: krémová skříň, na střeše kryt trakční výzbroje se sběrači,
       tmavé zadní okno s oranžovým číslem linky, svislá zadní světla v rozích, červený pás dole jako na čele,
       černý nárazník. 1 px = 1 cm, šířka 2,55 m. Kreslené podle vzhledu vozu, zezadu fotku nemáme. -->
  <!-- sběrače: dvě tyče ze zadní části střechy k trolejím, zezadu u kořene nejblíž -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 266 L148 16" stroke-width="5"/>
    <path d="M200 266 L212 16" stroke-width="5"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zrcátka vpředu vyčnívají za boky -->
    <rect x="26" y="56" width="16" height="42" rx="5" fill="#1b1d20"/>
    <rect x="318" y="56" width="16" height="42" rx="5" fill="#1b1d20"/>
    <!-- kryt výzbroje na střeše -->
    <path d="M96 30 L104 12 Q106 8 112 8 H248 Q254 8 256 12 L264 30 Z" fill="#e6dcc2"/>
    <rect x="140" y="12" width="80" height="16" rx="3" fill="#cfc4a8"/>
    <!-- krémová skříň, zezadu stín na pravém boku -->
    <path d="M52 298 V52 Q52 26 80 26 H280 Q308 26 308 52 V298 Z" fill="#efe6cf"/>
    <path d="M298 30 Q308 36 308 52 V298 H298 Z" fill="#d6cbb0"/>
    <!-- tmavé zadní okno, nahoře číslo linky -->
    <path d="M70 40 Q70 34 78 34 H282 Q290 34 290 40 V134 H70 Z" fill="#1b1d20"/>
    <rect x="78" y="40" width="204" height="88" fill="#2a3642"/>
    <path d="M92 44 L124 44 L104 124 L90 124 Z" fill="#46596a" opacity=".5"/>
    <text x="250" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f2a33a">B</text>
    <!-- zadní stěna: kryt motorového prostoru s mřížkou, evidenční číslo -->
    <rect x="110" y="152" width="140" height="6" rx="3" fill="#d2c6a8"/>
    <g fill="#cfc4a8"><rect x="120" y="166" width="120" height="4" rx="2"/><rect x="120" y="176" width="120" height="4" rx="2"/><rect x="120" y="186" width="120" height="4" rx="2"/></g>
    <text x="180" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1b1d20">11</text>
    <!-- zadní světla -->
    <rect x="56" y="150" width="14" height="78" rx="4" fill="#3a1a1c"/>
    <rect x="58" y="154" width="10" height="34" rx="3" fill="#d42a2a"/>
    <rect x="58" y="191" width="10" height="14" rx="3" fill="#f2a33a"/>
    <rect x="58" y="208" width="10" height="16" rx="3" fill="#eef1f3"/>
    <rect x="290" y="150" width="14" height="78" rx="4" fill="#3a1a1c"/>
    <rect x="292" y="154" width="10" height="34" rx="3" fill="#d42a2a"/>
    <rect x="292" y="191" width="10" height="14" rx="3" fill="#f2a33a"/>
    <rect x="292" y="208" width="10" height="16" rx="3" fill="#eef1f3"/>
    <!-- červený pás dole, uprostřed klesá jako brada na čele -->
    <path d="M52 236 Q180 252 308 236 V280 H52 Z" fill="#cc2229"/>
    <!-- černý nárazník, registrační značka -->
    <path d="M52 276 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1b1d20"/>
    <rect x="152" y="256" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="256" width="6" height="12" fill="#2a63b8"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
