<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Jihlavský trolejbus DPmJ, Škoda 32Tr, zadní pohled podle fotky (jihlava.cz): krémová střecha se sběrači,
       horní polovina zádě velké černé sklo v tmavém rámu, tmavě šedé rohy (pokračuje v nich tmavý pás boků),
       pod sklem krémový panel se zaoblenými horními rohy, znakem a číslem, dole červený pás s řadou kulatých
       světel a registrační značkou, tmavý spodek. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- sběrače: dvě tyče ze zadní části střechy k trolejím -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 266 L148 16" stroke-width="5"/>
    <path d="M200 266 L212 16" stroke-width="5"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zrcátka vpředu vyčnívají za boky -->
    <rect x="26" y="56" width="16" height="42" rx="5" fill="#1b1d20"/>
    <rect x="318" y="56" width="16" height="42" rx="5" fill="#1b1d20"/>
    <!-- tmavě šedý obrys zádě (rohy) -->
    <path d="M52 298 V54 Q52 26 80 26 H280 Q308 26 308 54 V298 Z" fill="#33363b"/>
    <!-- krémová střecha s poklopem a základnou sběračů -->
    <path d="M56 50 Q58 28 82 28 H278 Q302 28 304 50 Z" fill="#e6dcc2"/>
    <rect x="232" y="34" width="22" height="9" rx="2" fill="#3a3d42"/>
    <rect x="140" y="20" width="80" height="12" rx="3" fill="#cfc4a8"/>
    <!-- velké černé zadní sklo -->
    <rect x="64" y="52" width="232" height="120" rx="4" fill="#15171a"/>
    <path d="M80 58 L110 58 L94 164 L80 164 Z" fill="#3a4654" opacity=".55"/>
    <text x="270" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f2a33a">B</text>
    <!-- krémový panel pod sklem: zaoblené horní rohy, znak města a evidenční číslo -->
    <path d="M64 240 V194 Q64 176 84 176 H276 Q296 176 296 194 V240 Z" fill="#efe6cf"/>
    <circle cx="96" cy="196" r="9" fill="#efe6cf" stroke="#8a8578" stroke-width="2"/>
    <text x="124" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#5d5a52">11</text>
    <!-- červený pás s řadou kulatých světel a registrační značkou -->
    <rect x="60" y="240" width="240" height="34" fill="#cc2229"/>
    <circle cx="74" cy="252" r="5" fill="#eef1f3"/><circle cx="88" cy="252" r="5" fill="#8f1218"/><circle cx="102" cy="252" r="5" fill="#8f1218"/><circle cx="116" cy="252" r="5" fill="#f2a33a"/>
    <circle cx="286" cy="252" r="5" fill="#eef1f3"/><circle cx="272" cy="252" r="5" fill="#8f1218"/><circle cx="258" cy="252" r="5" fill="#8f1218"/><circle cx="244" cy="252" r="5" fill="#f2a33a"/>
    <rect x="152" y="256" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="256" width="6" height="12" fill="#2a63b8"/>
    <!-- tmavý spodek -->
    <path d="M52 274 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#33363b"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
