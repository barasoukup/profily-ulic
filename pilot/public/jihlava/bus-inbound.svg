<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Jihlavský autobus DPmJ, Irisbus Citelis, čelní pohled podle fotky: krémová skříň, velké čelní sklo v tenkém
       tmavém rámu se zelenou LED tabulí, krémový pás s kapkovitými světly a číslem, červený pás se znakem,
       tmavý nárazník. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zpětná zrcátka na ramenech -->
  <path d="M54 40 H40 Q32 40 32 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="22" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <path d="M306 40 H320 Q328 40 328 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="320" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <!-- krémová skříň -->
  <path d="M52 296 V42 Q52 22 72 22 H288 Q308 22 308 42 V296 Z" fill="#efe6cf"/>
  <path d="M298 24 Q308 28 308 42 V296 H298 Z" fill="#d6cbb0"/>
  <!-- čelní sklo v tenkém tmavém rámu, nahoře LED tabule -->
  <path d="M58 34 Q58 30 64 30 H296 Q302 30 302 34 V204 H58 Z" fill="#262a2e"/>
  <rect x="62" y="34" width="236" height="32" fill="#15171a"/>
  <g font-family="Arial, sans-serif" font-weight="bold" fill="#43d94c">
    <text x="78" y="57" font-size="18">36</text>
    <text x="198" y="57" font-size="15" text-anchor="middle" letter-spacing=".5">BOSCH DIESEL</text>
  </g>
  <rect x="62" y="68" width="236" height="132" fill="#3a4a58"/>
  <rect x="150" y="76" width="120" height="14" fill="#5c6c79" opacity=".6"/>
  <path d="M76 72 L118 72 L90 196 L74 196 Z" fill="#5c6c79" opacity=".5"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 200 L166 186"/><path d="M276 200 L210 186"/></g>
  <!-- krémový pás: větrací lišta, evidenční číslo, kapkovitá světla v rozích -->
  <rect x="140" y="210" width="80" height="4" rx="2" fill="#d2c6a8"/>
  <text x="180" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1d1f22">207</text>
  <path d="M56 216 Q60 252 98 254 Q90 236 62 216 Z" fill="#d9dadb" stroke="#9fa3a6" stroke-width="1.5"/>
  <circle cx="68" cy="232" r="5" fill="#f6f7f8" stroke="#9fa3a6"/><circle cx="76" cy="244" r="5" fill="#f6f7f8" stroke="#9fa3a6"/><circle cx="88" cy="248" r="4" fill="#f6f7f8" stroke="#9fa3a6"/>
  <path d="M304 216 Q300 252 262 254 Q270 236 298 216 Z" fill="#d9dadb" stroke="#9fa3a6" stroke-width="1.5"/>
  <circle cx="292" cy="232" r="5" fill="#f6f7f8" stroke="#9fa3a6"/><circle cx="284" cy="244" r="5" fill="#f6f7f8" stroke="#9fa3a6"/><circle cx="272" cy="248" r="4" fill="#f6f7f8" stroke="#9fa3a6"/>
  <!-- červený pás se znakem -->
  <rect x="52" y="256" width="256" height="22" fill="#cc2229"/>
  <circle cx="180" cy="267" r="7" fill="none" stroke="#f3ebd6" stroke-width="2"/>
  <!-- tmavý nárazník s registrační značkou -->
  <path d="M52 278 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#3a3c3e"/>
  <rect x="152" y="281" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="281" width="6" height="12" fill="#2a63b8"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
