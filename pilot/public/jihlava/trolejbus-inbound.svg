<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Jihlavský trolejbus DPmJ, Škoda 32Tr (design Patrik Kotas), čelní pohled podle fotky DPmJ (2025): celé čelo
       černé sklo od střechy, oranžová LED tabule, pod sklem béžová linka do oblouku, rohová světla, červená brada,
       červené hrany boků. 1 px = 1 cm, šířka 2,55 m; nahoře sběrače k trolejím. -->
  <!-- sběrače: dvě tyče ze zadní části střechy k trolejím (troleje 5,3–5,5 m nad vozovkou, rozchod 0,6 m) -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 262 L148 16" stroke-width="5"/>
    <path d="M200 262 L212 16" stroke-width="5"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zpětná zrcátka na ramenech od střechy („králičí uši“) -->
    <path d="M56 36 Q34 34 32 56" stroke="#1b1d20" stroke-width="5" fill="none"/>
    <rect x="22" y="54" width="18" height="46" rx="5" fill="#1b1d20"/>
    <path d="M304 36 Q326 34 328 56" stroke="#1b1d20" stroke-width="5" fill="none"/>
    <rect x="320" y="54" width="18" height="46" rx="5" fill="#1b1d20"/>
    <!-- černé čelo od střechy po nárazník -->
    <path d="M52 298 V56 Q52 26 84 26 H276 Q308 26 308 56 V298 Z" fill="#1b1d20"/>
    <path d="M70 30 H290 Q300 32 304 42 H56 Q60 32 70 30 Z" fill="#2c3036"/>
    <!-- červené hrany boků -->
    <path d="M52 64 Q52 56 56 52 V270 H52 Z" fill="#cc2229"/>
    <path d="M308 64 Q308 56 304 52 V270 H308 Z" fill="#cc2229"/>
    <!-- LED tabule: linka B, cíl Na Dolech -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#f2a33a">
      <text x="86" y="72" font-size="19">B</text>
      <text x="196" y="72" font-size="17" text-anchor="middle" letter-spacing="1">NA DOLECH</text>
    </g>
    <!-- čelní sklo (o odstín světlejší než rám) s odlesky a stěrači -->
    <path d="M62 86 H298 V196 Q180 214 62 196 Z" fill="#2a3642"/>
    <path d="M80 92 L126 92 L96 190 L78 188 Z" fill="#46596a" opacity=".5"/>
    <path d="M250 92 L272 92 L262 140 L240 140 Z" fill="#46596a" opacity=".4"/>
    <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 200 L170 190"/><path d="M276 200 L204 190"/></g>
    <!-- evidenční číslo a znak -->
    <text x="112" y="212" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f2a33a">11</text>
    <circle cx="180" cy="218" r="6" fill="none" stroke="#a9bccb" stroke-width="2"/>
    <!-- béžová linka do oblouku pod sklem -->
    <path d="M56 212 Q180 252 304 212" stroke="#e4d8b8" stroke-width="5" fill="none"/>
    <!-- rohová světla -->
    <path d="M56 214 Q78 222 100 236 L102 262 Q76 266 56 262 Z" fill="#bdbab2"/>
    <circle cx="70" cy="236" r="7" fill="#e9eef2"/><circle cx="86" cy="244" r="6" fill="#e9eef2"/>
    <circle cx="72" cy="254" r="5" fill="#f2a33a"/>
    <path d="M304 214 Q282 222 260 236 L258 262 Q284 266 304 262 Z" fill="#bdbab2"/>
    <circle cx="290" cy="236" r="7" fill="#e9eef2"/><circle cx="274" cy="244" r="6" fill="#e9eef2"/>
    <circle cx="288" cy="254" r="5" fill="#f2a33a"/>
    <!-- červená brada mezi světly -->
    <path d="M102 240 Q180 262 258 240 L262 280 Q180 290 98 280 Z" fill="#cc2229"/>
    <!-- nárazník a registrační značka -->
    <rect x="54" y="278" width="252" height="20" rx="4" fill="#1b1d20"/>
    <rect x="152" y="282" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="282" width="6" height="12" fill="#2a63b8"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
