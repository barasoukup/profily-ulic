<svg viewBox="0 0 270 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Nový pražský přístřešek zastávky autobusu (soutěž IPR 2018, návrh Olgoj Chorchoj) se slovenským označníkem (značka 331 Zastávka); přístřešek zatím pražský (místní podoba neověřena), zadní stěna vlevo, otevřená strana a označník vpravo (k vozovce). 1 px = 1 cm, spodní hrana = chodník. -->
  <!-- přístřešek z čela (návrh Olgoj Chorchoj): zadní sloup a tenká konzolová střecha z litého hliníku -->
  <g id="pristresek">
    <!-- pás s názvem zastávky a odjezdy pod střechou u zadní stěny, z boku -->
    <rect x="30" y="108" width="10" height="42" fill="#18191b"/>
    <rect x="38" y="109" width="2" height="13" fill="#5f656a"/>
    <!-- sloup a střecha: v řezu skoro pravý úhel, střecha kousek přesahuje dozadu a dopředu se ztenčuje -->
    <path d="M13 97 Q13 95 15 95 L198 97 L198 104 L46 109 L34 109 Q30 109 30 113 L30 360 L17 360 L17 103 L13 103 Z" fill="#2c2f32"/>
    <rect x="26" y="113" width="4" height="247" fill="#1f2124"/>
    <rect x="17" y="103" width="2" height="257" fill="#3d4144"/>
    <path d="M15 95 L198 97 L198 99 L15 97 Z" fill="#3d4144"/>
    <path d="M46 107 L198 102 L198 104 L46 109 Z" fill="#1f2124"/>
    <rect x="14" y="357" width="19" height="3" fill="#1f2124"/>
    <!-- boční stěna: reklamní vitrína v tlustém rámu, neutrální plocha -->
    <rect x="30" y="122" width="134" height="233" fill="#2c2f32"/>
    <rect x="155" y="122" width="9" height="238" fill="#1f2124"/>
    <rect x="30" y="355" width="7" height="5" fill="#1f2124"/>
    <rect x="30" y="122" width="134" height="2" fill="#3d4144"/>
    <rect x="37" y="132" width="118" height="213" fill="#e6e8e4"/>
    <path d="M37 280 L120 132 L155 132 L155 150 L64 345 L37 345 Z" fill="#f2f3ef"/>
    <path d="M76 345 L155 185 L155 194 L83 345 Z" fill="#d9dcd7"/>
  </g>
  <!-- označník: slovenský, značka 331 Zastávka (vyhl. 30/2020 Z. z.), jako slovensko/oznacnik-left.svg -->
  <g id="oznacnik">
    <rect x="240" y="40" width="8" height="320" fill="#8f9496"/><rect x="245" y="40" width="3" height="320" fill="#6e7375"/>
    <rect x="238" y="352" width="12" height="8" fill="#6e7375"/>
    <!-- vitrína s jízdním řádem -->
    <rect x="226" y="160" width="36" height="58" rx="2" fill="#8f9496"/><rect x="229" y="163" width="30" height="52" fill="#f4f4f0"/>
    <rect x="231" y="166" width="12" height="40" fill="#f2d64b"/><rect x="245" y="166" width="12" height="40" fill="#e3e4df"/>
    <!-- tabule s názvem zastávky -->
    <rect x="221" y="74" width="46" height="22" fill="#f4f4f0" stroke="#6e7375" stroke-width="1.5"/>
    <rect x="227" y="80" width="34" height="4" fill="#2a2b2a"/><rect x="231" y="88" width="26" height="2" fill="#9a9b9c"/>
    <rect x="221" y="98" width="46" height="12" fill="#f4f4f0" stroke="#6e7375" stroke-width="1.5"/>
    <rect x="226" y="101" width="7" height="6" fill="#2a2b2a"/><rect x="235" y="101" width="7" height="6" fill="#2a2b2a"/>
    <!-- značka 331 Zastávka -->
    <rect x="221" y="26" width="46" height="46" rx="3" fill="#f2f0e8" stroke="#6e7375" stroke-width="1"/>
    <rect x="223" y="28" width="42" height="42" rx="2" fill="#005a8c"/><rect x="227" y="32" width="34" height="34" rx="1" fill="#f4f4f0"/>
    <g transform="translate(222.85 28.48) scale(0.41)"><path d="M16.6 35.7l65.8 .2l1.8 1.5l3.1 10.8l.1 9.9l-1 1.5l-1.4 .6l-9.1 0l-.5-.3l-.9-2.6l-1.5-1.9l-2.3-1.3l-2.5-.3l-2.1 .5l-1.7 1.1l-2.8 4.8l-25.1 0l-.8-.3l-.9-2.8l-1.4-1.7l-2.3-1.3l-2.6-.3l-2.3 .6l-1.9 1.4l-2.1 4.3l-8.6 0l-1.1-1.3l0-7.8l3.8-10.9l.1-1l-1-1.4l.1-1.3zM19 38.7l-1.4 1.5l-2.3 6.6l.1 1.4l1.2 .5l8.7-.2l.6-1.5l-.3-7.9l-1.1-.5zM28.8 38.7l-.8 .4l-.2 .8l.3 8.3l1.3 .5l7.7-.3l.3-1.4l-2.5-8l-1-.4zM38.2 38.7l-.8 .5l-.1 .9l2.6 8.3l1.2 .3l6.2 0l1.3-.5l.1-1.7l-2.5-7.6zM49.6 38.7l-.8 .5l-.1 .9l2.6 8.3l1.2 .3l6.2 0l1.2-.4l.3-1.5l-2.6-7.9zM61 38.7l-.8 .6l0 1.1l2.5 8l1.2 .3l6.2 0l1.2-.4l.2-1.5l-2.5-7.9zM72.4 38.7l-.7 .4l-.2 1.1l2.6 8.2l1.2 .3l6.2 0l1.2-.4l.2-1.5l-2.5-7.9zM28.3 55.3l1.9 0l1.7 .8l1.4 1.5l.7 1.9l0 1.8l-.7 1.7l-1.4 1.4l-2 .8l-1.7 0l-2.2-1l-1.2-1.4l-.7-1.8l.1-2.2l.8-1.5l1.3-1.2zM67.9 55.3l2 .1l1.6 .7l1.5 1.5l.7 2l-.1 2l-.7 1.5l-1.4 1.4l-1.7 .7l-1.7 0l-2.2-.8l-1.4-1.4l-.7-2l.1-2l.8-1.7l1.5-1.4z" fill="#1a1a1a" fill-rule="evenodd"/></g>
  </g>
</svg>
