<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Zlínský trolejbus DSZO, Škoda 26Tr/27Tr Solaris (karoserie Solaris Urbino III. generace; nejpočetnější
       karoserie ve Zlíně a Otrokovicích, 18 vozů), čelní pohled v nátěru DSZO podle fotek z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:%C5%A0koda_27Tr_Solaris_ve_Zl%C3%ADn%C4%9B_(05).jpg
       https://commons.wikimedia.org/wiki/File:%C5%A0koda_27Tr_Solaris_ve_Zl%C3%ADn%C4%9B_(01).jpg
       https://commons.wikimedia.org/wiki/File:%C5%A0koda_26Tr_Solaris_ve_Zl%C3%ADn%C4%9B_(01).jpg
       Žlutá střecha s krytem výzbroje, černé čelo od střechy pod sklo s bílou LED tabulí, žlutý panel se znakem
       výrobce a modrými piktogramy, stříbrný pás se světly, modrý nárazník. 1 px = 1 cm, šířka 2,55 m; nahoře
       sběrače k trolejím. -->
  <!-- sběrače: dvě tyče ze zadní části střechy k trolejím (troleje 5,3–5,5 m nad vozovkou, rozchod 0,6 m) -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 262 L148 16" stroke-width="5"/>
    <path d="M200 262 L212 16" stroke-width="5"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zpětná zrcátka na ramenech od střechy -->
    <path d="M56 44 Q34 42 32 62" stroke="#1b1d20" stroke-width="5" fill="none"/>
    <rect x="22" y="60" width="18" height="46" rx="5" fill="#1b1d20"/>
    <path d="M304 44 Q326 42 328 62" stroke="#1b1d20" stroke-width="5" fill="none"/>
    <rect x="320" y="60" width="18" height="46" rx="5" fill="#1b1d20"/>
    <!-- žlutá skříň, žlutý kryt výzbroje s černými větracími otvory -->
    <rect x="128" y="12" width="104" height="18" rx="4" fill="#f0b21c"/>
    <g fill="#2a2b2a"><rect x="140" y="17" width="10" height="7" rx="1"/><rect x="156" y="17" width="10" height="7" rx="1"/><rect x="194" y="17" width="10" height="7" rx="1"/><rect x="210" y="17" width="10" height="7" rx="1"/></g>
    <path d="M52 298 V52 Q52 24 82 24 H278 Q308 24 308 52 V298 Z" fill="#f4b71e"/>
    <path d="M298 26 Q308 32 308 52 V298 H298 Z" fill="#dca11a"/>
    <!-- černé čelo: LED tabule a čelní sklo -->
    <path d="M56 216 V50 Q56 36 70 36 H290 Q304 36 304 50 V196 Q240 192 180 202 Q110 214 56 216 Z" fill="#1b1d20"/>
    <text x="84" y="68" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#e9efe6">8</text>
    <g fill="#e9efe6" opacity=".75"><rect x="132" y="54" width="110" height="4" rx="2"/><rect x="146" y="62" width="82" height="4" rx="2"/></g>
    <path d="M64 82 H296 V188 Q240 184 180 194 Q110 206 64 206 Z" fill="#2a3642"/>
    <path d="M80 88 L126 88 L96 190 L78 192 Z" fill="#46596a" opacity=".5"/>
    <path d="M250 88 L272 88 L262 136 L240 136 Z" fill="#46596a" opacity=".4"/>
    <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M150 198 L122 126"/><path d="M196 192 L172 120"/></g>
    <!-- žlutý panel pod sklem: znak výrobce, modré piktogramy vlevo -->
    <circle cx="180" cy="224" r="6" fill="none" stroke="#3a3c3e" stroke-width="2"/>
    <g fill="#2f62b8"><rect x="64" y="224" width="12" height="12" rx="1"/><rect x="78" y="224" width="12" height="12" rx="1"/><rect x="92" y="224" width="12" height="12" rx="1"/></g>
    <!-- bílá linka a stříbrný pás se světly přes celé čelo -->
    <rect x="52" y="240" width="256" height="3" fill="#f4f4f2"/>
    <path d="M52 243 H308 V262 Q180 266 52 262 Z" fill="#c9ccd0"/>
    <g fill="#eef1f3" stroke="#8d9297" stroke-width="1.2"><circle cx="66" cy="252" r="6"/><circle cx="82" cy="253" r="6"/><circle cx="97" cy="254" r="4"/>
      <circle cx="294" cy="252" r="6"/><circle cx="278" cy="253" r="6"/><circle cx="263" cy="254" r="4"/></g>
    <!-- modrý nárazník s registrační značkou -->
    <path d="M52 262 Q180 266 308 262 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1f4fa8"/>
    <rect x="152" y="276" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="276" width="6" height="12" fill="#2a63b8"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
