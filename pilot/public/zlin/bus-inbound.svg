<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Zlínský autobus DSZO, Iveco Urbanway 12M, čelní pohled v nátěru DSZO podle fotek z Wikimedia Commons
       (vůz 680 ve Zlíně, linka 33w Paseky, a vůz 683 v Otrokovicích):
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_ve_Zl%C3%ADn%C4%9B_(02).jpg
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_ve_Zl%C3%ADn%C4%9B_(04).jpg
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_v_Otrokovic%C3%ADch_(01).jpg
       Žlutá skříň, velké čelní sklo v černém rámu s jantarovou LED tabulí, spodní okraj skla mírně prohnutý,
       pod sklem stříbrná lišta ve tvaru štítu s nápisem IVECO, pod jejími konci vodorovná světla s tmavým víčkem,
       uprostřed logo DSZO, vpravo číslo vozu, u dveří nálepka a modrý piktogram, modrý nárazník s černým
       vybráním a registrační značkou; žlutá přechází do modré bez bílé linky. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zpětná zrcátka na ramenech -->
  <path d="M54 40 H40 Q32 40 32 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="22" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <path d="M306 40 H320 Q328 40 328 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="320" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <!-- žlutá skříň -->
  <path d="M52 296 V40 Q52 22 72 22 H288 Q308 22 308 40 V296 Z" fill="#f5ab0a"/>
  <path d="M298 24 Q308 28 308 42 V296 H298 Z" fill="#d9950a"/>
  <!-- čelní sklo v černém rámu, nahoře LED tabule -->
  <path d="M58 32 Q58 28 64 28 H296 Q302 28 302 32 V204 Q180 214 58 204 Z" fill="#1d1f22"/>
  <rect x="62" y="32" width="236" height="32" fill="#111214"/>
  <text x="78" y="55" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d8dc3c">33</text>
  <g fill="#d8dc3c" opacity=".8"><rect x="134" y="42" width="110" height="4" rx="2"/><rect x="134" y="50" width="80" height="4" rx="2"/></g>
  <path d="M62 66 H298 V196 Q180 206 62 196 Z" fill="#3a4a58"/>
  <path d="M76 70 L118 70 L90 195 L74 194 Z" fill="#5c6c79" opacity=".5"/>
  <rect x="160" y="74" width="110" height="12" fill="#5c6c79" opacity=".5"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 202 L166 190"/><path d="M276 202 L210 190"/></g>
  <!-- stříbrná lišta ve tvaru štítu s nápisem IVECO -->
  <path d="M94 216 Q180 222 266 216 L254 236 Q180 240 106 236 Z" fill="#c4c8cc" stroke="#9298a0" stroke-width="1"/>
  <path d="M96 217 Q180 223 264 217 L262 220 Q180 226 98 220 Z" fill="#e3e6e9"/>
  <text x="180" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#5d636a">IVECO</text>
  <!-- vodorovná světla pod konci lišty s tmavým šikmým víčkem -->
  <path d="M54 232 Q74 230 100 244 L98 262 Q74 264 54 262 Z" fill="#dfe3e6" stroke="#9aa0a6" stroke-width="1"/>
  <path d="M56 230 Q76 228 98 240 L98 244 Q74 234 56 236 Z" fill="#6b7076"/>
  <circle cx="68" cy="252" r="6" fill="#f6f7f8" stroke="#9aa0a6" stroke-width="1.2"/><circle cx="86" cy="254" r="5" fill="#f6f7f8" stroke="#9aa0a6" stroke-width="1.2"/>
  <path d="M306 232 Q286 230 260 244 L262 262 Q286 264 306 262 Z" fill="#dfe3e6" stroke="#9aa0a6" stroke-width="1"/>
  <path d="M304 230 Q284 228 262 240 L262 244 Q286 234 304 236 Z" fill="#6b7076"/>
  <circle cx="292" cy="252" r="6" fill="#f6f7f8" stroke="#9aa0a6" stroke-width="1.2"/><circle cx="274" cy="254" r="5" fill="#f6f7f8" stroke="#9aa0a6" stroke-width="1.2"/>
  <!-- u dveří žlutá nálepka a modrý piktogram s vločkou -->
  <rect x="102" y="240" width="10" height="8" fill="#f2d23c" stroke="#b9a020" stroke-width=".5"/>
  <rect x="102" y="250" width="10" height="10" rx="1" fill="#2f62b8"/>
  <path d="M107 251.5 V258.5 M103.5 255 H110.5 M104.5 252.5 L109.5 257.5 M109.5 252.5 L104.5 257.5" stroke="#f4f4f2" stroke-width=".9"/>
  <!-- logo DSZO a číslo vozu -->
  <g fill="none" stroke="#5a3a10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 243 Q192 239 192 249 Q192 257 182 257 Q172 257 172 250"/><path d="M165 249 H185"/><path d="M175 261 H197"/></g>
  <text x="232" y="259" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3a2a10">680</text>
  <!-- modrý nárazník, uprostřed černé vybrání s registrační značkou -->
  <path d="M52 266 Q120 272 180 268 Q240 272 308 266 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#0d46a8"/>
  <path d="M104 298 V282 Q104 276 112 276 H248 Q256 276 256 282 V298 Z" fill="#1d1f22"/>
  <rect x="152" y="280" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="280" width="6" height="12" fill="#2a63b8"/>
  <circle cx="74" cy="282" r="4" fill="#e1e4e6" stroke="#8d9296"/><circle cx="286" cy="282" r="4" fill="#e1e4e6" stroke="#8d9296"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
