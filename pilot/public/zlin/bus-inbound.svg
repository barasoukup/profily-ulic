<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Zlínský autobus DSZO, Iveco Urbanway 12M, čelní pohled v nátěru DSZO podle fotek z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_ve_Zl%C3%ADn%C4%9B_(02).jpg
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_ve_Zl%C3%ADn%C4%9B_(01).jpg
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_12M_ve_Zl%C3%ADn%C4%9B_(04).jpg
       Žlutá skříň, velké čelní sklo v černém rámu s bílou LED tabulí, pod sklem žlutá maska se stříbrnou prohnutou
       lištou (logo zjednodušené na plochu), čirá světla v rozích, modrý nárazník s černým vybráním a registrační
       značkou. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zpětná zrcátka na ramenech -->
  <path d="M54 40 H40 Q32 40 32 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="22" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <path d="M306 40 H320 Q328 40 328 48 V56" stroke="#1d1f22" stroke-width="4" fill="none"/>
  <rect x="320" y="54" width="18" height="48" rx="4" fill="#1d1f22"/>
  <!-- žlutá skříň -->
  <path d="M52 296 V40 Q52 22 72 22 H288 Q308 22 308 40 V296 Z" fill="#f4b71e"/>
  <path d="M298 24 Q308 28 308 42 V296 H298 Z" fill="#dca11a"/>
  <!-- čelní sklo v černém rámu, nahoře LED tabule -->
  <path d="M58 32 Q58 28 64 28 H296 Q302 28 302 32 V208 H58 Z" fill="#1d1f22"/>
  <rect x="62" y="32" width="236" height="32" fill="#111214"/>
  <text x="78" y="55" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e9efe6">33</text>
  <g fill="#e9efe6" opacity=".75"><rect x="134" y="42" width="110" height="4" rx="2"/><rect x="134" y="50" width="80" height="4" rx="2"/></g>
  <rect x="62" y="66" width="236" height="132" fill="#3a4a58"/>
  <path d="M76 70 L118 70 L90 194 L74 194 Z" fill="#5c6c79" opacity=".5"/>
  <rect x="160" y="74" width="110" height="12" fill="#5c6c79" opacity=".5"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 202 L166 188"/><path d="M276 202 L210 188"/></g>
  <!-- stříbrná prohnutá lišta pod sklem (logo jen jako plocha) -->
  <path d="M94 216 Q180 222 266 216 L254 236 Q180 240 106 236 Z" fill="#c4c8cc" stroke="#9298a0" stroke-width="1"/>
  <path d="M96 217 Q180 223 264 217 L262 220 Q180 226 98 220 Z" fill="#e3e6e9"/>
  <rect x="148" y="224" width="64" height="6" rx="3" fill="#8a9098"/>
  <!-- čirá světla v rozích -->
  <path d="M54 216 Q76 222 96 238 L94 262 Q72 266 54 262 Z" fill="#dfe3e6" stroke="#9aa0a6" stroke-width="1.2"/>
  <circle cx="68" cy="246" r="6" fill="#f6f7f8" stroke="#9aa0a6" stroke-width="1.2"/><circle cx="84" cy="250" r="5" fill="#f6f7f8" stroke="#9aa0a6" stroke-width="1.2"/>
  <path d="M306 216 Q284 222 264 238 L266 262 Q288 266 306 262 Z" fill="#dfe3e6" stroke="#9aa0a6" stroke-width="1.2"/>
  <circle cx="292" cy="246" r="6" fill="#f6f7f8" stroke="#9aa0a6" stroke-width="1.2"/><circle cx="276" cy="250" r="5" fill="#f6f7f8" stroke="#9aa0a6" stroke-width="1.2"/>
  <!-- modré piktogramy -->
  <g fill="#2f62b8"><rect x="104" y="244" width="10" height="10" rx="1"/></g>
  <!-- modrý nárazník, uprostřed černé vybrání s registrační značkou -->
  <path d="M52 266 Q120 272 180 268 Q240 272 308 266 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1f4fa8"/>
  <path d="M104 298 V282 Q104 276 112 276 H248 Q256 276 256 282 V298 Z" fill="#1d1f22"/>
  <rect x="152" y="280" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="280" width="6" height="12" fill="#2a63b8"/>
  <circle cx="74" cy="282" r="4" fill="#e1e4e6" stroke="#8d9296"/><circle cx="286" cy="282" r="4" fill="#e1e4e6" stroke="#8d9296"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
