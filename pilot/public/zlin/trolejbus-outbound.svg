<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Zlínský trolejbus DSZO, Škoda 26Tr/27Tr Solaris (Solaris Urbino III. generace), zadní pohled v nátěru DSZO
       (žlutá nahoře, modrý pás dole, mezi nimi bílá linka). Barvy podle fotek z Wikimedia Commons (záď na nich
       není vidět, tvar zádě jako u Urbina):
       https://commons.wikimedia.org/wiki/File:%C5%A0koda_27Tr_Solaris_ve_Zl%C3%ADn%C4%9B_(05).jpg
       https://commons.wikimedia.org/wiki/File:%C5%A0koda_27Tr_Solaris_ve_Zl%C3%ADn%C4%9B_(01).jpg
       Žlutá záď s krytem výzbroje, černé zadní sklo s číslem linky, žlutý panel s mřížkou, svislé svítilny
       v rozích, modrý pás s registrační značkou. 1 px = 1 cm, šířka 2,55 m; nahoře sběrače k trolejím. -->
  <!-- sběrače: dvě tyče ze zadní části střechy k trolejím -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 266 L148 16" stroke-width="5"/>
    <path d="M200 266 L212 16" stroke-width="5"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zrcátka vpředu vyčnívají za boky -->
    <rect x="26" y="62" width="16" height="42" rx="5" fill="#1b1d20"/>
    <rect x="318" y="62" width="16" height="42" rx="5" fill="#1b1d20"/>
    <!-- žlutá záď, kryt výzbroje s větracími otvory -->
    <rect x="128" y="12" width="104" height="18" rx="4" fill="#f0b21c"/>
    <g fill="#2a2b2a"><rect x="140" y="17" width="10" height="7" rx="1"/><rect x="156" y="17" width="10" height="7" rx="1"/><rect x="194" y="17" width="10" height="7" rx="1"/><rect x="210" y="17" width="10" height="7" rx="1"/></g>
    <path d="M52 298 V52 Q52 24 82 24 H278 Q308 24 308 52 V298 Z" fill="#f4b71e"/>
    <path d="M298 26 Q308 32 308 52 V298 H298 Z" fill="#dca11a"/>
    <!-- černé zadní sklo s číslem linky -->
    <rect x="66" y="46" width="228" height="110" rx="6" fill="#1b1d20"/>
    <path d="M82 52 L112 52 L96 150 L82 150 Z" fill="#3a4654" opacity=".55"/>
    <text x="266" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e9efe6">8</text>
    <!-- žlutý panel s mřížkou chlazení -->
    <g fill="#d39c16"><rect x="120" y="174" width="120" height="4" rx="2"/><rect x="120" y="184" width="120" height="4" rx="2"/><rect x="120" y="194" width="120" height="4" rx="2"/></g>
    <!-- svislé svítilny v rozích -->
    <rect x="56" y="166" width="14" height="74" rx="6" fill="#8f1218"/><rect x="58" y="202" width="10" height="10" rx="3" fill="#f2a33a"/><rect x="58" y="216" width="10" height="10" rx="3" fill="#eef1f3"/>
    <rect x="290" y="166" width="14" height="74" rx="6" fill="#8f1218"/><rect x="292" y="202" width="10" height="10" rx="3" fill="#f2a33a"/><rect x="292" y="216" width="10" height="10" rx="3" fill="#eef1f3"/>
    <!-- bílá linka a modrý pás s registrační značkou -->
    <rect x="52" y="243" width="256" height="3" fill="#f4f4f2"/>
    <path d="M52 246 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1f4fa8"/>
    <rect x="152" y="256" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="256" width="6" height="12" fill="#2a63b8"/>
    <path d="M52 280 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1a3f86"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
