<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Ústecký autobus DPmÚL, Iveco Urbanway 12M CNG, zadní pohled: tvar zádě Urbanway (černé zadní okno
       s číslem linky, pod ním skoro stejně široká černá „brada“ se znakem IVECO a svislými štěrbinami po stranách, bílý kryt
       motoru s žaluziemi z vodorovných lamel ve 3 obdélníkových polích (2 nahoře, 1 vpravo dole), dlouhé úzké svítilny podél svislých hran) podle hradecké fotky stejného typu.
       Barvy zádě jsou odhad (ústecká fotka zádě chybí): bílá skříň a červený spodní pás jako na boku a čele
       ústeckých vozů DPmÚL. 1 px = 1 cm, šířka 2,55 m.
       Fotky (Wikimedia Commons):
       https://commons.wikimedia.org/wiki/File:IVECO_Urbanway_12M_HK.jpg (tvar zádě)
       https://commons.wikimedia.org/wiki/File:Iveco_Urbanway_CNG_-_%C3%9Ast%C3%AD_nad_Labem.jpg (barvy boku) -->
  <!-- zrcátka vpředu vyčnívají za boky -->
  <rect x="26" y="50" width="16" height="44" rx="5" fill="#1d1f22"/>
  <rect x="318" y="50" width="16" height="44" rx="5" fill="#1d1f22"/>
  <!-- kryt plynových nádrží na střeše -->
  <path d="M76 22 Q80 8 100 8 H260 Q280 8 284 22 Z" fill="#e4e6e3"/>
  <!-- bílá záď -->
  <path d="M52 296 V40 Q52 20 74 20 H286 Q308 20 308 40 V296 Z" fill="#f4f5f3"/>
  <path d="M298 22 Q308 28 308 40 V296 H298 Z" fill="#d9dbd8"/>
  <!-- černé zadní okno s číslem linky -->
  <path d="M72 112 V38 Q72 30 82 30 H278 Q288 30 288 38 V112 Z" fill="#1d1f22"/>
  <path d="M88 36 L114 36 L102 108 L88 108 Z" fill="#3a4654" opacity=".55"/>
  <path d="M80 112 H280 L270 146 H90 Z" fill="#1d1f22"/>
  <g stroke="#3a3d40" stroke-width="2"><path d="M98 118 V140 M103 118 V140 M108 118 V140 M113 118 V140 M247 118 V140 M252 118 V140 M257 118 V140 M262 118 V140"/></g>
  <text x="180" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" letter-spacing="1" fill="#8a8f93">IVECO</text>
  <text x="262" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4fd06a">3</text>
  <!-- kryt motoru, žaluzie z vodorovných lamel ve 3 polích -->
  <path d="M96 146 H264 V214 Q180 220 96 214 Z" fill="none" stroke="#d4d7d4" stroke-width="2"/>
  <g fill="none" stroke="#d4d7d4" stroke-width="1"><rect x="104" y="150" width="72" height="20"/><rect x="184" y="150" width="72" height="20"/><rect x="184" y="180" width="72" height="26"/></g>
  <g fill="#c6c9c7"><rect x="104" y="152" width="72" height="2"/><rect x="104" y="156" width="72" height="2"/><rect x="104" y="160" width="72" height="2"/><rect x="104" y="164" width="72" height="2"/><rect x="104" y="168" width="72" height="2"/>
    <rect x="184" y="152" width="72" height="2"/><rect x="184" y="156" width="72" height="2"/><rect x="184" y="160" width="72" height="2"/><rect x="184" y="164" width="72" height="2"/><rect x="184" y="168" width="72" height="2"/>
    <rect x="184" y="182" width="72" height="2"/><rect x="184" y="186" width="72" height="2"/><rect x="184" y="190" width="72" height="2"/><rect x="184" y="194" width="72" height="2"/><rect x="184" y="198" width="72" height="2"/><rect x="184" y="202" width="72" height="2"/></g>
  <!-- dlouhé úzké svítilny podél svislých hran -->
  <rect x="58" y="116" width="12" height="120" rx="6" fill="#1d1f22"/><rect x="60" y="122" width="8" height="58" rx="3" fill="#b3151c"/><rect x="60" y="186" width="8" height="14" rx="3" fill="#f2a33a"/><rect x="60" y="206" width="8" height="14" rx="3" fill="#eef1f3"/>
  <rect x="290" y="116" width="12" height="120" rx="6" fill="#1d1f22"/><rect x="292" y="122" width="8" height="58" rx="3" fill="#b3151c"/><rect x="292" y="186" width="8" height="14" rx="3" fill="#f2a33a"/><rect x="292" y="206" width="8" height="14" rx="3" fill="#eef1f3"/>
  <!-- červený pás s registrační značkou -->
  <path d="M52 232 H308 V284 H52 Z" fill="#d62a2e"/>
  <rect x="152" y="246" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="246" width="6" height="12" fill="#2a63b8"/>
  <!-- černý spodek -->
  <path d="M52 284 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1d1f22"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
