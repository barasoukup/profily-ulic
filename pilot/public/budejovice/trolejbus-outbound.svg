<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Budějovický trolejbus DPMČB, Škoda 33Tr (karoserie SOR NS 18), zadní pohled v městském červeném nátěru.
       Barvy, červená střecha a kryt na střeše zadního článku podle fotek z Wikimedia Commons (vůz 424 z boku,
       detail sběračů vozu 421); záď sama na fotkách není, tvar zádě jako u stejné karoserie 32Tr v Jihlavě
       (neověřeno):
       https://commons.wikimedia.org/wiki/File:Trolejbus_%C5%A0koda_33Tr,_%C4%8C._Bud%C4%9Bjovice_(01).jpg
       https://commons.wikimedia.org/wiki/File:424_3_Senovazne_Nam.jpg
       Červená záď i střecha s krytem (základna sběračů je na konci předního článku), velké černé zadní sklo
       s číslem linky, hladký červený panel, svislé svítilny v černých pouzdrech v rozích, černý spodek. Sběrače
       dole červené, uprostřed stříbrné, pod hlavicí žlutý izolátor. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- sběrače: dvě tyče z konce předního článku k trolejím (troleje 5,3–5,5 m nad vozovkou, rozchod 0,6 m);
       spodní úsek červený, střed stříbrný, pod hlavicí žlutý izolační úsek -->
  <g stroke-width="5" stroke-linecap="butt" fill="none">
    <path d="M160 266 L157.0 203.5" stroke="#d0202e"/>
    <path d="M157.0 203.5 L149.4 46.0" stroke="#b9bec3"/>
    <path d="M149.4 46.0 L148 16" stroke="#f2c230"/>
    <path d="M200 266 L203.0 203.5" stroke="#d0202e"/>
    <path d="M203.0 203.5 L210.6 46.0" stroke="#b9bec3"/>
    <path d="M210.6 46.0 L212 16" stroke="#f2c230"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zrcátka vpředu vyčnívají za boky -->
    <rect x="20" y="82" width="20" height="58" rx="7" fill="#1b1d20"/>
    <rect x="320" y="82" width="20" height="58" rx="7" fill="#1b1d20"/>
    <!-- červená záď -->
    <path d="M52 298 V54 Q52 26 80 26 H280 Q308 26 308 54 V298 Z" fill="#c8142c"/>
    <path d="M298 30 Q308 36 308 54 V298 H298 Z" fill="#a8121f"/>
    <!-- červená střecha s krytem -->
    <path d="M56 48 Q58 28 82 28 H278 Q302 28 304 48 Z" fill="#b01a26"/>
    <rect x="132" y="18" width="96" height="14" rx="4" fill="#c21d2a"/>
    <!-- velké černé zadní sklo s číslem linky -->
    <rect x="64" y="52" width="232" height="118" rx="4" fill="#15171a"/>
    <path d="M80 58 L110 58 L94 162 L80 162 Z" fill="#3a4654" opacity=".55"/>
    <text x="268" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e6edf5">3</text>
    <!-- svislé svítilny v černých pouzdrech v rozích -->
    <rect x="56" y="176" width="18" height="74" rx="6" fill="#1b1d20"/>
    <rect x="59" y="182" width="12" height="26" rx="3" fill="#8f1218"/><rect x="59" y="212" width="12" height="10" rx="3" fill="#f2a33a"/><rect x="59" y="226" width="12" height="10" rx="3" fill="#eef1f3"/>
    <rect x="286" y="176" width="18" height="74" rx="6" fill="#1b1d20"/>
    <rect x="289" y="182" width="12" height="26" rx="3" fill="#8f1218"/><rect x="289" y="212" width="12" height="10" rx="3" fill="#f2a33a"/><rect x="289" y="226" width="12" height="10" rx="3" fill="#eef1f3"/>
    <!-- registrační značka -->
    <rect x="152" y="252" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="252" width="6" height="12" fill="#2a63b8"/>
    <!-- černý spodek -->
    <path d="M52 272 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1b1d20"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
