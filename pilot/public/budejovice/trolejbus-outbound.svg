<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Budějovický trolejbus DPMČB, Škoda 33Tr (karoserie SOR NS 18), zadní pohled v novém městském červeném nátěru.
       Barvy a tmavá střecha podle fotek z Wikimedia Commons (záď na nich není, tvar zádě jako u stejné karoserie
       32Tr v Jihlavě):
       https://commons.wikimedia.org/wiki/File:Trolejbus_%C5%A0koda_33Tr,_%C4%8C._Bud%C4%9Bjovice_(01).jpg
       https://commons.wikimedia.org/wiki/File:424_3_Senovazne_Nam.jpg
       Červená záď, tmavá střecha s krytem výzbroje a základnou sběračů, velké černé zadní sklo s číslem linky,
       červený panel, svislé svítilny v černých pouzdrech v rozích, černý spodek. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- sběrače: dvě tyče ze zadní části střechy k trolejím -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 266 L148 16" stroke-width="5"/>
    <path d="M200 266 L212 16" stroke-width="5"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zrcátka vpředu vyčnívají za boky -->
    <rect x="26" y="56" width="16" height="42" rx="5" fill="#1b1d20"/>
    <rect x="318" y="56" width="16" height="42" rx="5" fill="#1b1d20"/>
    <!-- červená záď -->
    <path d="M52 298 V54 Q52 26 80 26 H280 Q308 26 308 54 V298 Z" fill="#d0202e"/>
    <path d="M298 30 Q308 36 308 54 V298 H298 Z" fill="#b01a26"/>
    <!-- tmavá střecha s krytem výzbroje -->
    <path d="M56 48 Q58 28 82 28 H278 Q302 28 304 48 Z" fill="#2c3036"/>
    <rect x="132" y="18" width="96" height="14" rx="4" fill="#3a3e44"/>
    <!-- velké černé zadní sklo s číslem linky -->
    <rect x="64" y="52" width="232" height="118" rx="4" fill="#15171a"/>
    <path d="M80 58 L110 58 L94 162 L80 162 Z" fill="#3a4654" opacity=".55"/>
    <text x="268" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e6edf5">3</text>
    <!-- mřížka chlazení na červeném panelu -->
    <g fill="#a8141f"><rect x="120" y="188" width="120" height="4" rx="2"/><rect x="120" y="198" width="120" height="4" rx="2"/><rect x="120" y="208" width="120" height="4" rx="2"/></g>
    <!-- svislé svítilny v černých pouzdrech v rozích -->
    <rect x="56" y="176" width="18" height="74" rx="6" fill="#1b1d20"/>
    <rect x="59" y="182" width="12" height="26" rx="3" fill="#8f1218"/><rect x="59" y="212" width="12" height="10" rx="3" fill="#f2a33a"/><rect x="59" y="226" width="12" height="10" rx="3" fill="#eef1f3"/>
    <rect x="286" y="176" width="18" height="74" rx="6" fill="#1b1d20"/>
    <rect x="289" y="182" width="12" height="26" rx="3" fill="#8f1218"/><rect x="289" y="212" width="12" height="10" rx="3" fill="#f2a33a"/><rect x="289" y="226" width="12" height="10" rx="3" fill="#eef1f3"/>
    <!-- registrační značka -->
    <rect x="152" y="252" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="252" width="6" height="12" fill="#2a63b8"/>
    <!-- černý spodek -->
    <path d="M52 272 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1b1d20"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
