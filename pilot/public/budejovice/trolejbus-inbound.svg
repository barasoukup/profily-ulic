<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Budějovický trolejbus DPMČB, Škoda 33Tr (karoserie SOR NS 18, design Patrik Kotas), čelní pohled v městském
       červeném nátěru podle fotek z Wikimedia Commons (vozy 424 a 425, detail sběračů vozu 421):
       https://commons.wikimedia.org/wiki/File:Trolejbus_%C5%A0koda_33Tr,_%C4%8C._Bud%C4%9Bjovice_(01).jpg
       https://commons.wikimedia.org/wiki/File:424_3_Senovazne_Nam.jpg
       Černé čelo s tenkou černou stříškou, nad ní červený kryt střechy; čelní sklo jedna plocha od stříšky po
       panel, LED tabule svítí uvnitř skla nahoře; červené hrany boků; pod sklem panel s logem DPMČB, třemi modrými
       piktogramy, žlutým evidenčním číslem vpravo nad koncem oblouku a znakem Škoda těsně nad nejnižším místem oblouku; stříbrný oblouk uprostřed nejširší, ke krajům do
       špiček, pod ním přímo červená plocha; v rozích černá pouzdra s tmavými čočkami a šikmou řadou LED teček.
       Sběrače dole červené, uprostřed stříbrné, pod hlavicí žlutý izolátor. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- sběrače: dvě tyče z konce předního článku k trolejím (troleje 5,3–5,5 m nad vozovkou, rozchod 0,6 m);
       spodní úsek červený, střed stříbrný, pod hlavicí žlutý izolační úsek -->
  <g stroke-width="5" stroke-linecap="butt" fill="none">
    <path d="M160 262 L157.0 200.5" stroke="#d0202e"/>
    <path d="M157.0 200.5 L149.4 45.5" stroke="#b9bec3"/>
    <path d="M149.4 45.5 L148 16" stroke="#f2c230"/>
    <path d="M200 262 L203.0 200.5" stroke="#d0202e"/>
    <path d="M203.0 200.5 L210.6 45.5" stroke="#b9bec3"/>
    <path d="M210.6 45.5 L212 16" stroke="#f2c230"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zpětná zrcátka na dlouhých ramenech od střechy („králičí uši“) -->
    <path d="M58 34 Q32 32 30 84" stroke="#1b1d20" stroke-width="5" fill="none"/>
    <rect x="20" y="82" width="20" height="58" rx="7" fill="#1b1d20"/>
    <path d="M302 34 Q328 32 330 84" stroke="#1b1d20" stroke-width="5" fill="none"/>
    <rect x="320" y="82" width="20" height="58" rx="7" fill="#1b1d20"/>
    <!-- červený kryt na střeše předního článku -->
    <rect x="140" y="18" width="80" height="12" rx="3" fill="#b01a26"/>
    <!-- černé čelo od střechy po nárazník -->
    <path d="M52 298 V56 Q52 26 84 26 H276 Q308 26 308 56 V298 Z" fill="#1b1d20"/>
    <!-- červené hrany boků, končí nad pouzdry světel -->
    <path d="M52 62 Q52 54 57 50 V226 H52 Z" fill="#c8142c"/>
    <path d="M308 62 Q308 54 303 50 V226 H308 Z" fill="#c8142c"/>
    <!-- čelní sklo: jedna plocha od stříšky po panel, s odlesky a stěrači -->
    <path d="M58 50 Q180 32 302 50 V204 H58 Z" fill="#1c2228"/>
    <path d="M80 72 L124 72 L96 196 L78 194 Z" fill="#3a4a58" opacity=".5"/>
    <path d="M250 72 L272 72 L262 130 L240 130 Z" fill="#3a4a58" opacity=".4"/>
    <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 200 L170 190"/><path d="M276 200 L204 190"/></g>
    <!-- LED tabule uvnitř skla nahoře: číslo linky a dva řádky cíle -->
    <text x="84" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf5">3</text>
    <g fill="#e6edf5" opacity=".75"><rect x="130" y="50" width="116" height="4" rx="2"/><rect x="130" y="58" width="86" height="4" rx="2"/></g>
    <!-- tenká černá stříška přes celou šířku čela -->
    <path d="M56 46 Q60 28 84 26 H276 Q300 28 304 46 Q180 36 56 46 Z" fill="#15171a"/>
    <!-- panel pod sklem: logo DPMČB (smyčka ze dvou šipek), tři modré piktogramy, znak Škoda, evidenční číslo -->
    <g stroke="#d0202e" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M92 211 H88 Q84 211 84 215 Q84 219 88 219 H90"/><path d="M92 221 H96 Q100 221 100 217 Q100 213 96 213 H94"/>
    </g>
    <g fill="#d0202e"><path d="M90 216.5 L93 219 L90 221.5 Z"/><path d="M94 210.5 L91 213 L94 215.5 Z"/></g>
    <g fill="#2f6fc4"><circle cx="128" cy="228" r="6"/><circle cx="142" cy="228" r="6"/><circle cx="156" cy="228" r="6"/></g>
    <g transform="translate(0 12)"><g fill="#ffffff"><circle cx="127" cy="212.8" r="1.1"/><rect x="126.2" y="214.2" width="1.6" height="3.4"/><path d="M126 219.5 a2.6 2.6 0 1 0 4.2 -1.6" stroke="#fff" stroke-width="1.1" fill="none"/>
      <rect x="138.6" y="213" width="5.4" height="3.6" rx="1.4"/><circle cx="139.6" cy="219.2" r="1"/><circle cx="143" cy="219.2" r="1"/>
      <circle cx="156" cy="212.3" r="1.1"/><path d="M154.9 214 h2.2 v3 l1 3.2 h-1.2 l-0.9 -2.6 l-0.9 2.6 h-1.2 l1 -3.2 Z"/></g></g>
    <circle cx="180" cy="240" r="6" fill="none" stroke="#8e959c" stroke-width="2"/>
    <text x="266" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f2c230">424</text>
    <!-- červená plocha přímo pod obloukem a stříbrný oblouk, uprostřed nejširší, ke krajům do špiček -->
    <path d="M90 238 Q140 254 180 266 Q220 254 270 238 L254 282 H106 Z" fill="#c8142c"/>
    <path d="M57 222 Q120 236 180 252 Q240 236 303 222 V228 Q240 250 180 266 Q120 250 57 228 Z" fill="#c3c7cb"/>
    <!-- rohová světla v černých pouzdrech: dvě čočky hned pod šikmou řadou LED teček, níž u nárazníku třetí menší, blinkry -->
    <g fill="#2a2e33" stroke="#c3c7cb" stroke-width="2"><circle cx="68" cy="250" r="5"/><circle cx="88" cy="259" r="5"/><circle cx="292" cy="250" r="5"/><circle cx="272" cy="259" r="5"/><circle cx="80" cy="278" r="3.5"/><circle cx="280" cy="278" r="3.5"/></g>
    <g fill="#f2f4f6"><circle cx="62.0" cy="232.00" r="1.6"/><circle cx="66.5" cy="235.75" r="1.6"/><circle cx="71.0" cy="239.50" r="1.6"/><circle cx="75.5" cy="243.25" r="1.6"/><circle cx="80.0" cy="247.00" r="1.6"/><circle cx="84.5" cy="250.75" r="1.6"/><circle cx="89.0" cy="254.50" r="1.6"/><circle cx="93.5" cy="258.25" r="1.6"/><circle cx="98.0" cy="262.00" r="1.6"/>
      <circle cx="298.0" cy="232.00" r="1.6"/><circle cx="293.5" cy="235.75" r="1.6"/><circle cx="289.0" cy="239.50" r="1.6"/><circle cx="284.5" cy="243.25" r="1.6"/><circle cx="280.0" cy="247.00" r="1.6"/><circle cx="275.5" cy="250.75" r="1.6"/><circle cx="271.0" cy="254.50" r="1.6"/><circle cx="266.5" cy="258.25" r="1.6"/><circle cx="262.0" cy="262.00" r="1.6"/></g>
    <circle cx="62" cy="270" r="3" fill="#f2a33a"/><circle cx="298" cy="270" r="3" fill="#f2a33a"/>
    <!-- nárazník a registrační značka -->
    <rect x="54" y="280" width="252" height="18" rx="4" fill="#151618"/>
    <rect x="152" y="283" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="283" width="6" height="12" fill="#2a63b8"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
