<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Budějovický trolejbus DPMČB, Škoda 33Tr (karoserie SOR NS 18, design Patrik Kotas; 35 vozů, nejpočetnější typ
       od roku 2025), čelní pohled v novém městském červeném nátěru podle fotek z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Trolejbus_%C5%A0koda_33Tr,_%C4%8C._Bud%C4%9Bjovice_(01).jpg
       https://commons.wikimedia.org/wiki/File:424_3_Senovazne_Nam.jpg
       Tmavá střecha nad čelem, celé čelo černé sklo s bílou LED tabulí, červené hrany boků, pod sklem černý panel se
       stříbrným obloukem a pod ním červeným klínem, rohová světla v černých pouzdrech s řadou LED teček, černý
       nárazník. 1 px = 1 cm, šířka 2,55 m; nahoře sběrače k trolejím. -->
  <!-- sběrače: dvě tyče ze zadní části střechy k trolejím (troleje 5,3–5,5 m nad vozovkou, rozchod 0,6 m) -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 262 L148 16" stroke-width="5"/>
    <path d="M200 262 L212 16" stroke-width="5"/>
  </g>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <!-- zpětná zrcátka na ramenech od střechy („králičí uši“) -->
    <path d="M56 36 Q34 34 32 56" stroke="#1b1d20" stroke-width="5" fill="none"/>
    <rect x="22" y="54" width="18" height="46" rx="5" fill="#1b1d20"/>
    <path d="M304 36 Q326 34 328 56" stroke="#1b1d20" stroke-width="5" fill="none"/>
    <rect x="320" y="54" width="18" height="46" rx="5" fill="#1b1d20"/>
    <!-- černé čelo od střechy po nárazník, tmavá střecha -->
    <path d="M52 298 V56 Q52 26 84 26 H276 Q308 26 308 56 V298 Z" fill="#1b1d20"/>
    <path d="M70 30 H290 Q300 32 304 42 H56 Q60 32 70 30 Z" fill="#2c3036"/>
    <rect x="140" y="18" width="80" height="12" rx="3" fill="#2c3036"/>
    <!-- červené hrany boků, dole se rozšiřují k rohům -->
    <path d="M52 62 Q52 54 57 50 V226 Q57 252 64 270 H52 Z" fill="#d0202e"/>
    <path d="M308 62 Q308 54 303 50 V226 Q303 252 296 270 H308 Z" fill="#d0202e"/>
    <!-- LED tabule: číslo linky a řádek cíle (bílé LED) -->
    <text x="84" y="72" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#e6edf5">3</text>
    <g fill="#e6edf5" opacity=".75"><rect x="134" y="58" width="116" height="4" rx="2"/><rect x="134" y="66" width="86" height="4" rx="2"/></g>
    <!-- čelní sklo (o odstín světlejší než rám) s odlesky a stěrači -->
    <path d="M62 86 H298 V192 Q180 208 62 192 Z" fill="#2a3642"/>
    <path d="M80 92 L126 92 L96 186 L78 184 Z" fill="#46596a" opacity=".5"/>
    <path d="M250 92 L272 92 L262 140 L240 140 Z" fill="#46596a" opacity=".4"/>
    <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 196 L170 186"/><path d="M276 196 L204 186"/></g>
    <!-- znak výrobce a modré piktogramy na černém panelu -->
    <circle cx="180" cy="218" r="6" fill="none" stroke="#8e959c" stroke-width="2"/>
    <g fill="#2f6fc4"><circle cx="110" cy="214" r="6"/><circle cx="124" cy="214" r="6"/></g>
    <!-- stříbrný oblouk od rohů do středu a pod ním červený klín -->
    <path d="M57 222 Q120 236 180 252 Q240 236 303 222 V232 Q240 248 180 264 Q120 248 57 232 Z" fill="#c3c7cb"/>
    <path d="M98 244 Q140 256 180 268 Q220 256 262 244 L256 280 H104 Z" fill="#d0202e"/>
    <!-- rohová světla v černých pouzdrech s řadou LED teček -->
    <g fill="#e9eef2"><circle cx="70" cy="248" r="6"/><circle cx="88" cy="254" r="5"/><circle cx="290" cy="248" r="6"/><circle cx="272" cy="254" r="5"/></g>
    <g fill="#f2f4f6"><circle cx="64" cy="240" r="1.6"/><circle cx="72" cy="241" r="1.6"/><circle cx="80" cy="243" r="1.6"/><circle cx="88" cy="245" r="1.6"/><circle cx="96" cy="247" r="1.6"/>
      <circle cx="296" cy="240" r="1.6"/><circle cx="288" cy="241" r="1.6"/><circle cx="280" cy="243" r="1.6"/><circle cx="272" cy="245" r="1.6"/><circle cx="264" cy="247" r="1.6"/></g>
    <circle cx="78" cy="266" r="4" fill="#f2a33a"/><circle cx="282" cy="266" r="4" fill="#f2a33a"/>
    <!-- nárazník a registrační značka -->
    <rect x="54" y="280" width="252" height="18" rx="4" fill="#151618"/>
    <rect x="152" y="283" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="283" width="6" height="12" fill="#2a63b8"/>
    <!-- kola -->
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
  </g>
</svg>
