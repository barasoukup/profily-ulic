<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Budějovický autobus DPMČB, Solaris Urbino 12 IV. generace CNG, zadní pohled. Barvy podle fotky vozu DPMČB,
       tvar zádě (velké tmavé sklo nahoře, pod ním plocha v barvě vozu, řada světel nad nárazníkem) podle fotky
       Urbina IV ve Varšavě, obojí Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Solaris_Urbino_12_IV_CNG,_linka_1,_DP_%C4%8Cesk%C3%A9_Bud%C4%9Bjovice.jpg
       https://commons.wikimedia.org/wiki/File:Bus_in_Warsaw,_Solaris_Urbino_12_electric_n%C2%B01916_-_back.jpg
       Červená záď s krytem CNG na střeše, horní polovina černé sklo s číslem linky, červený panel motoru, svislé
       svítilny v rozích, dole řada kulatých světel a registrační značka. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zrcátka vpředu vyčnívají za boky -->
  <rect x="26" y="50" width="16" height="44" rx="5" fill="#1d1f22"/>
  <rect x="318" y="50" width="16" height="44" rx="5" fill="#1d1f22"/>
  <!-- červený kryt nádrží CNG -->
  <path d="M80 24 Q82 8 102 8 H258 Q278 8 280 24 Z" fill="#c21d2a"/>
  <!-- červená záď -->
  <path d="M52 296 V40 Q52 20 74 20 H286 Q308 20 308 40 V296 Z" fill="#d0202e"/>
  <path d="M298 22 Q308 26 308 42 V296 H298 Z" fill="#b01a26"/>
  <!-- černé zadní sklo s číslem linky, dole zahnuté -->
  <path d="M62 34 Q62 28 70 28 H290 Q298 28 298 34 V138 Q180 146 62 138 Z" fill="#17191c"/>
  <path d="M78 34 L106 34 L94 134 L80 134 Z" fill="#3a4654" opacity=".55"/>
  <text x="264" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e6edf5">1</text>
  <!-- červený panel motoru s mřížkou -->
  <g fill="#a8141f"><rect x="110" y="168" width="140" height="5" rx="2"/><rect x="110" y="180" width="140" height="5" rx="2"/><rect x="110" y="192" width="140" height="5" rx="2"/></g>
  <!-- svislé svítilny v rozích -->
  <rect x="58" y="150" width="14" height="80" rx="6" fill="#8f1218"/><rect x="60" y="196" width="10" height="10" rx="3" fill="#f2a33a"/><rect x="60" y="210" width="10" height="10" rx="3" fill="#eef1f3"/>
  <rect x="288" y="150" width="14" height="80" rx="6" fill="#8f1218"/><rect x="290" y="196" width="10" height="10" rx="3" fill="#f2a33a"/><rect x="290" y="210" width="10" height="10" rx="3" fill="#eef1f3"/>
  <!-- řada kulatých světel v černém pásku nad nárazníkem a registrační značka -->
  <rect x="62" y="240" width="56" height="14" rx="7" fill="#1d1f22"/><rect x="242" y="240" width="56" height="14" rx="7" fill="#1d1f22"/>
  <g fill="#e9eef2"><circle cx="72" cy="247" r="4"/><circle cx="84" cy="247" r="4"/><circle cx="288" cy="247" r="4"/><circle cx="276" cy="247" r="4"/></g>
  <g fill="#c8102e"><circle cx="96" cy="247" r="4"/><circle cx="108" cy="247" r="4"/><circle cx="264" cy="247" r="4"/><circle cx="252" cy="247" r="4"/></g>
  <rect x="152" y="252" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="252" width="6" height="12" fill="#2a63b8"/>
  <!-- tmavý spodek -->
  <path d="M52 278 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#1d1f22"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
