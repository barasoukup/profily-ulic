<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Budějovický autobus DPMČB, Solaris Urbino 12 IV. generace CNG, zadní pohled. Barvy podle fotky vozu DPMČB,
       tvar zádě (velké tmavé sklo nahoře, pod ním plocha v barvě vozu, řada světel nad nárazníkem) podle fotky
       Urbina IV ve Varšavě, obojí Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Solaris_Urbino_12_IV_CNG,_linka_1,_DP_%C4%8Cesk%C3%A9_Bud%C4%9Bjovice.jpg
       https://commons.wikimedia.org/wiki/File:Bus_in_Warsaw,_Solaris_Urbino_12_electric_n%C2%B01916_-_back.jpg
       Červená záď s krytem CNG na střeše, pod silným střešním pásem velké černé sklo s širokým LED panelem nahoře uprostřed a malými vodorovnými
       červenými obrysovými svítilnami v horních rozích, pod ním za tmavou spárou hladké víko motoru s rovnou horní hranou a zaoblenými rohy, těsně nad
       nárazníkem v rozích řada kulatých světel (koncová, brzdová, blinkr, couvací), registrační značka v nárazníku. Verze CNG se od
       elektrické z Varšavy může lišit. 1 px = 1 cm, šířka 2,55 m. -->
  <!-- zrcátka vpředu vyčnívají za boky -->
  <rect x="26" y="50" width="16" height="44" rx="5" fill="#1d1f22"/>
  <rect x="318" y="50" width="16" height="44" rx="5" fill="#1d1f22"/>
  <!-- červený kryt nádrží CNG -->
  <path d="M80 24 Q82 8 102 8 H258 Q278 8 280 24 Z" fill="#c21d2a"/>
  <!-- červená záď -->
  <path d="M52 296 V40 Q52 20 74 20 H286 Q308 20 308 40 V296 Z" fill="#d6141f"/>
  <path d="M298 22 Q308 26 308 42 V296 H298 Z" fill="#b0111c"/>
  <!-- černé zadní sklo s číslem linky, dole rovně, u krajů sjíždí níž kolem zaoblených rohů víka motoru -->
  <path d="M62 50 Q62 44 70 44 H290 Q298 44 298 50 V185 Q298 165 280 165 H80 Q62 165 62 185 Z" fill="#17191c"/>
  <path d="M80 166 H280" stroke="#3a0a0f" stroke-width="2"/>
  <path d="M78 80 L104 80 L94 160 L80 160 Z" fill="#3a4654" opacity=".55"/>
  <rect x="118" y="52" width="124" height="22" rx="2" fill="#101214"/>
  <text x="124" y="70" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf5">1</text>
  <g fill="#e6edf5" opacity=".75"><rect x="144" y="57" width="88" height="4" rx="2"/><rect x="144" y="65" width="62" height="4" rx="2"/></g>
  <!-- malé červené obrysové svítilny v horních rozích skla -->
  <rect x="68" y="48" width="12" height="4" rx="1.5" fill="#c8102e"/><rect x="280" y="48" width="12" height="4" rx="1.5" fill="#c8102e"/>
  <!-- řada kulatých světel v černém pásku nad nárazníkem (všechny funkce) a registrační značka -->
  <path d="M52 248 H308" stroke="#8e1019" stroke-width="1.5"/>
  <rect x="62" y="249" width="56" height="14" rx="7" fill="#1d1f22"/><rect x="242" y="249" width="56" height="14" rx="7" fill="#1d1f22"/>
  <g fill="#c8102e"><circle cx="72" cy="256" r="4"/><circle cx="84" cy="256" r="4"/><circle cx="288" cy="256" r="4"/><circle cx="276" cy="256" r="4"/></g>
  <g fill="#f2a33a"><circle cx="96" cy="256" r="4"/><circle cx="264" cy="256" r="4"/></g>
  <g fill="#e9eef2"><circle cx="108" cy="256" r="4"/><circle cx="252" cy="256" r="4"/></g>
  <rect x="152" y="266" width="56" height="13" rx="1" fill="#f4f4f2"/><rect x="152" y="266" width="6" height="13" fill="#2a63b8"/>
  <!-- červený nárazník až dolů, jen tenká tmavá spodní hrana -->
  <path d="M52 294 H308 Q308 298 304 298 H56 Q52 298 52 294 Z" fill="#1d1f22"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
