<!-- Trolejbus Solaris Trollino 18 MetroStyle (vozy 321–371; Hess lighTram19 má stejné barvy), Salzburg AG (Obus Salzburg), čelní pohled. Červená skříň, černá maska čela od střechy až nad červený nárazník (v ní v dolních rozích svislý sloupec dvou bílých kulatých světel a pod nimi oranžový blinkr; malá bílá mlhovka v červeném nárazníku u rohů), bílý pruh jen po bocích v úrovni parapetu (od čela vidět jen kousek na rozích), široký světle šedý pás střechy nad čelním sklem, vysoké čelní sklo s cílovou tabulí za sklem nahoře, dole bílé číslo vozu vlevo a velké tučné logo „Obus SLB“ (asi třetina šířky čela) mírně vlevo od středu, SPZ vlevo od středu, černý kryt výzbroje na střeše a nad ním za sběrači stříbrný rám na sloupcích (jako na zádi), z něj vycházejí sběrače, zrcátka „beraní rohy“: červené zahnuté rameno a černá hlava zrcátka, číslo linky v modrém poli vlevo, cílová tabule jantarová, dvě tyče sběračů. Vycházeno z popisů a fotek na Wikimedia Commons (ne obkresleno): Wikipedia „Trolleybuses in Salzburg“ (od vozu 321 nátěr červená a černá s bílým pruhem místo červené s krémovou/bílou), „Oberleitungsbus Salzburg“ (flotila: Solaris Trollino 18 MetroStyle 321–371, Hess lighTram19), fotky „Salzburg Solaris MetroStyle trolleybus 323 at Hauptbahnhof, January 2014.jpg“, „Salzburg, Solaris Trollino III 18 AC MetroStyle č. 364.jpg“, „Trolleybus 352 at Messezentrum, Salzburg.jpg“, „12-11-02-bus-am-bahnhof-salzburg-by-RalfR-27.jpg“ (rám na střeše); rakouská SPZ podle vyhlášky KDV (S = Salcburk). 1 px = 1 cm. -->
