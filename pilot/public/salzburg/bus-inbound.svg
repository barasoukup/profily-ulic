<!-- Městský autobus Albus Salzburg (elektrobus Yutong U10, nátěr Salzburg Verkehr), čelní pohled. Bílá skříň, velké černé čelní sklo, pod ním výrazný černý pás dole vypouklý se stříbrným nápisem YUTONG, světlomety ve vysokých černých pouzdrech se dvěma kulatými světly nad sebou, zasahující do červeného pásu (lemované světle šedou), tři modré kulaté piktogramy (vozíček, kočárek, další) vlevo od loga albus (černé „albus“ se zeleným a modrým švihem, pod ním malé „salzburg“), malé bílé číslo vozu vpravo dole ve skle, SPZ celá ve spodním červeném pásu s tenkou bílou linkou, jen tenký tmavý okraj nárazníku, bílá LED cílová tabule, na střeše kryt baterií. Vycházeno z fotek a popisů na Wikimedia Commons (ne obkresleno): „Yutong U10 L9101 Albus Salzburg.jpg“ (linie 17, Siebenstädterstraße, 2026), „Yutong U10 L9109 Albus Salzburg.jpg“; Wikipedia „Albus Salzburg“; rakouská SPZ podle vyhlášky KDV (S = Salzburg). 1 px = 1 cm. -->
