<!-- Městský autobus Albus Salzburg (elektrobus Yutong U10, nátěr Salzburg Verkehr), zadní pohled. Bílá skříň, zadní rohy čistě bílé (barevné pruhy vedou jen po bocích a zezadu nejsou vidět), velké černé zadní sklo od střechy skoro k nárazníku s LED číslem linky nahoře uvnitř skla, pod sklem tmavomodrý pás uprostřed prohnutý dolů se stříbrným nápisem YUTONG, pod ním bílá mezera a pak úzké zadní svítilny na krajích (tmavé pouzdro, červené sklo) až k červenému pásu, velký kulatý odznak „100 % elektrisch“ vlevo od středu (limetkový list v zeleném kruhu, nahoře červený a dole modrý oblouk textu), logo Salzburg Verkehr vpravo od středu, malé číslo vozu vpravo nahoře pod sklem a „U10“ vpravo dole, SPZ na hranici bílé a červené, spodní červený pás s tenkou bílou linkou, bez mřížky motoru. Vycházeno z fotek a popisů na Wikimedia Commons (ne obkresleno): „Yutong U10 L9109 Albus Salzburg.jpg“ (zadní pohled), „Yutong U10 L9101 Albus Salzburg.jpg“ (linie 17, Siebenstädterstraße, 2026); Wikipedia „Albus Salzburg“; rakouská SPZ podle vyhlášky KDV (S = Salzburg). 1 px = 1 cm. -->
