<!-- Trolejbus Solaris Trollino 18 MetroStyle (vozy 321–371; Hess lighTram19 má stejné barvy), Salzburg AG (Obus Salzburg), zadní pohled. Červená skříň, záď černá od střechy až nad červený nárazník (jen krajní sloupky červené), nahoře široká cílová tabule (vlevo zvlášť modré pole s číslem linky, vpravo jantarový cíl) a vysoko v rozích červená světla, menší zadní okno, dole v černé menší sotva znatelný tmavý panel s bílým logem SLB Salzburger Lokalbahnen a pod ním uprostřed číslo vozu, svislá světla v rozích na černé, bílý pruh po bocích zabíhá kouskem na krajní sloupky zádi asi ve dvou třetinách výšky, černý kryt výzbroje, nad ním vysoký stříbrný rám na svislých sloupcích s bílou cedulkou s logem dopravce uprostřed, z něj vycházejí sběrače, dvě tyče sběračů, zrcátka od zadu skoro nevidět. Vycházeno z popisů a fotek na Wikimedia Commons (ne obkresleno): Wikipedia „Trolleybuses in Salzburg“ (od vozu 321 nátěr červená a černá s bílým pruhem místo červené s krémovou/bílou), „Oberleitungsbus Salzburg“ (flotila: Solaris Trollino 18 MetroStyle 321–371, Hess lighTram19), fotky „Salzburg Solaris MetroStyle trolleybus 323 at Hauptbahnhof, January 2014.jpg“, „Salzburg, Solaris Trollino III 18 AC MetroStyle č. 364.jpg“, „Trolleybus 352 at Messezentrum, Salzburg.jpg“, „12-11-02-bus-am-bahnhof-salzburg-by-RalfR-27.jpg“ a „…-28.jpg“ (záď vozu 323); rakouská SPZ podle vyhlášky KDV (S = Salcburk). 1 px = 1 cm. -->
