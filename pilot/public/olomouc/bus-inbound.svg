<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Olomoucký autobus DPMO, Solaris Urbino 12 IV. generace (Solaris je hlavní typ autobusů DPMO), čelní pohled
       v nátěru DPMO. 1 px = 1 cm, šířka 2,55 m. Podle fotek z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Olomouc,_Solaris_Urbino_IV_12_č._665.jpg (čelo zblízka: logo ⇄dpmo, vozíček, světla)
       https://commons.wikimedia.org/wiki/File:SNU12_DPMO_646.jpg
       https://commons.wikimedia.org/wiki/File:Olomouc,_Hlavní_nádraží,_autobus_621.jpg (nátěr boků, Urbino III)
       Souměrné černé čelo až k obrysu vozu (černé A-sloupky obtékají sklo) se sklem až pod střechu a zelenou
       LED tabulí, spodní hrana skla mírný oblouk, pod sklem bílý panel (znak Solarisu, červený nápis dpmo,
       vozíček a číslo vozu), světla v tmavě modrém pouzdře, které navazuje na modré rohy nárazníku a k okraji
       se zvedá jako obočí, uprostřed červený nárazník s registrační značkou. -->
  <!-- zpětná zrcátka na ramenech („králičí uši“) -->
  <path d="M62 28 Q38 24 32 46" stroke="#1d1f22" stroke-width="5" fill="none"/>
  <rect x="20" y="44" width="18" height="52" rx="6" fill="#1d1f22"/>
  <path d="M298 28 Q322 24 328 46" stroke="#1d1f22" stroke-width="5" fill="none"/>
  <rect x="322" y="44" width="18" height="52" rx="6" fill="#1d1f22"/>
  <!-- bílá skříň, tmavě modrý spodek boků -->
  <path d="M52 296 V40 Q52 20 74 20 H286 Q308 20 308 40 V296 Z" fill="#f4f4f2"/>
  <path d="M298 22 Q308 28 308 42 V296 H298 Z" fill="#dededb"/>
    <!-- černé čelo se sklem a LED tabulí -->
  <path d="M52 196 V40 Q52 26 66 26 H294 Q308 26 308 40 V196 Q180 222 52 196 Z" fill="#17191c"/>
  <rect x="68" y="32" width="224" height="26" rx="2" fill="#0b0c0d"/>
  <g font-family="Arial, sans-serif" font-weight="bold" fill="#43d94c">
    <text x="80" y="51" font-size="17">15</text>
    <text x="200" y="51" font-size="14" text-anchor="middle" letter-spacing="1">BUKOVANY</text>
  </g>
  <path d="M64 64 H296 V186 Q180 210 64 186 Z" fill="#2c3944"/>
  <path d="M80 68 L120 68 L96 191 L76 189 Z" fill="#46596a" opacity=".5"/>
  <path d="M246 68 L268 68 L258 116 L238 116 Z" fill="#46596a" opacity=".4"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M100 194 L170 180"/></g>
  <!-- bílý panel pod sklem: znak výrobce, logo DPMO, číslo vozu -->
  <ellipse cx="180" cy="224" rx="15" ry="7.5" fill="#6e7276"/>
  <path d="M188 220.5 Q180 217 172 221 Q170 224 180 224 Q190 224 188 227.5 Q180 231 172 227.5" stroke="#f4f4f2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <g stroke="#d8262f" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M148 238 H156 M154 236 L156 238 L154 240"/><path d="M156 243.5 H148 M150 241.5 L148 243.5 L150 245.5"/>
  </g>
  <text x="184" y="246" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="bold" fill="#d8262f" text-anchor="middle" textLength="50" lengthAdjust="spacingAndGlyphs">dpmo</text>
  <rect x="64" y="229" width="14" height="14" rx="1" fill="#1f5fb4"/>
  <circle cx="70.5" cy="232.3" r="1.2" fill="#fff"/><path d="M70.5 234.3 V238 H74.5 L76 240.8 M73.5 239.6 A3.3 3.3 0 1 1 68.4 236.8" stroke="#fff" stroke-width="1.2" fill="none"/>
  <text x="82" y="242" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3a3c3e">665</text>
  <!-- světla v tmavě modrém pouzdře, které navazuje na rohy nárazníku a zvedá se k okraji jako obočí -->
  <path d="M52 247 Q86 250 110 264 L124 296 H60 Q52 296 52 288 Z" fill="#26227a"/>
  <path d="M308 247 Q274 250 250 264 L236 296 H300 Q308 296 308 288 Z" fill="#26227a"/>
  <circle cx="70" cy="264" r="5.5" fill="#f6f7f8" stroke="#141518" stroke-width="2"/><circle cx="88" cy="268" r="5.5" fill="#f6f7f8" stroke="#141518" stroke-width="2"/>
    <circle cx="290" cy="264" r="5.5" fill="#f6f7f8" stroke="#141518" stroke-width="2"/><circle cx="272" cy="268" r="5.5" fill="#f6f7f8" stroke="#141518" stroke-width="2"/>
  <!-- nárazník: tmavě modré rohy, červený střed s registrační značkou -->
  <path d="M110 266 H250 L244 298 H116 Z" fill="#d8262f"/>
  <rect x="152" y="276" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="276" width="6" height="12" fill="#2a63b8"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
