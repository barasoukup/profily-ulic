<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Olomoucký autobus DPMO, Solaris Urbino 12 IV. generace (Solaris je hlavní typ autobusů DPMO), čelní pohled
       v nátěru DPMO. 1 px = 1 cm, šířka 2,55 m. Podle fotek z Wikimedia Commons:
       https://commons.wikimedia.org/wiki/File:Olomouc,_Solaris_Urbino_IV_12_č._665.jpg
       https://commons.wikimedia.org/wiki/File:SNU12_DPMO_646.jpg
       https://commons.wikimedia.org/wiki/File:Olomouc,_Solaris_Urbino_III_12_č._626.jpg (nátěr boků)
       Černé čelo se sklem až pod střechu a zelenou LED tabulí, pod sklem bílý panel se šikmou horní hranou
       (logo DPMO a znak výrobce zjednodušené), světla v černých výřezech v rozích, tmavě modré rohy nárazníku,
       uprostřed červený nárazník s registrační značkou. -->
  <!-- zpětná zrcátka na ramenech („králičí uši“) -->
  <path d="M62 28 Q38 24 32 46" stroke="#1d1f22" stroke-width="5" fill="none"/>
  <rect x="20" y="44" width="18" height="52" rx="6" fill="#1d1f22"/>
  <path d="M298 28 Q322 24 328 46" stroke="#1d1f22" stroke-width="5" fill="none"/>
  <rect x="322" y="44" width="18" height="52" rx="6" fill="#1d1f22"/>
  <!-- bílá skříň, tmavě modrý spodek boků -->
  <path d="M52 296 V40 Q52 20 74 20 H286 Q308 20 308 40 V296 Z" fill="#f4f4f2"/>
  <path d="M298 22 Q308 28 308 42 V296 H298 Z" fill="#dededb"/>
  <path d="M52 250 H58 V296 H52 Z M302 250 H308 V296 H302 Z" fill="#283a8e"/>
  <!-- černé čelo se sklem a LED tabulí -->
  <path d="M58 214 V34 Q58 26 66 26 H294 Q302 26 302 34 V192 Q240 200 180 206 Q120 210 58 214 Z" fill="#17191c"/>
  <rect x="68" y="32" width="224" height="26" rx="2" fill="#0b0c0d"/>
  <g font-family="Arial, sans-serif" font-weight="bold" fill="#43d94c">
    <text x="80" y="51" font-size="17">15</text>
    <text x="200" y="51" font-size="14" text-anchor="middle" letter-spacing="1">BUKOVANY</text>
  </g>
  <path d="M64 64 H296 V186 Q180 202 64 206 Z" fill="#2c3944"/>
  <path d="M80 68 L120 68 L92 202 L76 202 Z" fill="#46596a" opacity=".5"/>
  <path d="M246 68 L268 68 L258 116 L238 116 Z" fill="#46596a" opacity=".4"/>
  <g stroke="#0e0f10" stroke-width="2.5" stroke-linecap="round"><path d="M96 204 L168 188"/></g>
  <!-- bílý panel pod sklem: znak výrobce, logo DPMO, číslo vozu -->
  <ellipse cx="180" cy="224" rx="15" ry="7" fill="none" stroke="#8c9094" stroke-width="2.5"/>
  <rect x="150" y="236" width="60" height="9" rx="2" fill="#d8262f"/>
  <text x="84" y="242" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3a3c3e">665</text>
  <!-- světla v černých výřezech v rozích -->
  <path d="M52 244 H96 Q104 244 106 252 L110 266 H52 Z" fill="#17191c"/>
  <circle cx="70" cy="255" r="5.5" fill="#f6f7f8" stroke="#9fa3a6"/><circle cx="88" cy="256" r="5.5" fill="#f6f7f8" stroke="#9fa3a6"/>
  <path d="M308 244 H264 Q256 244 254 252 L250 266 H308 Z" fill="#17191c"/>
  <circle cx="290" cy="255" r="5.5" fill="#f6f7f8" stroke="#9fa3a6"/><circle cx="272" cy="256" r="5.5" fill="#f6f7f8" stroke="#9fa3a6"/>
  <!-- nárazník: tmavě modré rohy, červený střed s registrační značkou -->
  <path d="M52 266 H118 L124 296 H60 Q52 296 52 288 Z" fill="#283a8e"/>
  <path d="M308 266 H242 L236 296 H300 Q308 296 308 288 Z" fill="#283a8e"/>
  <path d="M110 266 H250 L244 298 H116 Z" fill="#d8262f"/>
  <rect x="152" y="276" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="276" width="6" height="12" fill="#2a63b8"/>
  <!-- kola -->
  <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
</svg>
