<!-- Trolejbus Van Hool Exqui.City 24T (dvoukloubový, 24 m, výzbroj Vossloh Kiepe), Linz AG Linien, čelní pohled. Čelo celé černé od střechy po nárazník; čelní sklo sahá skoro ke střeše a nahoře za ním je LED cílová tabule; po obou vnějších okrajích čela tenká oranžová linka, která se pod čelním sklem zalomí dovnitř těsně za řady světlometů a stáčí do širokého oblouku (U), jehož vodorovná část vede skoro od jedné řady světel ke druhé; nad ní velké logo asi 1 m široké („LINZ AG“ stříbrně nad „LINIEN“ oranžově); vně linky v tmavém rohu svislá řada kulatých LED světlometů (3 bílé a malý oranžový blinkr), dolní rohy čela černé, stříbrošedý je jen úzký proužek v krajním dolním rohu (patří k boční sukni); střecha a kryt výzbroje stříbrošedé. Dva stěrače zaparkované u středu dolního okraje skla, dlouhá zrcátka na ramenech z horní části sloupků. Vycházeno z fotek na Wikimedia Commons (Category:Van Hool ExquiCity 24 Trolley of Linz Linien; popsané, ne obkreslené): „Linz-228.jpg“, „Trolleybus 45, Linz (P1130874).jpg“, „Linz, Van Hool Exqui.City 24 č. 224.jpg“; en.wikipedia „Trolleybuses in Linz“ a de.wikipedia „Oberleitungsbus Linz“ (jediný typ v provozu: Van Hool Exqui.City 24T, vozy 221–240, 2017–2019, „XXL-Obus“). Rakouská SPZ (L = Linz) s modrým pruhem EU, vlevo od ní dva modré piktogramy (kočárek, vozík); žlutý terčík R mají jen některé vozy (228 ano, 224 a 235 ne). 1 px = 1 cm. -->
