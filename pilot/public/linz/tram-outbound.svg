<!-- Tramvaj Bombardier Flexity Outlook „Cityrunner“ (jednosměrná, 100 % nízkopodlažní, rozchod 900 mm, šířka 2,30 m, Linz AG Linien), zadní pohled – jednosměrná, záď nemá stanoviště ani zrcátka: tmavé zadní okno, nahoře číslo linky zeleným LED, pod oknem tmavý panel s červenými koncovými světly. Nátěr stejný jako čelo: bílá skříň, jeden oranžový pás ve výšce nárazníku, bílá spodní zástěra. Bez modré a červené linky.
