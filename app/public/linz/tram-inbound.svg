<!-- Tramvaj Bombardier Flexity Outlook „Cityrunner“ (jednosměrná, 100 % nízkopodlažní, rozchod 900 mm, šířka 2,30 m, Linz AG Linien), čelní pohled. Nátěr: bílá skříň s bílou zaoblenou střešní hranou, tmavé čelní sklo až skoro ke střeše, pod ním černý panel s kulatými světlomety a šedým logem LINZ AG LINIEN, jeden oranžový pás ve výšce nárazníku (pokračuje po bocích pod tmavým pásem oken), bílá spodní zástěra; cíl zeleným LED, číslo vozu červeně v levém dolním rohu skla. Bez modré a červené linky.
       Podklad: fotky z Wikimedia Commons (Category:Bombardier Flexity Outlook Cityrunner (Linz)) „Linz AG Linien Cityrunner 022 an der Linken Brückenstraße.jpg“, „Linz tramwaj 024.jpg“, „Cityrunner 012 am 26.2.2018 in St.Magdalena.jpg“, „Bombardier Flexity Outlook Cityrunner in Linz.jpg“ (popsané, ne obkreslené); de.wikipedia „Straßenbahn Linz“. 1 px = 1 cm. -->
