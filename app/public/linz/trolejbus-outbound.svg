<!-- Trolejbus Van Hool Exqui.City 24T (dvoukloubový, 24 m, výzbroj Vossloh Kiepe), Linz AG Linien, zadní pohled. Záď nemá zadní okno: horní dvě třetiny jsou zavřený panel ve stříbrošedé barvě skříně se zaoblenými horními rohy a jen tenkým tmavým okrajem nahoře, uprostřed vysoko malé okénko s číslem linky (dvě číslice); oranžová linka vede po obou vnějších okrajích dolů a pak rovně přes celou šířku tam, kde panel končí; pod ní je záď černá: malé logo Van Hool, tmavé zapuštěné pole se SPZ, pod ním oranžový LED pás s výstrahou „Bus schert aus“ a šipkami, pak nárazník s červenými odrazkami; zadní světla jsou v každém dolním rohu svislá řada kulatých červených LED s oranžovým blinkrem dole, jako světlomety na čele; stříbrošedý je jen úzký proužek v krajních dolních rozích; střecha a kryt výzbroje se sběrači stříbrošedé; zpoza boků vykukují hlavy zrcátek ve stejné výšce a šířce jako na čele. Vycházeno z fotek na Wikimedia Commons (popsané, ne obkreslené): záď „Photowalk, Linz (P1130852).jpg“ (vůz 240, s celopolepem; bez reklamy je panel v barvě skříně), čelo a boky „Linz-228.jpg“, „Trolleybus 45, Linz (P1130874).jpg“; en.wikipedia „Trolleybuses in Linz“ a de.wikipedia „Oberleitungsbus Linz“ (jediný typ v provozu: Van Hool Exqui.City 24T, vozy 221–240, 2017–2019, „XXL-Obus“). Rakouská SPZ (L = Linz) s modrým pruhem EU. 1 px = 1 cm. -->
