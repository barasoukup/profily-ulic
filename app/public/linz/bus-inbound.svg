<!-- Autobus MAN Lion's City (nová generace, hybrid), Linz AG Linien, čelní pohled. Současný nátěr: černé čelo a černý pás oken, po stranách čela oranžové lemy, nahoře úzké, dole širší, které se stáčejí do stříbrných krytů světlometů v dolních rozích (uvnitř tmavé čočky s tenkou bílou LED linkou nahoře, pod nimi malé čiré kulaté světlo, spodní vnitřní hrana krytu šikmo k nárazníku) (přes čelo pod sklem oranžová nevede) a po boku pokračují oranžovou linkou pod střešní hranou; pod logem široká chromová lišta mezi kryty světlometů s mírným zalomením a lvem MAN uprostřed, níž nápis MAN, vlevo u světlometu tři modré kruhové piktogramy (chodec, vozík, kočárek), nárazník tmavý s úzkými stříbrnými rohy, logo LINZ AG (bíle) a LINIEN (oranžově) pod čelním sklem, oranžové číslo vozu na černém čele v řadě loga, cíl bílým LED, na střeše kryt hybridní výbavy. Vycházeno z fotek na Wikimedia Commons (ne obkresleno): „Linz AG Wagen 171 in der Kärntner Straße.jpg“ (2025, linka 12), „Linz AG Linien Wagen 169 an der Linken Brückenstraße.jpg“ (2024); článek electrive.net 4. 6. 2026 (MAN Lion's City 12 E na lince 26). Rakouská SPZ (L = Linz). 1 px = 1 cm. -->
