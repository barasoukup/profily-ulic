    <!-- v bílém poli značky: vlevo dole zelené kulaté logo IDS BK, vpravo dole číslo zóny -->
    <circle cx="232.6" cy="68.9" r="1.5" fill="#3f9a3a"/><circle cx="232.6" cy="68.9" r="0.6" fill="#f4f4f0"/>
    <rect x="254.6" y="68" width="4.4" height="2.4" fill="none" stroke="#1a1a1a" stroke-width="0.4"/><rect x="255.8" y="68.8" width="2" height="0.8" fill="#1a1a1a"/>
    <!-- tabulky linek (užší než tabule, kolem mřížka): denní bílé s tmavomodrými čísly, noční tmavomodrá s bílými, vedle úzká bílá tabulka s piktogramy nad sebou -->
    <rect x="224" y="82" width="17" height="11" fill="#f4f4f0"/><path d="M0 0H3V3H0V6H3" transform="translate(227 84.5)" fill="none" stroke="#1f3f8f" stroke-width="0.9" stroke-linejoin="miter"/><path d="M0 0H3V6H0Z" transform="translate(231 84.5)" fill="none" stroke="#1f3f8f" stroke-width="0.9" stroke-linejoin="miter"/><path d="M0 0H3V6H0M0.6 3H3" transform="translate(235 84.5)" fill="none" stroke="#1f3f8f" stroke-width="0.9" stroke-linejoin="miter"/>
    <rect x="244" y="82" width="17" height="11" fill="#f4f4f0"/><path d="M0 0H3V3H0V6H3" transform="translate(247 84.5)" fill="none" stroke="#1f3f8f" stroke-width="0.9" stroke-linejoin="miter"/><path d="M0 0H3V6H0Z" transform="translate(251 84.5)" fill="none" stroke="#1f3f8f" stroke-width="0.9" stroke-linejoin="miter"/><path d="M0 0H3L1 6" transform="translate(255 84.5)" fill="none" stroke="#1f3f8f" stroke-width="0.9" stroke-linejoin="miter"/>
