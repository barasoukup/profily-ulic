<svg viewBox="0 0 50 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Bratislavský označník zastávky DPB (IDS BK): značka 331 Zastávka podle vyhl. 30/2020 Z. z., symbol autobusu jako v sadě slovensko (příloha Symboly, značka 224); trolejbusové zastávky (na fotce Hrad je trolejbus s tyčemi) mají v aplikaci tentýž označník se symbolem autobusu, aplikace trolejbusový označník nerozlišuje, modrá a bílá jako sada znacky-SK. Stín na straně vlevo (pro pravou stranu ulice); zrcadlí se jen stín, obsah tabule (značka, čísla linek) se nezrcadlí, skutečná tabule je z obou stran stejná. 1 px = 1 cm, výška 3,35 m, spodní hrana = chodník, střed obrázku = osa označníku. -->
  <!-- Fotky, ze kterých kresba vychází (popsáno, ne obkresleno): Commons „Trolleybus stop in Bratislava (43136731251).jpg“ (zastávka Hrad, Mudroňova, Janusz Jakubowski, CC BY 2.0, 2018): dvojitý červený trubkový sloupek zapuštěný rovnou do dlažby, tabule v červeném rámu s jemnou červeno-bílou mřížkou po celé ploše, nahoře smetanová tabulka s názvem téměř černým písmem, pod ní značka 331, v levém dolním rohu bílého pole značky malé zelené kulaté logo IDS BK, vpravo dole číslo zóny, tabulky linek (denní bílé s tmavými čísly 203, 207, noční tmavomodrá s bílým N47, vedle ní bílá tabulka s piktogramy – výstražný trojúhelník a zákaz kouření), níž skříňka s jízdním řádem v červeném rámu na úzké šedé polici a pod ní světle šedý válcový odpadkový koš (širší než skříňka) za sloupky, ke kterým ho drží šedé objímky; „Hodžovo námestie zastávka.jpg“ (Wizzard, public domain) tentýž červený typ. Novější tmavošedý označník (např. „Zastávka Riviéra 2023a.jpg“, Jetam2, CC BY-SA 4.0) nekreslen. Pruh „NA ZNAMENIE“ (zastávka na znamení) nekreslen. Podle fotky Hrad: červená vodorovná příčka spojuje trubky těsně nad košem, objímky koše ve třetině výšky a u dna, tabulky linek jsou užší a kolem nich zůstává vidět mřížka, piktogramy (žlutý trojúhelník, zákaz kouření) jsou nad sebou, rám tabule je nahoře širší. -->
  <g transform="translate(-219 -20)">
    <!-- světle šedý válcový odpadkový koš za sloupky: světlý a stinný pás pro zaoblení, nahoře obruba víka -->
    <rect x="223" y="251" width="42" height="72" rx="2" fill="#b4b8ba"/><rect x="252" y="251" width="6" height="72" fill="#c9cccd"/><rect x="253.5" y="251" width="2.5" height="72" fill="#d6d8d9"/><path d="M228 251H225A2 2 0 0 0 223 253V321A2 2 0 0 0 225 323H228Z" fill="#9da1a3"/>
    <rect x="222" y="248" width="44" height="4" rx="1" fill="#a6aaac"/><rect x="222.5" y="248.4" width="43" height="0.9" fill="#c9cccd"/><rect x="223" y="320" width="42" height="3" rx="1" fill="#a3a7a9"/>
    <!-- dvojitý červený sloupek z trubek před košem, dole úzký šedý límec u dlažby -->
    <rect x="236" y="110" width="4" height="250" fill="#d42a24"/><rect x="236" y="110" width="1.5" height="250" fill="#a81f1a"/>
    <rect x="248" y="110" width="4" height="250" fill="#d42a24"/><rect x="248" y="110" width="1.5" height="250" fill="#a81f1a"/>
    <rect x="235.5" y="357" width="5" height="3" fill="#8f9496"/><rect x="247.5" y="357" width="5" height="3" fill="#8f9496"/>
    <!-- červená vodorovná příčka mezi trubkami těsně nad košem (pod policí skříňky), dole tmavší okraj -->
    <rect x="236" y="244" width="16" height="3" fill="#d42a24"/><rect x="236" y="246.2" width="16" height="0.8" fill="#a81f1a"/>
    <!-- šedé objímky držící koš na sloupcích: ve třetině výšky koše a u dna -->
    <rect x="234.5" y="275" width="19" height="4" rx="0.8" fill="#8f9496"/><rect x="234.5" y="275" width="19" height="1" fill="#a9adaf"/>
    <rect x="234.5" y="318" width="19" height="4" rx="0.8" fill="#8f9496"/><rect x="234.5" y="318" width="19" height="1" fill="#a9adaf"/>
    <!-- skříňka s jízdním řádem v červeném rámu na úzké šedé polici -->
    <rect x="224.5" y="240" width="39" height="3" fill="#8f9496"/><rect x="224.5" y="240" width="39" height="0.8" fill="#a9adaf"/>
    <rect x="226" y="190" width="36" height="50" rx="1" fill="#d42a24"/><path d="M227.75 190H227A1 1 0 0 0 226 191V239A1 1 0 0 0 227 240H227.75Z" fill="#a81f1a"/>
    <rect x="228.5" y="192.5" width="31" height="45" fill="#f4f4f0"/>
    <rect x="231" y="195" width="12" height="38" fill="#e3e4df"/><rect x="245" y="195" width="12" height="38" fill="#e3e4df"/>
    <rect x="231" y="222" width="12" height="7" fill="#f2d64b"/><rect x="245" y="226" width="5" height="5" fill="#d42a24"/>
    <rect x="232.5" y="198" width="9" height="1.2" fill="#9a9b9c"/><rect x="232.5" y="201" width="9" height="1.2" fill="#9a9b9c"/><rect x="246.5" y="198" width="9" height="1.2" fill="#9a9b9c"/><rect x="246.5" y="201" width="9" height="1.2" fill="#9a9b9c"/>
    <!-- tabule v červeném rámu (nahoře 3 cm, jinde 2), jemná světle červená mřížka (rozteč 4 cm), u názvu a značky čistě bílá -->
    <rect x="221" y="26" width="46" height="86" fill="#d42a24"/><rect x="221" y="26" width="1.75" height="86" fill="#a81f1a"/>
    <rect x="223" y="29" width="41" height="81" fill="#f7f1ee"/>
    <g fill="#e58a85" opacity="0.6"><rect x="225" y="29" width="0.6" height="81"/><rect x="229" y="29" width="0.6" height="81"/><rect x="233" y="29" width="0.6" height="81"/><rect x="237" y="29" width="0.6" height="81"/><rect x="241" y="29" width="0.6" height="81"/><rect x="245" y="29" width="0.6" height="81"/><rect x="249" y="29" width="0.6" height="81"/><rect x="253" y="29" width="0.6" height="81"/><rect x="257" y="29" width="0.6" height="81"/><rect x="261" y="29" width="0.6" height="81"/><rect x="223" y="30" width="41" height="0.6"/><rect x="223" y="34" width="41" height="0.6"/><rect x="223" y="38" width="41" height="0.6"/><rect x="223" y="42" width="41" height="0.6"/><rect x="223" y="46" width="41" height="0.6"/><rect x="223" y="50" width="41" height="0.6"/><rect x="223" y="54" width="41" height="0.6"/><rect x="223" y="58" width="41" height="0.6"/><rect x="223" y="62" width="41" height="0.6"/><rect x="223" y="66" width="41" height="0.6"/><rect x="223" y="70" width="41" height="0.6"/><rect x="223" y="74" width="41" height="0.6"/><rect x="223" y="78" width="41" height="0.6"/><rect x="223" y="82" width="41" height="0.6"/><rect x="223" y="86" width="41" height="0.6"/><rect x="223" y="90" width="41" height="0.6"/><rect x="223" y="94" width="41" height="0.6"/><rect x="223" y="98" width="41" height="0.6"/><rect x="223" y="102" width="41" height="0.6"/><rect x="223" y="106" width="41" height="0.6"/></g>
    <rect x="225.5" y="39.5" width="37" height="36.5" fill="#fbf8f6"/>
    <!-- název zastávky: smetanová tabulka, téměř černé písmo -->
    <rect x="224" y="29" width="39" height="10" fill="#f3efe2"/><rect x="233" y="32.5" width="4" height="3.5" fill="#1a1a1a"/><rect x="238" y="32.5" width="4" height="3.5" fill="#1a1a1a"/><rect x="243" y="32.5" width="4" height="3.5" fill="#1a1a1a"/><rect x="248" y="32.5" width="4" height="3.5" fill="#1a1a1a"/><rect x="253" y="32.5" width="2.5" height="3.5" fill="#1a1a1a"/>
    <!-- značka 331 Zastávka -->
    <g transform="translate(227.5 41) scale(0.846) translate(-224 -40.5)"><rect x="224" y="40.5" width="39" height="39" rx="1" fill="#005a8c"/><rect x="228" y="44.5" width="31" height="31" fill="#f4f4f0"/>
