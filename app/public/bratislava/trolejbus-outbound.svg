<!-- Trolejbus Škoda 27Tr Solaris (skříň Solaris Urbino 18 IV. generace, kloubový, dodávky od 2023, linky 40 a 61), Dopravný podnik Bratislava (DPB), zadní pohled. Nátěr DPB: červená skříň, horní polovina zádi černá (zadní okno splývá s černou v jednu lesklou plochu bez rámu, přechod do červené uprostřed skoro rovný, v krajních rozích černá šikmo dolů a ven), nahoře uprostřed malá LED tabule s číslem linky v červeném poli, vysoko v rozích malá červená světla, na skle bílý nápis „powered by ŠKODA BlueDrive“, nízko nad pásem světel plochý vystouplý panel (asi 40 % šířky) se zkosenými rohy a oválným logem Solaris, od pásu oddělený asi 15 cm čisté červené, vlevo těsně pod černou nálepka nejvyšší rychlosti 65, nízko přes celou šířku tmavý pás se čtyřmi kulatými světly na každé straně (od kraje: čirá s červeným koncovým, oranžový blinkr, čirá s červeným brzdovým, čiré couvací), pod ním v červeném nárazníku červené pole s bílým číslem vozu místo státní SPZ (bílá SPZ s modrým pruhem na fotkách není); na střeše světle šedé kryty výzbroje s kovovým zábradlím, dvě světle stříbrnošedé tyče sběračů s tmavými hlavicemi a světlými špičkami; zezadu záda týchž zrcátek jako zepředu (vpravo na straně dveří „beraní roh“ od střechy, vlevo menší na krátkém rameni). Vycházeno z fotek na Wikimedia Commons (ne obkresleno): „Buses at Bratislava hlavná stanica (Bratislava Main Station).jpg“ (záď vozu 6718, linka 61), „Škoda 27Tr Solaris Bratislava.jpg“ (Nonscio, 2024, kategorie Škoda 27Tr Solaris in Bratislava). 1 px = 1 cm. -->
