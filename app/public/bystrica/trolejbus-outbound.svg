<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Trolejbus DPMBB Banská Bystrica, Škoda 30Tr SOR, zadní pohled (stejný vůz): bílá záď, kryt trakční výzbroje
       na střeše se základnou sběračů, malé zadní sklo, hladká záď bez dieselové mřížky, červený spodní pás
       (barvy podle Wikimedia Commons: „Banská Bystrica Trolejbus 3009.jpg“, „Železničná stanica a Škoda 31Tr.jpg“,
       „DPMBBTrolejbus3011.JPG“). 1 px = 1 cm, šířka 2,55 m, výška skříně asi 3,4 m. -->
  <g stroke="#2a2b2a" stroke-linecap="round" fill="none">
    <path d="M160 228 L148 16" stroke-width="5"/>
    <path d="M200 228 L212 16" stroke-width="5"/>
  </g>
  <path d="M140 250 L150 90 M220 250 L210 90" stroke="#2a2b2a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <rect x="140" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <rect x="204" y="8" width="16" height="10" rx="2" fill="#2a2b2a"/>
  <g transform="translate(0 240)">
    <rect x="40" y="62" width="14" height="4" fill="#1b1d20"/><rect x="26" y="58" width="16" height="42" rx="5" fill="#1b1d20"/>
    <rect x="306" y="62" width="14" height="4" fill="#1b1d20"/><rect x="318" y="58" width="16" height="42" rx="5" fill="#1b1d20"/>
    <path d="M52 298 V24 Q52 -4 82 -4 H278 Q308 -4 308 24 V298 Z" fill="#f3f4f2"/>
    <path d="M298 -2 Q308 4 308 24 V298 H298 Z" fill="#dcdedb"/>
