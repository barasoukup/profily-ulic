    <rect x="120" y="-36" width="120" height="9" rx="4" fill="#d9dcd9"/>
    <!-- zadní sklo v tmavém rámu -->
    <rect x="70" y="22" width="220" height="100" rx="4" fill="#1b1d20"/>
    <rect x="76" y="28" width="208" height="88" rx="3" fill="#2c3944"/>
    <path d="M88 32 L116 32 L102 112 L88 112 Z" fill="#46596a" opacity=".5"/>
    <rect x="250" y="34" width="26" height="8" rx="2" fill="#f2a33a"/>
    <!-- hladký servisní kryt výzbroje -->
    <rect x="110" y="140" width="140" height="64" rx="5" fill="#e6e8e5"/>
    <rect x="116" y="146" width="128" height="52" rx="3" fill="none" stroke="#c9ccc9" stroke-width="2"/>
    <!-- svítilny v rohách -->
    <rect x="56" y="140" width="14" height="76" rx="6" fill="#8f1218"/><rect x="58" y="180" width="10" height="10" rx="3" fill="#f2a33a"/><rect x="58" y="194" width="10" height="10" rx="3" fill="#eef1f3"/>
    <rect x="290" y="140" width="14" height="76" rx="6" fill="#8f1218"/><rect x="292" y="180" width="10" height="10" rx="3" fill="#f2a33a"/><rect x="292" y="194" width="10" height="10" rx="3" fill="#eef1f3"/>
    <!-- červený pás se značkou -->
    <rect x="52" y="226" width="256" height="64" fill="#d8262b"/>
    <path d="M52 290 H308 V290 Q308 298 300 298 H60 Q52 298 52 290 Z" fill="#33363b"/>
    <rect x="152" y="252" width="56" height="12" rx="1" fill="#f4f4f2"/><rect x="152" y="252" width="6" height="12" fill="#2a63b8"/>
    <rect x="70" y="296" width="36" height="22" rx="4" fill="#111"/><rect x="254" y="296" width="36" height="22" rx="4" fill="#111"/>
