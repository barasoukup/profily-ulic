<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Neutral modern low-floor tram, rear view (a one-way car: no driver's cab, no mirrors): the vehicle of every
       place without trams of its own (Bára 17. 11. 2026, no livery, no logo). Colours as the front: light grey body,
       a dark mask round a smaller rear window with the line number, red tail lights, grey skirt. 1 px = 1 cm. -->
  <!-- the pantograph of the front car is seen from behind too (the app draws its own over it) -->
  <path d="M74 52 L82 40 H238 L246 52" stroke="#2a2c2e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M142 102 L174 72" stroke="#2a2c2e" stroke-width="6" stroke-linecap="round"/>
  <path d="M174 72 L158 41" stroke="#2a2c2e" stroke-width="4" stroke-linecap="round"/>
  <rect x="128" y="100" width="56" height="8" rx="2" fill="#2a2c2e"/>
  <path d="M60 126 L74 104 Q76 98 84 98 H236 Q244 98 246 104 L260 126 Z" fill="#b9bcbf"/>
  <path d="M84 98 H88 L74 126 H60 L74 104 Q76 98 84 98 Z" fill="#a3a7aa"/>
  <path d="M35 404 V164 Q35 124 72 124 H248 Q285 124 285 164 V404 Z" fill="#ecedeb" stroke="#c6c9cb" stroke-width="2"/>
  <path d="M35 352 Q160 366 285 352 V404 H35 Z" fill="#8a8f95"/>
  <!-- dark mask in a U as on the front, one undivided rear window, line number on top -->
  <path d="M54 296 V182 Q54 140 98 138 H222 Q266 140 266 182 V296 Q226 312 190 340 Q160 352 130 340 Q94 312 54 296 Z" fill="#2b2f33"/>
  <rect x="120" y="146" width="80" height="16" rx="2" fill="#0d0f11"/><rect x="128" y="150" width="20" height="8" fill="#f4f4ee"/><rect x="154" y="150" width="38" height="8" fill="#f4f4ee" opacity=".9"/>
  <path d="M66 288 V186 Q66 170 82 170 H238 Q254 170 254 186 V288 Q160 296 66 288 Z" fill="#2c3944"/>
  <path d="M86 174 L120 174 L100 288 L80 287 Z" fill="#46596a" opacity=".5"/>
  <rect x="35" y="196" width="6" height="104" fill="#3a434b"/><rect x="279" y="196" width="6" height="104" fill="#3a434b"/>
  <!-- tail lights in dark frames, amber indicators beside -->
  <path d="M46 322 L94 326 V346 L46 342 Z" fill="#2b2f33"/>
  <path d="M50 327 L78 329 V339 L50 337 Z" fill="#e8262a"/><rect x="82" y="331" width="8" height="8" rx="2" fill="#f2a33a"/>
