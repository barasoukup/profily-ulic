<!-- Městský autobus MHD Nitra (dopravce TD Transport / Transdev od 1. 1. 2022, předtím Arriva Nitra), SOR NB 12 City (imhd.sk/nr: vozy 201–216, 2021/2022), zadní pohled. Tvar zádi podle SOR NB 12 obecně: motorová věž vzadu vlevo (zezadu vlevo) s větracími žaluziemi, vpravo od ní zadní okno, nad ním LED panel s číslem linky (jantarová neověřená), víko motoru o odstín tmavší s obrysem a malým odznakem SOR. Celá skříň světle modrá („v bledomodrej farbe“ podle SITA „Nitra nemá po zmene dopravcu problémy…“ a nitra.sk „Všetko o novej MHD v Nitre“), bílá střecha stejně vysoká jako na čele, klimatizační jednotka, svislá červená zadní světla, pod nimi vlevo blinkr, vpravo bílé couvací světlo, černý nárazník se slovenskou SPZ (modrý pruh EU se SK). Přesný odstín a bílá střecha nejsou ověřené fotkou (16. 11. 2026 nedohledáno ani na imhd.sk/nr): Wikimedia Commons, Category:Buses in Nitra, má z Nitry jen starší nátěry („Irisbus Crossway LE - MHD Nitra.JPG“, „Solaris urbino nitra.jpg“). 1 px = 1 cm. -->
