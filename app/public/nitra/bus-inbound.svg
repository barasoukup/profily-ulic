<!-- Městský autobus MHD Nitra (dopravce TD Transport / Transdev od 1. 1. 2022, předtím Arriva Nitra), SOR NB 12 City (imhd.sk/nr: vozy 201–216, 2021/2022), čelní pohled. Tvar čela jako SOR NB/NS 12 v bratislava/bus-inbound.svg: černý pás skla přes celou šířku skříně, pod ním světle šedý oblouk se světlomety na koncích, motor vzadu (žádná mřížka v čele), malý odznak SOR. Celá skříň světle modrá („v bledomodrej farbe“ podle SITA „Nitra nemá po zmene dopravcu problémy…“ a nitra.sk „Všetko o novej MHD v Nitre“), bílá střecha s klimatizační jednotkou, LED cílový panel nahoře (jantarová barva neověřená), piktogram vozíčku ve skle, pod sklem bílé číslo vozu, černý nárazník se slovenskou SPZ (modrý pruh EU se SK). Logo dopravce a znak města vynechané, protože je fotka nepotvrzuje. Přesný odstín modré, bílá střecha a barva LED nejsou ověřené fotkou (16. 11. 2026 nedohledáno ani na imhd.sk/nr): Wikimedia Commons, Category:Buses in Nitra, má z Nitry jen starší nátěry („Irisbus Crossway LE - MHD Nitra.JPG“, „Solaris urbino nitra.jpg“), tvar čela podle „SOR NB12, -1025, DP Bratislava (27928997277).jpg“. 1 px = 1 cm. -->
