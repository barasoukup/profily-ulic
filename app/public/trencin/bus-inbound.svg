<!-- Městský autobus MHD Trenčín (SOR NSG 12 na CNG, faceliftované čelo SOR NS/NSG 12, dopravce TD Transport / Transdev od 1. 9. 2022, vozy 401–438), čelní pohled. Nátěr v červeno-bílých barvách města: červená střecha s krytem plynových lahví, černé čelo (sklo téměř ke střeše, červené jen tenké A-sloupky a horní rohy, vlevo od LED cílové tabule dva modré kulaté piktogramy (vozík, kočárek), tabule s krátkým žlutozeleným začátkem a oranžovým nápisem MESTO TRENČÍN, pod sklem černý panel s malým bílým logem SOR) do asi 70 % výšky; pod ním stříbrošedý oblouk („úsměv“) od světlometů v rozích dolů ke středu a o chlup teplejší červený oblouk nejširší uprostřed s bílým logem Transdev (kroužek a nápis přímo na červené) mírně vpravo od středu; světlomety ve světle šedých klínových modulech, které sledují stříbrný oblouk a zužují se ke středu, se třemi kulatými světly; nižší černý nárazník (asi pětina výšky, horní hrana uprostřed níž) se slovenskou SPZ uprostřed (bílá, modrý pruh EU se SK). Znak města na čele není. Vycházeno z fotek (popsáno, ne obkresleno): tiskové fotky SITA z představení vozů 15. 8. 2022 (cdn.sita.sk/sites/32/2022/08/6ts_ts73960… a 5ts_ts73939…, čelo vozu NR-127MA: logo Transdev na červeném oblouku, stříbrný oblouk, kulatá světla, černý nárazník); Wikimedia Commons „Zastávka Hasičská, Trenčín.jpg“ (Jetam2, CC BY-SA 4.0, 5. 10. 2025, vůz 426, barvy nátěru). 1 px = 1 cm. -->
