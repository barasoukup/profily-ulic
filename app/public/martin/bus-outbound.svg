<!-- Městský autobus MHD Martin–Vrútky, Dopravný podnik mesta Martin (DPMM), Iveco Urbanway 12M CNG, zadní pohled. Celá skříň jasně zelená, horní část zádě tmavošedá s malou LED tabulí a malým okénkem, pod ní tmavé zadní okno s číslem linky, okno dole uzavírá úzký tmavošedý rám se světlým nápisem IVECO, pod ním na zeleném a několik řádků bílého textu (poděkování za spolufinancování), mezi horní šedou částí a oknem vodorovná světlejší hrana, okno tmavé s dolní hranou zkosenou dovnitř (lichoběžník), na zkosení nápis IVECO, dlouhé úzké červené svítilny po obou hranách zádě, dole zahnuté dovnitř, s oranžovým blinkrem, jen vlevo (z pohledu diváka) vedle červeného pruhu tři velké tmavé žaluzie motoru pod sebou, vpravo nad bílou nálepkou čistě zelená, vpravo pod řádky textu bílé obtažené kolečko s číslem vozu, zrcátka na ramenech od hrany střechy, vlevo dole pod svítilnou kulatá bílá nálepka s červeným okrajem (rychlost), dolní rohy zelené, jen uprostřed tmavý nárazník se slovenskou SPZ (bílá s modrým pruhem EU, SK). Vycházeno z fotek a popisů na Wikimedia Commons (ne obkresleno): „Bus DPMM MT-149FM - Iveco Urbanway 12M CNG in Martin, Slovakia, November 8, 2024 - 04.jpg“ (záď, Jesenského), „Bus DPMM MT-149FM - Iveco Urbanway 12M CNG in Martin, Slovakia, November 8, 2024 - 01.jpg“; slovenská Wikipedie „Autobusová doprava v Martine“. 1 px = 1 cm. -->
