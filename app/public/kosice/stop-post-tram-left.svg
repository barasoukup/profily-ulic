<svg viewBox="0 0 50 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Košický označník električkové zastávky DPMK v dnešní podobě (nástupiště po rekonstrukcích tratí): tmavý antracitový sloup vysoký asi 2,95 m. Nahoře široká hlava: vlevo nahoře malá značka zastávky (bílý okraj, modré pole, bílé okno s tmavým piktogramem električky se sběračem), vedle bílý název zastávky na tmavém, pod tím drobné šedé hlavičky sloupců a velká LED tabule odjezdů (oranžové řádky: linka, směr, minuty). Pod hlavou užší skříň: bílá tabulka s barevnými kotouči linek (bílá čísla; čísla a barvy ilustrační, podle fotky z roku 2018), pod ní prosklená vitrína s jízdním řádem (vysoká skleněná dvířka, tmavé sklo, listy zavěšené nahoře pod tabulkou s kotouči, vlevo uprostřed malý zámek). Dole dvě nohy, na levé visí koš na odpadky s fialovým pytlem (stínová strana tmavší), mezi nohama nízko u země tmavá skříňka (asi 0,1–0,4 m, podle fotky Štúrova 21). Šířka hlavy zmenšená na 46 cm (na fotce odhadem 0,5–0,6 m), aby se vešla do obrázku. Stín vpravo (pro levou stranu ulice); při zrcadlení se mění jen stínové pruhy, nápisy, LED tabule, kotouče a piktogram se nepřevracejí. 1 px = 1 cm, spodní hrana = chodník, střed obrázku = osa označníku. -->
  <!-- Fotky, ze kterých kresba vychází (popsáno, ne obkresleno): Commons „Košice - Štúrova ul. 21.jpg“ (Ladislav Luppa, CC BY-SA 4.0, 2018; zastávka Dom umenia na levém okraji: tmavý sloup, značka a název v hlavě, LED tabule, kotouče linek 2 3 5 6 7 9, vitrína, koš), „Košice tram 2026 11.jpg“ (Smiley.toerist, CC BY-SA 4.0, červen 2026; tentýž typ u přístřešku: modrá značka zastávky, oranžová LED tabule, bílá tabulka s kotouči linek, tmavá vitrína, koš v rámu nohou). Starší tabule DPMK s hliníkovým rámem a smetanovým oknem (Levočská 2009) i čtvercové odjezdové označníky na Staničném námestí (2009) a červené ocelové sloupy (Hlavná pošta 2014) jsou nahrazené, nekreslí se. -->
  <g transform="translate(-219 -20)">
    <!-- nohy sloupu s patkami, nízká tmavá skříňka mezi nimi, koš na levé noze -->
    <rect x="227" y="238" width="4.5" height="122" fill="#34383a"/><rect x="256.5" y="238" width="4.5" height="122" fill="#34383a"/><rect x="259.5" y="238" width="1.5" height="122" fill="#25282a"/><rect x="231.5" y="320" width="25" height="30" fill="#2b2e30" rx="0.6"/><rect x="231.5" y="320" width="25" height="1" fill="#3f4345"/>
    <rect x="225" y="357" width="8.5" height="3" fill="#25282a"/><rect x="254.5" y="357" width="8.5" height="3" fill="#25282a"/>
    <rect x="221.5" y="274" width="15" height="38" fill="#3f4345" rx="1"/><rect x="221" y="272.5" width="16" height="2.4" fill="#6f63b5" rx="0.8"/><rect x="222.5" y="278" width="13" height="0.7" fill="#2b2e30"/><rect x="235" y="275" width="1.5" height="36.5" fill="#2f3234"/>
    <!-- užší skříň: tabulka s kotouči linek a vitrína s jízdním řádem -->
    <rect x="226" y="120" width="36" height="120" fill="#34383a"/><rect x="259.5" y="120" width="2.5" height="120" fill="#25282a"/>
    <rect x="229.5" y="124" width="29" height="17.5" fill="#f4f4f0"/>
    <circle cx="234.5" cy="128.4" r="3.5" fill="#c2237a"/><path d="M233.65 126.7 H235.35 M235.35 126.7 V128.4 M233.65 128.4 H235.35 M233.65 128.4 V130.1 M233.65 130.1 H235.35" stroke="#f4f4f0" stroke-width="0.7" fill="none" stroke-linecap="square" stroke-linejoin="round"/><circle cx="244" cy="128.4" r="3.5" fill="#7d8487"/><path d="M243.15 126.7 H244.85 M244.85 126.7 V128.4 M243.15 128.4 H244.85 M244.85 128.4 V130.1 M243.15 130.1 H244.85" stroke="#f4f4f0" stroke-width="0.7" fill="none" stroke-linecap="square" stroke-linejoin="round"/><circle cx="253.5" cy="128.4" r="3.5" fill="#1f3570"/><path d="M252.65 126.7 H254.35 M252.65 126.7 V128.4 M252.65 128.4 H254.35 M254.35 128.4 V130.1 M252.65 130.1 H254.35" stroke="#f4f4f0" stroke-width="0.7" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
    <circle cx="234.5" cy="137" r="3.5" fill="#e8762b"/><path d="M233.65 135.3 H235.35 M233.65 135.3 V137 M233.65 137 H235.35 M233.65 137 V138.7 M233.65 138.7 H235.35 M235.35 137 V138.7" stroke="#f4f4f0" stroke-width="0.7" fill="none" stroke-linecap="square" stroke-linejoin="round"/><circle cx="244" cy="137" r="3.5" fill="#2e9e48"/><path d="M243.15 135.3 H244.85 M244.85 135.3 V137 M244.85 137 V138.7" stroke="#f4f4f0" stroke-width="0.7" fill="none" stroke-linecap="square" stroke-linejoin="round"/><circle cx="253.5" cy="137" r="3.5" fill="#1f7fc4"/><path d="M252.65 135.3 H254.35 M254.35 135.3 V137 M254.35 137 V138.7 M252.65 138.7 H254.35 M252.65 135.3 V137 M252.65 137 H254.35" stroke="#f4f4f0" stroke-width="0.7" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
    <rect x="229.5" y="144" width="29" height="92" fill="#1b1e20"/><rect x="229.5" y="144" width="29" height="92" fill="none" stroke="#4a4e51" stroke-width="0.8"/><rect x="231.2" y="146" width="0.8" height="88" fill="#2c3134"/><rect x="236" y="147.5" width="17" height="11" fill="#e3e4df"/><rect x="237.2" y="149.5" width="14.6" height="0.7" fill="#9a9b9c"/><rect x="237.2" y="151.7" width="14.6" height="0.7" fill="#9a9b9c"/><rect x="237.2" y="153.9" width="14.6" height="0.7" fill="#9a9b9c"/><rect x="242" y="160.5" width="7" height="4.5" fill="#c9cccd"/><circle cx="233" cy="190" r="0.7" fill="#c9cccd"/>
    <!-- hlava: značka zastávky, název, hlavičky sloupců, LED tabule odjezdů -->
    <rect x="221" y="64" width="46" height="57" fill="#34383a" rx="1"/><rect x="264.5" y="64" width="2.5" height="57" fill="#25282a"/>
    <!-- značka zastávky: bílý okraj, modré pole, bílé okno, tmavá električka (skříň, pás oken, úzké dveře jako u autobusu) s kosočtvercovým sběračem užším než vůz -->
    <rect x="223" y="66" width="12" height="12" fill="#f4f4f0" rx="0.8"/><rect x="223.8" y="66.8" width="10.4" height="10.4" fill="#1d4f9e"/><rect x="225.2" y="68.2" width="7.6" height="7.6" fill="#f4f4f0"/>
    <path d="M229 71.3 L230.1 70.1 L231.2 71.3 Z" stroke="#1a1a1a" stroke-width="0.4" fill="none" stroke-linejoin="round"/><rect x="226" y="71.4" width="6" height="3" rx="0.4" fill="#1a1a1a"/><rect x="226.7" y="72" width="4.6" height="1" fill="#f4f4f0"/><rect x="228.7" y="72" width="0.6" height="2.4" fill="#1a1a1a"/><rect x="226.6" y="74.6" width="1.6" height="0.7" fill="#1a1a1a"/><rect x="229.8" y="74.6" width="1.6" height="0.7" fill="#1a1a1a"/>
    <rect x="238" y="70.4" width="22" height="3" fill="#f4f4f0"/>
    <rect x="224" y="80.2" width="4" height="0.8" fill="#8f9496"/><rect x="231" y="80.2" width="5" height="0.8" fill="#8f9496"/><rect x="257" y="80.2" width="6" height="0.8" fill="#8f9496"/>
    <rect x="223.5" y="82" width="41" height="36" fill="#141516"/>
    <rect x="225" y="84.6" width="3" height="1.8" fill="#f08a24"/><rect x="230" y="84.6" width="18" height="1.8" fill="#f08a24"/><rect x="258" y="84.6" width="4.5" height="1.8" fill="#f08a24"/><rect x="225" y="90" width="3" height="1.8" fill="#f08a24"/><rect x="230" y="90" width="8" height="1.8" fill="#f08a24"/><rect x="258" y="90" width="4.5" height="1.8" fill="#f08a24"/><rect x="225" y="95.4" width="3" height="1.8" fill="#f08a24"/><rect x="230" y="95.4" width="22" height="1.8" fill="#f08a24"/><rect x="258" y="95.4" width="4.5" height="1.8" fill="#f08a24"/>
    <rect x="225" y="100.8" width="3" height="1.8" fill="#f08a24"/><rect x="230" y="100.8" width="15" height="1.8" fill="#f08a24"/><rect x="258" y="100.8" width="4.5" height="1.8" fill="#f08a24"/><rect x="225" y="106.2" width="3" height="1.8" fill="#f08a24"/><rect x="230" y="106.2" width="20" height="1.8" fill="#f08a24"/><rect x="258" y="106.2" width="4.5" height="1.8" fill="#f08a24"/><rect x="225" y="111.6" width="3" height="1.8" fill="#f08a24"/><rect x="230" y="111.6" width="11" height="1.8" fill="#f08a24"/><rect x="258" y="111.6" width="4.5" height="1.8" fill="#f08a24"/>
  </g>
