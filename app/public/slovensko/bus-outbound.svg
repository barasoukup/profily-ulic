<!-- Obecný slovenský městský autobus pro města bez vlastní kresby: nízkopodlažní SOR NS 12 (typický vůz slovenských měst a SAD/Arriva), neutrální bílá skříň s jednoduchým modrým pásem, bez loga dopravce, slovenská SPZ (bílá s modrým pruhem EU, SK). Zadní pohled: nízký kryt střešní klimatizace (stejný jako zepředu), malá červená obrysová světla v horních rozích střešního víka, horní část zádě jako jeden černý panel téměř přes celou šířku (vlevo mřížka sání motoru s vodorovnými lamelami, vpravo sklo s číslem linky nahoře), modrý pás ve stejné výšce jako vpředu (mezi pouzdry svítilen, přes spáru víka motoru), v rozích svislý sloupec kulatých svítilen ve světle šedém pouzdře (dvě červené, bílá couvací, oranžový blinkr), pod oknem hladký panel v barvě skříně jen s jemnou spárou a malým znakem, černý nárazník se SPZ (jako u Bratislavy). Vycházeno z fotek na Wikimedia Commons (ne obkresleno): „SOR NS 12, Libchavy 01.jpg“ (Michal Gregor, CC BY-SA 4.0, nový vůz u výrobce), „SOR NS12 back.jpg“ (Oleksandr Dede, CC BY-SA 4.0, zadní pohled, Třinec); kategorie „SOR NS 12“. 1 px = 1 cm. -->
