<!-- Autobus Mercedes-Benz Citaro C2, Innsbrucker Verkehrsbetriebe (IVB), zadní pohled. Celá skříň karmínově červená (#d0142a) až skoro k zemi, kryty na střeše a klimatizace o odstín tmavší (#c01226), třetí brzdové světlo na hraně střechy, velká černá prosklená plocha až ke střeše s LED číslem linky (jantarová) uvnitř, hladké víko motoru v barvě skříně, štíhlá koncová světla v tmavém rámečku a pod nimi zvlášť malá kulatá oranžová směrovka, malé bílé logo IVB, SPZ na červené a pod ní jen úzký tmavý spodní okraj; zrcátka stejně vysoko a stejně velká jako na čelním pohledu. Vycházeno z fotek na Wikimedia Commons (ne obkresleno): „Claudiaplatz 3 (20190504 162921).jpg“ (Citaro C2 IVB v červené), „Flughafen Innsbruck (IMG 20260312 081504).jpg“ (záď C2 IVB, 2026); jen tvar a barvy. Rakouská SPZ podle vyhlášky KDV (modrý pruh EU s A, I = Innsbruck). 1 px = 1 cm. -->
