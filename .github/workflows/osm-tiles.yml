# The OSM tiles of each state, built from Geofabrik's extracts once a week and uploaded to Cloudflare R2 (bucket
# profily-ulic-osm in Bára's account, served at data.streetspace.eu/osm), apart from the deploy of the site (Bára
# 17. 11. 2026: more states will come). Each state is a job of its own (its own runner, disk and 6 h limit), all in
# parallel; a state that fails keeps last week's file. Germany is built by its 16 Länder (tools/countries.mjs parts: de_by, de_nw …). The last job writes index.json from what R2 holds (the newest
# file of each state) and deletes all but the two newest of each. Then the site's deploy runs (pages.yml), copying the
# Czech and Slovak files onto Pages as a fallback. A new state: its line in tools/countries.mjs.
# Runs weekly, by hand (optionally only some states) and when the tile scripts change on main.
name: OSM tiles

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Kódy balíků oddělené čárkou (prázdné: všechny), např. at,de (celé Německo) nebo de_by"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths:
      - tools/build_osm_tiles.mjs
      - tools/build_osm_data.sh
      - tools/pack_osm_tiles.mjs
      - pilot/public/osmtile.js
      - pilot/public/osmpack.js
      - .github/workflows/osm-tiles.yml

permissions:
  contents: read

concurrency:
  group: osm-tiles
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2: s3://profily-ulic-osm/osm
  ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  # The packs to build, one a state or a part of one (tools/countries.mjs --matrix).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: m
        run: echo "matrix=$(node tools/countries.mjs --matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Each well under an hour (the largest: Austria, Czechia, Bavaria, North Rhine-Westphalia).
    timeout-minutes: 330
    steps:
      - id: wanted
        run: |
          s="${{ github.event.inputs.states }}"
          # A state's code (de) builds all its parts (de_by, de_nw …).
          c="${{ matrix.code }}"
          if [ -z "$s" ] || echo ",$s," | grep -q ",$c," || echo ",$s," | grep -q ",${c%%_*},"; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "${{ vars.R2_ACCOUNT_ID }}" ]; then echo "::error::no R2 keys (secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, variable R2_ACCOUNT_ID)"; exit 1; fi
      - if: steps.wanted.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.wanted.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The preinstalled toolchains the build does not use go first (Germany's exports and tiles need the room).
      - name: Free disk space
        if: steps.wanted.outputs.go == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Install GDAL (ogr2ogr)
        if: steps.wanted.outputs.go == 'true'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends gdal-bin
          ogr2ogr --version
      - name: Download the OSM extract
        if: steps.wanted.outputs.go == 'true'
        timeout-minutes: 60
        run: |
          mkdir -p data/osm
          curl -fL --retry 3 --retry-delay 20 --connect-timeout 30 -o "data/osm/${{ matrix.code }}.osm.pbf" \
            "https://download.geofabrik.de/europe/${{ matrix.extract }}-latest.osm.pbf"
          ls -l data/osm
      - name: Build and pack the tiles
        if: steps.wanted.outputs.go == 'true'
        timeout-minutes: 240
        run: |
          c=${{ matrix.code }}
          mkdir -p site-osm
          NAME=$c tools/build_osm_data.sh "data/osm/$c.osm.pbf" "tiles-$c"
          rm -f "data/osm/$c.osm.pbf" data/osm/${c}_*.geojsonl
          node tools/pack_osm_tiles.mjs "tiles-$c" "site-osm/$c-$(date -u +%F)-{hash}.posm"
          ls -l site-osm
      - name: Upload to R2
        if: steps.wanted.outputs.go == 'true'
        timeout-minutes: 30
        run: |
          aws configure set default.s3.multipart_chunksize 64MB
          for f in site-osm/*.posm; do
            aws s3 cp --endpoint-url "$ENDPOINT" "$f" "$R2/" --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
          done
          # The box of the file's tiles for the index (pack_osm_tiles.mjs index.json).
          aws s3 cp --endpoint-url "$ENDPOINT" site-osm/index.json "$R2/meta/${{ matrix.code }}.json" --content-type application/json

  # index.json from the files on R2: the newest of each state (by the upload time), so a state whose job failed keeps
  # its previous file; then all but the two newest of each state go.
  index:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket profily-ulic-osm --prefix osm/ --output json > list.json
          mkdir -p meta && aws s3 cp --endpoint-url "$ENDPOINT" "$R2/meta/" meta/ --recursive || true
          node tools/osm_index.mjs list.json index.json delete.txt meta
          cat index.json
          aws s3 cp --endpoint-url "$ENDPOINT" index.json "$R2/index.json" --content-type application/json --cache-control "public, max-age=300"
          while read -r old; do [ -n "$old" ] && aws s3 rm --endpoint-url "$ENDPOINT" "s3://profily-ulic-osm/$old"; done < delete.txt

  # The site with the new files of the fallback (pages.yml copies the Czech and Slovak files from R2 onto Pages).
  deploy:
    needs: index
    if: always() && needs.index.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
