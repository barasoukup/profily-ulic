# The OSM tiles of each state, built from Geofabrik's extracts and uploaded to Cloudflare R2 (bucket profily-ulic-osm in
# Bára's account, served at data.streetspace.eu/osm), apart from the deploy of the site (Bára 17. 11. 2026: more states will
# come). Each pack (a state or a part of one: de_by, nl_zh …; tools/countries.mjs) is a job of its own (its own runner,
# disk and 6 h limit), a few at a time; a pack that fails keeps its previous file.
# Every day a seventh of the packs (Bára 26. 11. 2026: R2 is free up to 10 GB, counted by the largest amount of each day):
# tools/countries.mjs DAYS puts each pack on a day of the week, the days about as big, so each pack is rebuilt once a week.
# As soon as a pack is on R2, its job asks for the index (osm-index.yml): one run at a time writes index.json from what R2
# holds (the newest file of each state) and deletes the older files at once, so R2 never holds two whole sets, only the
# whole set and the few new files waiting for the index (evaluation/osm-r2/REPORT-SLIM.md, tools/osm_peak.mjs).
# The Czech and Slovak files are copied onto Pages as a fallback by the site's deploy (pages.yml), which osm-index.yml
# starts when they change. A new state: its line in tools/countries.mjs (and its MB in tools/osm-sizes.json).
# Runs daily (that day's packs) and by hand (the packs named, a day, or all); not on a push: a change of the tile scripts
# reaches every pack within a week of daily runs (Bára 27. 11. 2026: "počkala bych si týden na průběžnou obnovu").
name: OSM tiles

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Kódy balíků oddělené čárkou (prázdné: podle dne, nebo všechny), např. at,de (celé Německo) nebo de_by"
        required: false
        default: ""
      day:
        description: "Den týdne 1–7 (balíky toho dne, tools/countries.mjs --days); prázdné a bez států: všechny balíky"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: osm-tiles
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2: s3://profily-ulic-osm/osm
  ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  # The packs to build (tools/countries.mjs --matrix): the named ones, those of the day (the daily run: today's), or all.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: m
        env:
          STATES: ${{ github.event.inputs.states }}
          DAY: ${{ github.event.inputs.day }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$STATES" ]; then args=(--states "$STATES")
          elif [ -n "$DAY" ]; then args=(--day "$DAY")
          elif [ "$EVENT" = "schedule" ]; then args=(--day "$(date -u +%u)")
          else args=(); fi
          m=$(node tools/countries.mjs --matrix "${args[@]}")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$m" | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s).include.length))')" -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          echo "$m"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      # Geofabrik refused the connection when 20 downloads began at once (Thuringia, Switzerland, 17. 11. 2026): a few
      # at a time, and a longer wait between tries.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Each well under an hour (the largest: Austria, Czechia, Bavaria, North Rhine-Westphalia).
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write
    steps:
      - name: R2 keys
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "${{ vars.R2_ACCOUNT_ID }}" ]; then echo "::error::no R2 keys (secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, variable R2_ACCOUNT_ID)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The preinstalled toolchains the build does not use go first (Germany's exports and tiles need the room).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Install GDAL (ogr2ogr)
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends gdal-bin
          ogr2ogr --version
      - name: Download the OSM extract
        timeout-minutes: 60
        run: |
          mkdir -p data/osm
          # An extract with a continent (africa/, north-america/) is taken as it is, the others are under europe/.
          # Several extracts joined by "+" with a box after "@" (tools/countries.mjs, the USA's us_dc, us_bos): each is cut to the
          # box with osmium and the pieces are merged.
          e="${{ matrix.extract }}"; box=""
          case "$e" in *@*) box="${e##*@}"; e="${e%@*}";; esac
          url() { case "$1" in africa/*|north-america/*) echo "https://download.geofabrik.de/$1-latest.osm.pbf";; *) echo "https://download.geofabrik.de/europe/$1-latest.osm.pbf";; esac; }
          if [ -z "$box" ] && [ "${e#*+}" = "$e" ]; then
            curl -fL --retry 8 --retry-delay 60 --retry-all-errors --connect-timeout 30 -o "data/osm/${{ matrix.code }}.osm.pbf" "$(url "$e")"
          else
            sudo apt-get install -y -q --no-install-recommends osmium-tool
            i=0; parts=()
            for x in ${e//+/ }; do
              i=$((i + 1))
              curl -fL --retry 8 --retry-delay 60 --retry-all-errors --connect-timeout 30 -o "data/osm/part$i.osm.pbf" "$(url "$x")"
              if [ -n "$box" ]; then osmium extract -b "$box" "data/osm/part$i.osm.pbf" -o "data/osm/cut$i.osm.pbf" --overwrite; rm "data/osm/part$i.osm.pbf"; parts+=("data/osm/cut$i.osm.pbf"); else parts+=("data/osm/part$i.osm.pbf"); fi
            done
            osmium merge "${parts[@]}" -o "data/osm/${{ matrix.code }}.osm.pbf" --overwrite
            rm -f "${parts[@]}"
          fi
          ls -l data/osm
      - name: Build and pack the tiles
        timeout-minutes: 240
        run: |
          c=${{ matrix.code }}
          mkdir -p site-osm
          NAME=$c tools/build_osm_data.sh "data/osm/$c.osm.pbf" "tiles-$c"
          rm -f "data/osm/$c.osm.pbf" data/osm/${c}_*.geojsonl
          # Slimmed as it is packed (tools/osm_slim.mjs: what the app never reads; the ids of its areas and points are counted in memory).
          node --max-old-space-size=12000 tools/pack_osm_tiles.mjs "tiles-$c" "site-osm/$c-$(date -u +%F)-{hash}.posm"
          ls -l site-osm
      - name: Upload to R2
        timeout-minutes: 30
        run: |
          aws configure set default.s3.multipart_chunksize 64MB
          # The box of the file's tiles for the index first (pack_osm_tiles.mjs index.json; an index run between the two
          # uploads then finds it), then the file.
          aws s3 cp --endpoint-url "$ENDPOINT" site-osm/index.json "$R2/meta/${{ matrix.code }}.json" --content-type application/json
          for f in site-osm/*.posm; do
            aws s3 cp --endpoint-url "$ENDPOINT" "$f" "$R2/" --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
          done
      # The index at once (osm-index.yml, one run at a time): the new file is read from now on and the old one goes.
      - name: Ask for the index
        run: gh workflow run osm-index.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # Once more after all the packs (one whose request for the index failed, or a run that built nothing): index.json from
  # the files on R2, the older ones deleted, the fallback on Pages renewed when the Czech or Slovak file changed.
  index:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run osm-index.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
