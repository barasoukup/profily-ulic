# Publishes the app (pilot/public) on GitHub Pages as a static site: the browser asks IPR and
# Streetmix directly, and the OSM tiles are built here from the BBBike Prague extract on every
# deploy (they are not kept in the repository). Runs on push to main, by hand, and weekly so the
# OSM data stays fresh.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Syntax of every script and the unit tests (tests/): a failing check stops the deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GDAL (ogr2ogr)
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends gdal-bin
          ogr2ogr --version
      # The BBBike extract is kept in the Actions cache: a deploy reuses this week's copy, a new week
      # downloads a fresh one and falls back to the last copy when download.bbbike.org is unreachable.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: pbf-cache
        uses: actions/cache@v4
        with:
          path: data/osm/Prag.osm.pbf
          key: osm-pbf-${{ steps.week.outputs.week }}
          restore-keys: osm-pbf-
      - name: Download the OSM extract
        if: steps.pbf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/osm
          # 1. BBBike's Prague extract (what the app was built on); it sometimes refuses GitHub's runners.
          if curl -fL --retry 2 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o /tmp/Prag.osm.pbf \
               https://download.bbbike.org/osm/bbbike/Prag/Prag.osm.pbf; then
            mv /tmp/Prag.osm.pbf data/osm/Prag.osm.pbf
            exit 0
          fi
          # 2. Geofabrik's Czech Republic, cut to the same area as the BBBike extract.
          echo "::warning::download.bbbike.org unreachable, cutting Prague out of the Geofabrik extract"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends osmium-tool
          if curl -fL --retry 3 --retry-delay 20 --connect-timeout 30 -o /tmp/cz.osm.pbf \
               https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf; then
            osmium extract --bbox 14.19,49.90,14.76,50.19 --overwrite -o data/osm/Prag.osm.pbf /tmp/cz.osm.pbf
            exit 0
          fi
          # 3. The cached extract from an earlier week.
          if [ -f data/osm/Prag.osm.pbf ]; then
            echo "::warning::no fresh OSM extract, using the cached one from an earlier week"
          else
            exit 1
          fi
      - name: Build OSM tiles
        run: tools/build_osm_data.sh data/osm/Prag.osm.pbf site-tiles
      # The zone file of the last good deploy is kept in the Actions cache: when IPR does not answer
      # now, that one goes out; with neither, the deploy stops (without it many more cuts would be
      # guesses).
      - id: zps-cache
        uses: actions/cache@v4
        with:
          path: data/zps-last.json
          key: zps-${{ github.run_id }}
          restore-keys: zps-
      - name: Paid parking zones (once per deploy, not on every click)
        run: |
          if node tools/build_zps.mjs site-zps.json; then
            mkdir -p data && cp site-zps.json data/zps-last.json
          elif [ -f data/zps-last.json ]; then
            echo "::warning::IPR did not answer, using the zone file of an earlier deploy"
            cp data/zps-last.json site-zps.json
          else
            echo "::error::no zone file (data/zps.json) and none cached"; exit 1
          fi
      # The age of the built-up area (IPR "Vývoj zástavby", CC BY), once per deploy into static tiles:
      # a default for the look of flat-roofed houses. Without it the app judges by the house alone.
      - name: Built-up area by period
        continue-on-error: true
        timeout-minutes: 10
        run: node tools/build_vyvoj.mjs site-vyvoj
      # Brno (/brno/): the same app; like Prague it asks the city's services on a click (MTVU, the
      # technical-map drawing and buildings on gis.brno.cz). Built here: the OSM tiles (BBBike Brno) and
      # the paid parking of parkovanivbrne.cz. A failure leaves Brno out; Prague goes out anyway.
      - id: brno-pbf-cache
        uses: actions/cache@v4
        with:
          path: data/osm/Brno.osm.pbf
          key: osm-brno-pbf-${{ steps.week.outputs.week }}
          restore-keys: osm-brno-pbf-
      - id: brno-parking-cache
        uses: actions/cache@v4
        with:
          path: data/parkovani-brno-last
          key: brno-parking-${{ github.run_id }}
          restore-keys: brno-parking-
      - name: Brno OSM tiles
        id: brno
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mkdir -p data/osm
          if [ "${{ steps.brno-pbf-cache.outputs.cache-hit }}" != "true" ]; then
            # BBBike's Brno extract, else Geofabrik's Czech Republic cut to the same area, else last week's copy
            if curl -fL --retry 2 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o /tmp/Brno.osm.pbf \
                 https://download.bbbike.org/osm/bbbike/Brno/Brno.osm.pbf; then
              mv /tmp/Brno.osm.pbf data/osm/Brno.osm.pbf
            else
              echo "::warning::download.bbbike.org unreachable, cutting Brno out of the Geofabrik extract"
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends osmium-tool
              [ -f /tmp/cz.osm.pbf ] || curl -fL --retry 3 --retry-delay 20 --connect-timeout 30 -o /tmp/cz.osm.pbf \
                https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf
              osmium extract --bbox 16.42,49.10,16.78,49.30 --overwrite -o data/osm/Brno.osm.pbf /tmp/cz.osm.pbf || [ -f data/osm/Brno.osm.pbf ]
            fi
          fi
          NAME=brno tools/build_osm_data.sh data/osm/Brno.osm.pbf site-brno/data/osm-tiles
          # Paid parking from the parkovanivbrne.cz map (current, unlike the 2/2024 export on data.brno.cz);
          # when the map does not answer, the files of the last good deploy.
          if node tools/build_parkovani_brno.mjs site-brno/data; then
            mkdir -p data/parkovani-brno-last && cp -R site-brno/data/parkovani data/parkovani-brno-last/
          elif [ -d data/parkovani-brno-last/parkovani ]; then
            echo "::warning::parkovanivbrne.cz did not answer, using the parking of an earlier deploy"
            cp -R data/parkovani-brno-last/. site-brno/data/
          else
            echo "::warning::no Brno parking data, profiles estimate the parking"
          fi
          touch site-brno/ok
      # Jihlava (/jihlava/): the same app asking the town's GIS on a click (passport of the roads, RÚIAN
      # buildings, parking, technical map on gis.jihlava-city.cz). Built here: only the OSM tiles, cut out
      # of Geofabrik's Czech Republic (no BBBike extract). A failure leaves Jihlava out.
      - id: jihlava-pbf-cache
        uses: actions/cache@v4
        with:
          path: data/osm/Jihlava.osm.pbf
          key: osm-jihlava-pbf-${{ steps.week.outputs.week }}
          restore-keys: osm-jihlava-pbf-
      - name: Jihlava OSM tiles
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mkdir -p data/osm
          if [ "${{ steps.jihlava-pbf-cache.outputs.cache-hit }}" != "true" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends osmium-tool
            [ -f /tmp/cz.osm.pbf ] || curl -fL --retry 3 --retry-delay 20 --connect-timeout 30 -o /tmp/cz.osm.pbf \
              https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf
            osmium extract --bbox 15.48,49.32,15.70,49.47 --overwrite -o data/osm/Jihlava.osm.pbf /tmp/cz.osm.pbf || [ -f data/osm/Jihlava.osm.pbf ]
          fi
          NAME=jihlava tools/build_osm_data.sh data/osm/Jihlava.osm.pbf site-jihlava/data/osm-tiles
          touch site-jihlava/ok
      - name: Assemble the site
        env:
          MAPY_KEY: ${{ secrets.MAPY_KEY }} # Mapy.com key for the street panorama; empty → a plain link instead
        run: |
          mkdir -p _site/data
          cp -R pilot/public/. _site/
          sed -i 's/export const STATIC = false;/export const STATIC = true;/' _site/config.js
          grep -q "STATIC = true" _site/config.js
          # The key goes in as a JSON string (any characters are safe); GitHub masks it in the log.
          node -e 'const fs = require("fs"), f = "_site/config.js", k = process.env.MAPY_KEY || "";
            if (k) fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace("MAPY_KEY = \"\"", "MAPY_KEY = " + JSON.stringify(k)));'
          grep -q 'MAPY_KEY = ""' _site/config.js && echo "::warning::no Mapy.com key (secret MAPY_KEY), the panorama falls back to a link" || true
          mv site-tiles _site/data/osm-tiles
          mv site-zps.json _site/data/zps.json
          [ -d site-vyvoj ] && mv site-vyvoj _site/data/vyvoj || echo "::warning::no built-up area tiles, flat roofs judged by the house alone"
          cp LICENCE-A-ZDROJE.md _site/data/LICENCE-A-ZDROJE.md
          if [ -f site-brno/ok ]; then
            # The app files again, with the config made above (STATIC, Mapy.com key), then CITY = "brno".
            mkdir -p _site/brno/data
            cp -R pilot/public/. _site/brno/
            cp _site/config.js _site/brno/config.js
            rm site-brno/ok && mv site-brno/data/* _site/brno/data/
            cp LICENCE-A-ZDROJE.md _site/brno/data/LICENCE-A-ZDROJE.md
            # a Brno failure never stops the Prague deploy
            node tools/build_brno_site.mjs _site/brno || { echo "::warning::Brno site not built"; rm -rf _site/brno; }
          else
            echo "::warning::no Brno data, the Brno site is left out of this deploy"
          fi
          if [ -f site-jihlava/ok ]; then
            mkdir -p _site/jihlava/data
            cp -R pilot/public/. _site/jihlava/
            cp _site/config.js _site/jihlava/config.js
            rm site-jihlava/ok && mv site-jihlava/data/* _site/jihlava/data/
            cp LICENCE-A-ZDROJE.md _site/jihlava/data/LICENCE-A-ZDROJE.md
            node tools/build_brno_site.mjs _site/jihlava jihlava || { echo "::warning::Jihlava site not built"; rm -rf _site/jihlava; }
          else
            echo "::warning::no Jihlava data, the Jihlava site is left out of this deploy"
          fi
          # a city site that is missing gets no link from the others (city switch and footer)
          node tools/drop_city_links.mjs _site
          cat > _site/data/README.txt <<'EOF'
          data/osm-tiles: dlaždice odvozené z OpenStreetMap (výřez BBBike Praha).
          © přispěvatelé OpenStreetMap, licence ODbL 1.0 (https://opendatacommons.org/licenses/odbl/).
          Vytvořeno skriptem tools/build_osm_data.sh v repozitáři této aplikace.
          EOF
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
