# Publishes the app (pilot/public) on GitHub Pages as a static site: the browser asks IPR and
# Streetmix directly, and the OSM tiles are built here from the BBBike Prague extract on every
# deploy (they are not kept in the repository). Runs on push to main, by hand, and weekly so the
# OSM data stays fresh.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GDAL (ogr2ogr)
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends gdal-bin
          ogr2ogr --version
      # The BBBike extract is kept in the Actions cache: a deploy reuses this week's copy, a new week
      # downloads a fresh one and falls back to the last copy when download.bbbike.org is unreachable.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: pbf-cache
        uses: actions/cache@v4
        with:
          path: data/osm/Prag.osm.pbf
          key: osm-pbf-${{ steps.week.outputs.week }}
          restore-keys: osm-pbf-
      - name: Download the OSM extract
        if: steps.pbf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/osm
          # 1. BBBike's Prague extract (what the app was built on); it sometimes refuses GitHub's runners.
          if curl -fL --retry 2 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o /tmp/Prag.osm.pbf \
               https://download.bbbike.org/osm/bbbike/Prag/Prag.osm.pbf; then
            mv /tmp/Prag.osm.pbf data/osm/Prag.osm.pbf
            exit 0
          fi
          # 2. Geofabrik's Czech Republic, cut to the same area as the BBBike extract.
          echo "::warning::download.bbbike.org unreachable, cutting Prague out of the Geofabrik extract"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends osmium-tool
          if curl -fL --retry 3 --retry-delay 20 --connect-timeout 30 -o /tmp/cz.osm.pbf \
               https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf; then
            osmium extract --bbox 14.19,49.90,14.76,50.19 --overwrite -o data/osm/Prag.osm.pbf /tmp/cz.osm.pbf
            exit 0
          fi
          # 3. The cached extract from an earlier week.
          if [ -f data/osm/Prag.osm.pbf ]; then
            echo "::warning::no fresh OSM extract, using the cached one from an earlier week"
          else
            exit 1
          fi
      - name: Build OSM tiles
        run: tools/build_osm_data.sh data/osm/Prag.osm.pbf site-tiles
      - name: Paid parking zones (once per deploy, not on every click)
        continue-on-error: true
        run: node tools/build_zps.mjs site-zps.json
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -R pilot/public/. _site/
          sed -i 's/export const STATIC = false;/export const STATIC = true;/' _site/config.js
          grep -q "STATIC = true" _site/config.js
          mv site-tiles _site/data/osm-tiles
          [ -f site-zps.json ] && mv site-zps.json _site/data/zps.json || echo "::warning::no zps.json, the app falls back to TSK sections"
          cp LICENCE-A-ZDROJE.md _site/data/LICENCE-A-ZDROJE.md
          cat > _site/data/README.txt <<'EOF'
          data/osm-tiles: dlaždice odvozené z OpenStreetMap (výřez BBBike Praha).
          © přispěvatelé OpenStreetMap, licence ODbL 1.0 (https://opendatacommons.org/licenses/odbl/).
          Vytvořeno skriptem tools/build_osm_data.sh v repozitáři této aplikace.
          EOF
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
