# Publishes the app (app/public) on GitHub Pages as a static site: the browser asks IPR, the cities'
# GIS and ČÚZK directly, and the OSM tiles of the states are built apart once a week (osm-tiles.yml, onto Cloudflare
# R2, data.streetspace.eu), the files of the states listed for Pages (tools/countries.mjs) copied here as a fallback.
# Runs on push to main, by hand, and weekly after the tiles (osm-tiles.yml starts it).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Syntax and imports of every script, ESLint (errors only) and the unit tests (tests/): a failing check stops the deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The packed OSM tiles are built apart (osm-tiles.yml, onto R2; Bára 17. 11. 2026: more states will come): here
      # only the files of the states that also go on Pages (tools/countries.mjs pages) are copied from R2 as the fallback
      # the app reads when R2 does not answer (gis.js). Without R2 the site goes out without the fallback.
      - name: OSM tiles for the fallback on Pages
        timeout-minutes: 15
        run: |
          mkdir -p site-osm
          if curl -fsS --retry 3 --retry-delay 10 -o site-osm/r2-index.json https://data.streetspace.eu/osm/index.json; then
            for c in $(node tools/countries.mjs --list pages); do
              f=$(node -e 'const j = require("./site-osm/r2-index.json"); process.stdout.write(j.files[process.argv[1]] || "")' "$c")
              [ -n "$f" ] && curl -fsS --retry 3 --retry-delay 10 -o "site-osm/$f" "https://data.streetspace.eu/osm/$f" || echo "::warning::no OSM file of $c on R2"
            done
            node --input-type=module -e 'import fs from "fs"; import { COUNTRIES } from "./tools/countries.mjs";
              const j = JSON.parse(fs.readFileSync("site-osm/r2-index.json", "utf8"));
              j.files = Object.fromEntries(Object.entries(j.files).filter(([c, f]) => COUNTRIES[c]?.pages && fs.existsSync("site-osm/" + f)));
              fs.writeFileSync("site-osm/index.json", JSON.stringify(j, null, 1))'
            rm site-osm/r2-index.json
            ls -l site-osm
          else
            echo "::warning::data.streetspace.eu did not answer: the site goes out without the OSM fallback on Pages"
          fi
      # The zone file of the last good deploy is kept in the Actions cache: when IPR does not answer
      # now, that one goes out; with neither, the deploy stops (without it many more cuts would be
      # guesses).
      - id: zps-cache
        uses: actions/cache@v4
        with:
          path: data/zps-last.json
          key: zps-${{ github.run_id }}
          restore-keys: zps-
      - name: Paid parking zones (once per deploy, not on every click)
        run: |
          if node tools/build_zps.mjs site-zps.json; then
            mkdir -p data && cp site-zps.json data/zps-last.json
          elif [ -f data/zps-last.json ]; then
            echo "::warning::IPR did not answer, using the zone file of an earlier deploy"
            cp data/zps-last.json site-zps.json
          else
            echo "::error::no zone file (data/zps.json) and none cached"; exit 1
          fi
      # The age of the built-up area (IPR "Vývoj zástavby", CC BY), once per deploy into static tiles:
      # a default for the look of flat-roofed houses. Without it the app judges by the house alone.
      - name: Built-up area by period
        continue-on-error: true
        timeout-minutes: 10
        run: node tools/build_built_up_age.mjs site-built-up-age
      # Prague's open data (Geoportál Praha, CC BY 4.0): trees and tree rows, TSK's no-parking sections and
      # street classes, downloaded once per deploy from opendata.geoportalpraha.cz into small tiles
      # (data/praha/opendata, about 6 MB), never on a click. When the download fails, the tiles of the last
      # good deploy (cache); with neither, the profiles go without them.
      - id: praha-opendata-cache
        uses: actions/cache@v4
        with:
          path: data/praha-opendata-last
          key: praha-opendata-${{ github.run_id }}
          restore-keys: praha-opendata-
      - name: Prague open data
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p site-praha/data
          if node tools/build_praha_opendata.mjs site-praha/data; then
            rm -rf data/praha-opendata-last && mkdir -p data/praha-opendata-last && cp -R site-praha/data/opendata data/praha-opendata-last/
          elif [ -d data/praha-opendata-last/opendata ]; then
            echo "::warning::opendata.geoportalpraha.cz did not answer, using the open data of an earlier deploy"
            rm -rf site-praha/data/opendata && cp -R data/praha-opendata-last/opendata site-praha/data/
          else
            echo "::warning::no Prague open data, profiles go without its trees, no-parking sections and street classes"
          fi
      # Brno (/brno/): the same app; like Prague it asks the city's services on a click (MTVU, the
      # technical-map drawing and buildings on gis.brno.cz). Built here: the paid parking of
      # parkovanivbrne.cz; without it the profiles estimate the parking.
      - id: brno-parking-cache
        uses: actions/cache@v4
        with:
          path: data/brno-parking-last
          key: brno-parking-v2-${{ github.run_id }}
          restore-keys: brno-parking-v2-
      - name: Brno parking
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mkdir -p site-brno/data
          # Paid parking from the parkovanivbrne.cz map (current, unlike the 2/2024 export on data.brno.cz);
          # when the map does not answer, the files of the last good deploy.
          if node tools/build_parking_brno.mjs site-brno/data; then
            mkdir -p data/brno-parking-last && cp -R site-brno/data/parking data/brno-parking-last/
          elif [ -d data/brno-parking-last/parking ]; then
            echo "::warning::parkovanivbrne.cz did not answer, using the parking of an earlier deploy"
            cp -R data/brno-parking-last/. site-brno/data/
          else
            echo "::warning::no Brno parking data, profiles estimate the parking"
          fi
      # The towns (Jihlava, Most, Opava, Pardubice, Plzeň; tools/cities.mjs) ask the town's GIS or the
      # national DTM on a click and read the shared OSM tiles: nothing to build but Plzeň's zones.
      # Plzeň's paid parking zones: a static file of the city's open data (CC0), built at each deploy;
      # when it fails, the file of an earlier deploy (cache), else none (the profile estimates).
      - id: plzen-zones-cache
        uses: actions/cache@v4
        with:
          path: data/plzen-zones-last
          key: plzen-zones-v2-${{ github.run_id }}
          restore-keys: plzen-zones-v2-
      - name: Plzeň parking zones
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p site-plzen/data
          if node tools/build_zones_plzen.mjs site-plzen/data; then
            mkdir -p data/plzen-zones-last && cp site-plzen/data/zones.json data/plzen-zones-last/
          elif [ -f data/plzen-zones-last/zones.json ]; then
            echo "::warning::opendata.plzen.eu did not answer, using the zones of an earlier deploy"
            cp data/plzen-zones-last/zones.json site-plzen/data/
          else
            echo "::warning::no Plzeň parking zones"
          fi
      # Boston's and Cambridge's surface maps (towns/boston.js, PDDL): their roadways are a few polygons of the whole city,
      # too big for a click, so cut once into small tiles (data/us-plan, about 45 MB) by tools/build_planimetrics_us.mjs.
      # Built at most once a week (the cache's key is the week; the cities' servers are asked about 120 times, one request
      # at a time). Each city on its own: a city built takes the place of its earlier tiles, a city that failed keeps the
      # tiles of an earlier week; with neither, its profiles estimate and say the map is missing (its about.json, the mark
      # towns/boston.js looks for). The cache is saved only when every city was built: saved after a failure, the earlier
      # week's tiles would stand under this week's key and the build would not be tried again until the next week (the
      # hostile review of 26. 11. 2026). (v2: the tiles of before the marks are not taken.)
      - id: us-plan-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: us-plan-cache
        uses: actions/cache/restore@v4
        with:
          path: data/us-plan-last
          key: us-plan-v2-${{ steps.us-plan-week.outputs.week }}
          restore-keys: us-plan-v2-
      - name: Boston surface maps
        id: us-plan
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if [ "${{ steps.us-plan-cache.outputs.cache-hit }}" != "true" ]; then
            if node tools/build_planimetrics_us.mjs site-us-plan; then
              echo "complete=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::the surface map of Boston or Cambridge did not answer, that city keeps the tiles of an earlier deploy"
            fi
            mkdir -p data/us-plan-last
            for d in site-us-plan/*/; do
              c=$(basename "$d")
              [ -f "$d/about.json" ] || continue
              rm -rf "data/us-plan-last/$c" && cp -R "$d" "data/us-plan-last/$c"
            done
            [ -f site-us-plan/about.json ] && cp site-us-plan/about.json data/us-plan-last/about.json || true
          fi
          rm -rf site-us-plan
          if [ -d data/us-plan-last ]; then cp -R data/us-plan-last site-us-plan; fi
          for c in boston cambridge; do [ -f "site-us-plan/$c/about.json" ] || echo "::warning::no surface map of $c, profiles there estimate and say so"; done
      - name: Save Boston surface maps
        if: steps.us-plan.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/us-plan-last
          key: us-plan-v2-${{ steps.us-plan-week.outputs.week }}
      # Everything built above (site-zps.json, site-osm/, site-built-up-age/, site-us-plan/, site-<city>/data) is put together
      # with the app by tools/build_site.mjs: the app in _site/profily/, the root pages and the redirects of the old addresses
      # beside it, the versions of the modules last (the file's header says what each input is). Only the secrets stay here.
      - name: Assemble the site
        env:
          MAPY_KEY: ${{ secrets.MAPY_KEY }} # Mapy.com key for the street panorama; empty → a plain link instead
          LOG_URL: ${{ vars.LOG_URL }} # the Worker keeping the log of cuts (logging/README.md); empty → no log
          DK_TOKEN: ${{ vars.DK_TOKEN }} # Dataforsyningen token (Denmark's orthophoto and address search; public in the page by design); empty → the estimate from OSM
        run: node tools/build_site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The longest deploy-pages allows (10 min); with the OSM tiles packed (two files) it takes under a minute.
          timeout: 600000
