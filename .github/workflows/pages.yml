# Publishes the app (pilot/public) on GitHub Pages as a static site: the browser asks IPR, the cities'
# GIS and ČÚZK directly, and the OSM tiles of the whole Czech Republic (one set for every city) are built
# here from Geofabrik's extract once a week (they are not kept in the repository; a deploy in the same week
# reuses them from the Actions cache unless the tile scripts changed). Runs on push to main, by hand, and weekly
# so the OSM data stays fresh.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Syntax of every script and the unit tests (tests/): a failing check stops the deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This week's tiles, built by the same tile scripts: a deploy reuses them and skips the build (Bára:
      # the weekly refresh is enough while their extent does not change).
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # One tar file in the cache: actions/cache fails on the 245 000 files themselves (call stack exceeded).
      - id: tiles-cache
        uses: actions/cache@v4
        with:
          path: osm-tiles.tar
          key: osm-tiles-${{ steps.week.outputs.week }}-${{ hashFiles('tools/build_osm_tiles.mjs', 'tools/build_osm_data.sh', 'pilot/public/osmtile.js') }}
      - name: Install GDAL (ogr2ogr)
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends gdal-bin
          ogr2ogr --version
      # Geofabrik's Czech Republic is kept in the Actions cache: a deploy reuses this week's copy, a new week
      # downloads a fresh one and falls back to the last copy when download.geofabrik.de is unreachable.
      - id: pbf-cache
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: data/osm/cz.osm.pbf
          key: osm-cz-pbf-${{ steps.week.outputs.week }}
          restore-keys: osm-cz-pbf-
      - name: Download the OSM extract
        if: steps.tiles-cache.outputs.cache-hit != 'true' && steps.pbf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/osm
          if curl -fL --retry 3 --retry-delay 20 --connect-timeout 30 -o /tmp/cz.osm.pbf \
               https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf; then
            mv /tmp/cz.osm.pbf data/osm/cz.osm.pbf
          elif [ -f data/osm/cz.osm.pbf ]; then
            echo "::warning::no fresh OSM extract, using the cached one from an earlier week"
          else
            exit 1
          fi
      # The tiles of the whole country (about 700 MB): every city site reads them from ../data/osm-tiles.
      - name: Build OSM tiles
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: |
          NAME=cz tools/build_osm_data.sh data/osm/cz.osm.pbf site-tiles
          tar -cf osm-tiles.tar site-tiles
      - name: OSM tiles from the cache
        if: steps.tiles-cache.outputs.cache-hit == 'true'
        run: tar -xf osm-tiles.tar && ls site-tiles | wc -l
      # The zone file of the last good deploy is kept in the Actions cache: when IPR does not answer
      # now, that one goes out; with neither, the deploy stops (without it many more cuts would be
      # guesses).
      - id: zps-cache
        uses: actions/cache@v4
        with:
          path: data/zps-last.json
          key: zps-${{ github.run_id }}
          restore-keys: zps-
      - name: Paid parking zones (once per deploy, not on every click)
        run: |
          if node tools/build_zps.mjs site-zps.json; then
            mkdir -p data && cp site-zps.json data/zps-last.json
          elif [ -f data/zps-last.json ]; then
            echo "::warning::IPR did not answer, using the zone file of an earlier deploy"
            cp data/zps-last.json site-zps.json
          else
            echo "::error::no zone file (data/zps.json) and none cached"; exit 1
          fi
      # The age of the built-up area (IPR "Vývoj zástavby", CC BY), once per deploy into static tiles:
      # a default for the look of flat-roofed houses. Without it the app judges by the house alone.
      - name: Built-up area by period
        continue-on-error: true
        timeout-minutes: 10
        run: node tools/build_vyvoj.mjs site-vyvoj
      # Prague's open data (Geoportál Praha, CC BY 4.0): trees and tree rows, TSK's no-parking sections and
      # street classes, downloaded once per deploy from opendata.geoportalpraha.cz into small tiles
      # (data/praha/opendata, about 6 MB), never on a click. When the download fails, the tiles of the last
      # good deploy (cache); with neither, the profiles go without them.
      - id: praha-opendata-cache
        uses: actions/cache@v4
        with:
          path: data/praha-opendata-last
          key: praha-opendata-${{ github.run_id }}
          restore-keys: praha-opendata-
      - name: Prague open data
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p site-praha/data
          if node tools/build_praha_opendata.mjs site-praha/data; then
            rm -rf data/praha-opendata-last && mkdir -p data/praha-opendata-last && cp -R site-praha/data/opendata data/praha-opendata-last/
          elif [ -d data/praha-opendata-last/opendata ]; then
            echo "::warning::opendata.geoportalpraha.cz did not answer, using the open data of an earlier deploy"
            rm -rf site-praha/data/opendata && cp -R data/praha-opendata-last/opendata site-praha/data/
          else
            echo "::warning::no Prague open data, profiles go without its trees, no-parking sections and street classes"
          fi
      # Brno (/brno/): the same app; like Prague it asks the city's services on a click (MTVU, the
      # technical-map drawing and buildings on gis.brno.cz). Built here: the paid parking of
      # parkovanivbrne.cz; without it the profiles estimate the parking.
      - id: brno-parking-cache
        uses: actions/cache@v4
        with:
          path: data/parkovani-brno-last
          key: brno-parking-${{ github.run_id }}
          restore-keys: brno-parking-
      - name: Brno parking
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mkdir -p site-brno/data
          # Paid parking from the parkovanivbrne.cz map (current, unlike the 2/2024 export on data.brno.cz);
          # when the map does not answer, the files of the last good deploy.
          if node tools/build_parkovani_brno.mjs site-brno/data; then
            mkdir -p data/parkovani-brno-last && cp -R site-brno/data/parkovani data/parkovani-brno-last/
          elif [ -d data/parkovani-brno-last/parkovani ]; then
            echo "::warning::parkovanivbrne.cz did not answer, using the parking of an earlier deploy"
            cp -R data/parkovani-brno-last/. site-brno/data/
          else
            echo "::warning::no Brno parking data, profiles estimate the parking"
          fi
      # The towns (Jihlava, Most, Opava, Pardubice, Plzeň; tools/cities.mjs) ask the town's GIS or the
      # national DTM on a click and read the shared OSM tiles: nothing to build but Plzeň's zones.
      # Plzeň's paid parking zones: a static file of the city's open data (CC0), built at each deploy;
      # when it fails, the file of an earlier deploy (cache), else none (the profile estimates).
      - id: plzen-zones-cache
        uses: actions/cache@v4
        with:
          path: data/zony-plzen-last
          key: plzen-zones-${{ github.run_id }}
          restore-keys: plzen-zones-
      - name: Plzeň parking zones
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p site-plzen/data
          if node tools/build_zony_plzen.mjs site-plzen/data; then
            mkdir -p data/zony-plzen-last && cp site-plzen/data/zony.json data/zony-plzen-last/
          elif [ -f data/zony-plzen-last/zony.json ]; then
            echo "::warning::opendata.plzen.eu did not answer, using the zones of an earlier deploy"
            cp data/zony-plzen-last/zony.json site-plzen/data/
          else
            echo "::warning::no Plzeň parking zones"
          fi
      - name: Assemble the site
        env:
          MAPY_KEY: ${{ secrets.MAPY_KEY }} # Mapy.com key for the street panorama; empty → a plain link instead
          LOG_URL: ${{ vars.LOG_URL }} # the Worker keeping the log of cuts (logging/README.md); empty → no log
        run: |
          mkdir -p _site/data
          cp -R pilot/public/. _site/
          sed -i 's/export const STATIC = false;/export const STATIC = true;/' _site/config.js
          grep -q "STATIC = true" _site/config.js
          # The key goes in as a JSON string (any characters are safe); GitHub masks it in the log.
          node -e 'const fs = require("fs"), f = "_site/config.js", k = process.env.MAPY_KEY || "";
            if (k) fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace("MAPY_KEY = \"\"", "MAPY_KEY = " + JSON.stringify(k)));'
          grep -q 'MAPY_KEY = ""' _site/config.js && echo "::warning::no Mapy.com key (secret MAPY_KEY), the panorama falls back to a link" || true
          # The log of cuts: the Worker's address into config.js, its origin into the page's CSP (connect-src).
          node -e 'const fs = require("fs"), u = process.env.LOG_URL || "";
            if (u) {
              const c = "_site/config.js"; fs.writeFileSync(c, fs.readFileSync(c, "utf8").replace("LOG_URL = \"\"", "LOG_URL = " + JSON.stringify(u)));
              const h = "_site/index.html"; fs.writeFileSync(h, fs.readFileSync(h, "utf8").replace(/(connect-src [^;]*)/, "$1 " + new URL(u).origin));
            }'
          grep -q 'LOG_URL = ""' _site/config.js && echo "::warning::no log of cuts (repository variable LOG_URL)" || true
          mv site-tiles _site/data/osm-tiles
          mv site-zps.json _site/data/zps.json
          [ -d site-vyvoj ] && mv site-vyvoj _site/data/vyvoj || echo "::warning::no built-up area tiles, flat roofs judged by the house alone"
          cp LICENCE-A-ZDROJE.md _site/data/LICENCE-A-ZDROJE.md
          # One page for the whole Czech Republic: the cities' own data under data/<city>/ (Brno's parking,
          # Plzeň's zones, Prague's open data), the former city sites as pages sending to it (old links keep working).
          for id in brno plzen praha; do
            if [ -d "site-$id/data" ] && [ -n "$(ls -A "site-$id/data")" ]; then mkdir -p "_site/data/$id" && cp -R "site-$id/data/." "_site/data/$id/"; fi
          done
          node tools/build_city_site.mjs _site
          cat > _site/data/README.txt <<'EOF'
          data/osm-tiles: dlaždice odvozené z OpenStreetMap (výřez Geofabrik Česká republika), pro všechna města.
          © přispěvatelé OpenStreetMap, licence ODbL 1.0 (https://opendatacommons.org/licenses/odbl/).
          Vytvořeno skriptem tools/build_osm_data.sh v repozitáři této aplikace.
          EOF
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The site has about 245 000 files (the OSM tiles of the Czech Republic): Pages needs more than the
          # default 10 minutes to sync them.
          timeout: 3600000
