# Publishes the app (pilot/public) on GitHub Pages as a static site: the browser asks IPR, the cities'
# GIS and ČÚZK directly, and the OSM tiles of the Czech Republic, Slovakia and Austria are built here from Geofabrik's
# extracts once a week, packed into one file per country (tools/pack_osm_tiles.mjs) and uploaded to Cloudflare R2
# (data.streetspace.eu), with the same files on Pages as a fallback (they are not kept in the repository; a deploy
# in the same week reuses them from the Actions cache unless the tile scripts changed). Runs on push to main, by
# hand, and weekly so the OSM data stays fresh.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Syntax of every script and the unit tests (tests/): a failing check stops the deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    # Building the tiles of the countries (CZ, SK, AT) takes most of it (about 60–90 min without the cache).
    timeout-minutes: 180
    env:
      # Whether the keys for R2 are set (a step's if cannot read secrets).
      R2_KEYS: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && vars.R2_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: week
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          # The states whose OSM tiles are built (tools/countries.mjs), for the cache keys and the extracts' paths (one a
          # line, as the paths were written here before). An empty list stops the deploy.
          KEY=$(node tools/countries.mjs --key); test -n "$KEY"
          echo "countries=$KEY" >> "$GITHUB_OUTPUT"
          { echo "pbf<<EOF"; for c in $(node tools/countries.mjs --list osm); do echo "data/osm/$c.osm.pbf"; done; echo "EOF"; } >> "$GITHUB_OUTPUT"
      # This week's packed tiles (site-osm: <country>-<date>.posm and index.json), built by the same scripts: a deploy
      # reuses them and skips the build (Bára: the weekly refresh is enough while their extent does not change).
      - id: tiles-cache
        uses: actions/cache@v4
        with:
          path: site-osm
          key: osm-pack-${{ steps.week.outputs.week }}-${{ steps.week.outputs.countries }}-${{ hashFiles('tools/build_osm_tiles.mjs', 'tools/build_osm_data.sh', 'tools/pack_osm_tiles.mjs', 'pilot/public/osmtile.js', 'pilot/public/osmpack.js') }}
      - name: Install GDAL (ogr2ogr)
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends gdal-bin
          ogr2ogr --version
      # Geofabrik's extracts are kept in the Actions cache: a deploy reuses this week's copies, a new week downloads
      # fresh ones and falls back to the last copies when download.geofabrik.de is unreachable.
      - id: pbf-cache
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.week.outputs.pbf }}
          key: osm-pbf-${{ steps.week.outputs.week }}-${{ steps.week.outputs.countries }}
          restore-keys: osm-pbf-
      - name: Download the OSM extracts
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/osm
          for c in $(node tools/countries.mjs --list geofabrik); do
            # This week's copy from the cache is enough (a country added later is still downloaded).
            if [ "${{ steps.pbf-cache.outputs.cache-hit }}" = "true" ] && [ -f "data/osm/${c%%:*}.osm.pbf" ]; then continue; fi
            if curl -fL --retry 3 --retry-delay 20 --connect-timeout 30 -o "/tmp/${c%%:*}.osm.pbf" \
                 "https://download.geofabrik.de/europe/${c#*:}-latest.osm.pbf"; then
              mv "/tmp/${c%%:*}.osm.pbf" "data/osm/${c%%:*}.osm.pbf"
            elif [ -f "data/osm/${c%%:*}.osm.pbf" ]; then
              echo "::warning::no fresh OSM extract of ${c#*:}, using the cached one from an earlier week"
            else
              exit 1
            fi
          done
      # The tiles of each country (Czechia about 1.3 GB in 246 000 files, Slovakia 0.5 GB), each packed into one file
      # (275 MB and 104 MB) named by the date and its content, so a reader never mixes two builds (a second build on the
      # same day gets another name); the loose tiles are not kept.
      - name: Build and pack OSM tiles
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        timeout-minutes: 110
        run: |
          mkdir -p site-osm
          for c in $(node tools/countries.mjs --list osm); do
            NAME=$c tools/build_osm_data.sh "data/osm/$c.osm.pbf" "tiles-$c"
            node tools/pack_osm_tiles.mjs "tiles-$c" "site-osm/$c-$(date -u +%F)-{hash}.posm"
            rm -rf "tiles-$c" data/osm/${c}_*.geojsonl
          done
          ls -l site-osm && cat site-osm/index.json
      # To Cloudflare R2 (bucket profily-ulic-osm in Bára's account, served at data.streetspace.eu): the files first,
      # index.json last, so the new week appears whole; files older than the last two builds are deleted. Only the
      # files not there yet go up (a deploy in the same week uploads nothing). Without the keys (secrets
      # R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and variable R2_ACCOUNT_ID) the step is skipped and the app reads the
      # files on Pages. Each file is one write (Class A) and a few more for the parts of a large one.
      - name: No R2 keys
        if: env.R2_KEYS != 'true'
        run: |
          echo "::warning::no R2 keys - Austria's OSM tiles are not uploaded and the app has none for Austria"
      - name: Upload OSM tiles to R2
        if: env.R2_KEYS == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2: s3://profily-ulic-osm/osm
          ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws configure set default.s3.multipart_chunksize 64MB
          for f in site-osm/*.posm; do
            if aws s3api head-object --endpoint-url "$ENDPOINT" --bucket profily-ulic-osm --key "osm/$(basename "$f")" > /dev/null 2>&1; then
              echo "$(basename "$f") is there"
            else
              aws s3 cp --endpoint-url "$ENDPOINT" "$f" "$R2/" --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
            fi
          done
          aws s3 cp --endpoint-url "$ENDPOINT" site-osm/index.json "$R2/index.json" --content-type application/json --cache-control "public, max-age=300"
          # Older builds: each country keeps its two newest files (by the time they were uploaded).
          for c in $(node tools/countries.mjs --list osm); do
            aws s3 ls --endpoint-url "$ENDPOINT" "$R2/" | sort -r | awk '{print $4}' | grep -E "^$c-[0-9a-f-]+\.posm$" | tail -n +3 | while read -r old; do
              aws s3 rm --endpoint-url "$ENDPOINT" "$R2/$old"
            done
          done
      # The zone file of the last good deploy is kept in the Actions cache: when IPR does not answer
      # now, that one goes out; with neither, the deploy stops (without it many more cuts would be
      # guesses).
      - id: zps-cache
        uses: actions/cache@v4
        with:
          path: data/zps-last.json
          key: zps-${{ github.run_id }}
          restore-keys: zps-
      - name: Paid parking zones (once per deploy, not on every click)
        run: |
          if node tools/build_zps.mjs site-zps.json; then
            mkdir -p data && cp site-zps.json data/zps-last.json
          elif [ -f data/zps-last.json ]; then
            echo "::warning::IPR did not answer, using the zone file of an earlier deploy"
            cp data/zps-last.json site-zps.json
          else
            echo "::error::no zone file (data/zps.json) and none cached"; exit 1
          fi
      # The age of the built-up area (IPR "Vývoj zástavby", CC BY), once per deploy into static tiles:
      # a default for the look of flat-roofed houses. Without it the app judges by the house alone.
      - name: Built-up area by period
        continue-on-error: true
        timeout-minutes: 10
        run: node tools/build_vyvoj.mjs site-vyvoj
      # Prague's open data (Geoportál Praha, CC BY 4.0): trees and tree rows, TSK's no-parking sections and
      # street classes, downloaded once per deploy from opendata.geoportalpraha.cz into small tiles
      # (data/praha/opendata, about 6 MB), never on a click. When the download fails, the tiles of the last
      # good deploy (cache); with neither, the profiles go without them.
      - id: praha-opendata-cache
        uses: actions/cache@v4
        with:
          path: data/praha-opendata-last
          key: praha-opendata-${{ github.run_id }}
          restore-keys: praha-opendata-
      - name: Prague open data
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p site-praha/data
          if node tools/build_praha_opendata.mjs site-praha/data; then
            rm -rf data/praha-opendata-last && mkdir -p data/praha-opendata-last && cp -R site-praha/data/opendata data/praha-opendata-last/
          elif [ -d data/praha-opendata-last/opendata ]; then
            echo "::warning::opendata.geoportalpraha.cz did not answer, using the open data of an earlier deploy"
            rm -rf site-praha/data/opendata && cp -R data/praha-opendata-last/opendata site-praha/data/
          else
            echo "::warning::no Prague open data, profiles go without its trees, no-parking sections and street classes"
          fi
      # Brno (/brno/): the same app; like Prague it asks the city's services on a click (MTVU, the
      # technical-map drawing and buildings on gis.brno.cz). Built here: the paid parking of
      # parkovanivbrne.cz; without it the profiles estimate the parking.
      - id: brno-parking-cache
        uses: actions/cache@v4
        with:
          path: data/parkovani-brno-last
          key: brno-parking-${{ github.run_id }}
          restore-keys: brno-parking-
      - name: Brno parking
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mkdir -p site-brno/data
          # Paid parking from the parkovanivbrne.cz map (current, unlike the 2/2024 export on data.brno.cz);
          # when the map does not answer, the files of the last good deploy.
          if node tools/build_parkovani_brno.mjs site-brno/data; then
            mkdir -p data/parkovani-brno-last && cp -R site-brno/data/parkovani data/parkovani-brno-last/
          elif [ -d data/parkovani-brno-last/parkovani ]; then
            echo "::warning::parkovanivbrne.cz did not answer, using the parking of an earlier deploy"
            cp -R data/parkovani-brno-last/. site-brno/data/
          else
            echo "::warning::no Brno parking data, profiles estimate the parking"
          fi
      # The towns (Jihlava, Most, Opava, Pardubice, Plzeň; tools/cities.mjs) ask the town's GIS or the
      # national DTM on a click and read the shared OSM tiles: nothing to build but Plzeň's zones.
      # Plzeň's paid parking zones: a static file of the city's open data (CC0), built at each deploy;
      # when it fails, the file of an earlier deploy (cache), else none (the profile estimates).
      - id: plzen-zones-cache
        uses: actions/cache@v4
        with:
          path: data/zony-plzen-last
          key: plzen-zones-${{ github.run_id }}
          restore-keys: plzen-zones-
      - name: Plzeň parking zones
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p site-plzen/data
          if node tools/build_zony_plzen.mjs site-plzen/data; then
            mkdir -p data/zony-plzen-last && cp site-plzen/data/zony.json data/zony-plzen-last/
          elif [ -f data/zony-plzen-last/zony.json ]; then
            echo "::warning::opendata.plzen.eu did not answer, using the zones of an earlier deploy"
            cp data/zony-plzen-last/zony.json site-plzen/data/
          else
            echo "::warning::no Plzeň parking zones"
          fi
      - name: Assemble the site
        env:
          MAPY_KEY: ${{ secrets.MAPY_KEY }} # Mapy.com key for the street panorama; empty → a plain link instead
          LOG_URL: ${{ vars.LOG_URL }} # the Worker keeping the log of cuts (logging/README.md); empty → no log
        run: |
          mkdir -p _site/data
          cp -R pilot/public/. _site/
          sed -i 's/export const STATIC = false;/export const STATIC = true;/' _site/config.js
          grep -q "STATIC = true" _site/config.js
          # The key goes in as a JSON string (any characters are safe); GitHub masks it in the log.
          node -e 'const fs = require("fs"), f = "_site/config.js", k = process.env.MAPY_KEY || "";
            if (k) fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace("MAPY_KEY = \"\"", "MAPY_KEY = " + JSON.stringify(k)));'
          grep -q 'MAPY_KEY = ""' _site/config.js && echo "::warning::no Mapy.com key (secret MAPY_KEY), the panorama falls back to a link" || true
          # The log of cuts: the Worker's address into config.js, its origin into the page's CSP (connect-src).
          node -e 'const fs = require("fs"), u = process.env.LOG_URL || "";
            if (u) {
              const c = "_site/config.js"; fs.writeFileSync(c, fs.readFileSync(c, "utf8").replace("LOG_URL = \"\"", "LOG_URL = " + JSON.stringify(u)));
              const h = "_site/index.html"; fs.writeFileSync(h, fs.readFileSync(h, "utf8").replace(/(connect-src [^;]*)/, "$1 " + new URL(u).origin));
            }'
          grep -q 'LOG_URL = ""' _site/config.js && echo "::warning::no log of cuts (repository variable LOG_URL)" || true
          # The packed OSM tiles also on Pages: where R2 does not answer, the app reads them here (gis.js).
          # Austria's file only on R2 (Bára 16. 11. 2026): with it the site would pass Pages' 1 GB.
          mkdir -p _site/data/osm-pack && for c in $(node tools/countries.mjs --list pages); do cp site-osm/$c-*.posm _site/data/osm-pack/; done
          node --input-type=module -e 'import fs from "fs"; import { COUNTRIES } from "./tools/countries.mjs"; const j = JSON.parse(fs.readFileSync("site-osm/index.json", "utf8")); for (const k of Object.keys(j.files)) if (!COUNTRIES[k]?.pages) delete j.files[k]; fs.writeFileSync("_site/data/osm-pack/index.json", JSON.stringify(j, null, 1))'
          mv site-zps.json _site/data/zps.json
          [ -d site-vyvoj ] && mv site-vyvoj _site/data/vyvoj || echo "::warning::no built-up area tiles, flat roofs judged by the house alone"
          cp LICENCE-A-ZDROJE.md _site/data/LICENCE-A-ZDROJE.md
          # One page for the whole Czech Republic: the cities' own data under data/<city>/ (Brno's parking,
          # Plzeň's zones, Prague's open data), the former city sites as pages sending to it (old links keep working).
          for id in brno plzen praha; do
            if [ -d "site-$id/data" ] && [ -n "$(ls -A "site-$id/data")" ]; then mkdir -p "_site/data/$id" && cp -R "site-$id/data/." "_site/data/$id/"; fi
          done
          node tools/build_city_site.mjs _site
          cat > _site/data/README.txt <<'EOF'
          data/osm-pack: dlaždice odvozené z OpenStreetMap (výřezy Geofabrik Česká republika a Slovensko; Rakousko jen na R2), jeden
          soubor na stát (index.json, formát v pilot/public/osmpack.js); tytéž soubory jsou na data.streetspace.eu/osm.
          © přispěvatelé OpenStreetMap, licence ODbL 1.0 (https://opendatacommons.org/licenses/odbl/).
          Vytvořeno skripty tools/build_osm_data.sh a tools/pack_osm_tiles.mjs v repozitáři této aplikace.
          EOF
          # The app at streetspace.eu/profily/ (Bára 16. 11. 2026); the root and old links send there (tools/build_root_site.mjs).
          mv _site _app && mkdir _site && mv _app _site/profily
          node tools/build_root_site.mjs _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The longest deploy-pages allows (10 min); with the OSM tiles packed (two files) it takes under a minute.
          timeout: 600000
