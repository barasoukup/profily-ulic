# Cloudflare Worker for Profily ulic (logging/README.md). database_id comes from `npx wrangler d1 create profily-ulic-log`.
name = "profily-ulic-log"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://streetspace.eu,https://barasoukup.github.io,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "profily-ulic-log"
database_id = "6674c597-2e83-4a25-aa8c-e65d7db75ed9"

# Every hour: the rate rows of the contact form's past hours are deleted (worker.js scheduled).
[triggers]
crons = ["17 * * * *"]

# The contact form's messages by e-mail (logging/README.md, Email Routing of streetspace.eu): no address here, the
# sender and the recipient are the Worker's secrets CONTACT_FROM and CONTACT_TO.
[[send_email]]
name = "MAIL"
